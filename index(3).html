oas, que fazem a fila e a RESPEITAM, para poderem ter uma foto sem nenhum desconhecido nela.\n\nA dica é: Chegue cedo, pois as pessoas mais educadas fazem isso e ainda formam a fila e a respeitam.\n\nTirando os guias de turismo e a multidão que - obviamente - se acumula num dos principais pontos turísticos do mundo, o local é maravilhoso!!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-11","dataVisitacao":"2022-08-01","comentario":"Como um \"must see\" e um marco da cidade . O Cristo Redentor Corcovado continua lindo... Quando o tempo permite, pode se ter uma vista privilegiada da Cidade.\nUma dica fica que o acesso ao Cristo se faz apenas por meios: do bondinho , vans  e ou veículos credenciados. \nSeguindo o pacote de turista ...sugiro o acesso pelo bondinho no bairro laranjeiras  é  o mais bucólico e interessante.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-11","dataVisitacao":"2022-08-01","comentario":"Lugar lindo, com vista maravilhosa! Deve fazer parte do roteiro de pontos essenciais quando se conhece o Rio de Janeiro!\nTrem para subir confortável, preço não muito barato mas vale a pena! Sugestão de usarem autofalantes no trem pois são dadas informações por uma pessoa mas a maioria não ouve e não entende o que fazer quando o trem faz algumas paradas.\nSugestão de colocarem musica brasileira no trem ou lá em cima para contribuir mais ainda com a bela experiência! Muito lindo!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-11","dataVisitacao":"2022-07-01","comentario":"O lugar é muito lindo. A sensação é indescritivel.. Recomendo chegar cedo, pois o local fica lotado.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-10","dataVisitacao":"2022-08-01","comentario":"Sin duda vale la pena. Fui en invierno y la cantidad de gente es muy agradable. De no ser así, no recomiendo ir, puesto que con mucha gente la experiencia puede ser molesta. No vale la pena comprar entradas online en invierno, es mejor contactar al hotel y contratar van que salen de algunas plazas, mucho más barato. También vale la pena llegar en tren y no taxi, es más barato (puesto que el taxi te cobra por esperar) y muy lindo.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-10","dataVisitacao":"2022-07-01","comentario":"Viajar ao Rio e nao conhecer o Cristo, não é uma viagem ao Rio. Tive o prazer de retornar ao querido RJ, dessa vez com minha mãe, e mostrar a ela todas as maravilhas que ela só via pela TV.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-08","dataVisitacao":"2022-07-01","comentario":"É um lindo, vistas lindas, e quem vai no rio a primeira vez precisa conhecer. Indico super de trenzinho","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-05","dataVisitacao":"2022-08-01","comentario":"Great views of the city, specifically if you go by the small train. Also it is better to go on a city tour since it is cheaper then buying individual tickets for each attraction","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-04","dataVisitacao":"2022-07-01","comentario":"בתאריך 4.8.2022 חזרנו מטיול לאוסטריה ושוייץ הנופים מדהימים ועוצרי נשימה.\nעל ההנאה מהטיול העיבה המדריכה דבורה ויקסמן שמשך כל הטיול התיחסה אלנו כאילו זה טיול של כיתה טיפולית לא נוצר שום חיבור עם המדריכה שגילתה חוסר התמצאות במרחב וטעתה פעם אחר פעם. ידע מינימלי. חוסר התחשבות בנו תוך התעלמות מבקשות וקביעה מתי מגעים לחדר האוכל במלון\nהתעלמות מבקשות לעצירה לשרותים. בכל האתרים היא התקדמה בלי להתחשב בשאר הקבוצה. לא הייתה שום בקשה שנענתה.נוצר מצב שמדריכה נשארה לבד או עם אנשים בודדים באתרים. מדריכה צריכה לחבר בין האנשים בקבוצה ולהפוך את הקבוצה להומוגנית מה שלא נעשה.\nכל חברי הקבוצה עברו את הגיל של תלמידי בית ספר ולא זקוקים לטיפול. ההתממרות והכעס ליוו את כל הטיול.\nכמובן שאני כותב בשמי בלבד ולא בא לייצג איש.\nמבחינת רימון טיולים חשוב לבחור במדריך שבקי באתרים ויודע לנהל קבוצה ומתמצא במרחב ולא טועה פעם אחר פעם.\nהמלון השני שנבחר היה ללא מזגן בחדר וללא מני בר בימים כאלה שמזג האוויר יכול להיות חם מאד חשוב שיהיה מזגן בחדר.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-08-03","dataVisitacao":"2022-07-01","comentario":"Pelo menos uma vez deve-se ir ao Cristo. A subida e o visual lá de cima são muito bonitos e vale super a pena!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-03","dataVisitacao":"2022-07-01","comentario":"Es una atracción maravillosa.\nHay que asegurarse de ir en un día muy despejado para disfrutarlo a pleno.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-02","dataVisitacao":"2022-08-01","comentario":"Mesmo nublado estava excelente. É sabido que nessa época do ano, por volta das 16 horas, tem uma névoa no Corcovado. Porém é um lugar deslumbrante mesmo assim, fica mais vazio, fácil de andar e tirar foto. \n\nNão vai perder a viagem.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-01","dataVisitacao":"2022-07-01","comentario":"top!!!! so achei apertado la em cima aos pés de Cristo nosso Senhor...tinha muita gente....aconselho a comprar pelo site o ingresso e pegar a vam em 1 dos pontos marcados...","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-31","dataVisitacao":"2022-07-01","comentario":"A ida ao Corcovado é obrigatória para quem vem ao Rio de Janeiro mas desta vez achei um pouco desorganizado em alguns pontos: 1. Compramos com antecedência o ingresso mas lá em baixo antes de pegar o trem não tinham informações claras de como trocar o ingresso! Muita gente furando fila! O segundo ponto negativo foi a quantidade de pessoas lá em cima para ver o Cristo! Muita, mas muita gente mesmo!!! Acho que talvez valha a pena ir bem cedo para pegar menos pessoas e poder tirar melhores fotos sem tanta aglomeração!","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-07-29","dataVisitacao":"2022-06-01","comentario":"O Concovado tem uma vista maravilhosa com certeza vale a pena ir conhecer conseguimos vários cliques.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-29","dataVisitacao":"2022-07-01","comentario":"Nós compramos os ingressos direto no site (não recomendo os cambistas que ficam lá na frente)\n\nFila bagunçada no início, na entrada. Mesmo quem compra o ingresso (que não é barato) antecipadamente na entrada acaba ficando na mesma fila de quem vai comprar na hora. \n\nO Cristo é perfeito. É tudo de bom. \n\nMas há poucas opções de café lá em cima. Super lotação e dificuldades para tirar uma simples foto te aguardam.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-07-28","dataVisitacao":"2022-07-01","comentario":"Este era el paseo que menos interés tenía en realizar, por lo caro, caótico y corto de tiempo, tenía toda la razón, pero existe el dicho carioca que dice así “si usted viene a Rio y no sube al Corcovado ni al Pan de Azúcar, usted nunca estuvo en Rio”, por esa razón no me negué a llevar a cabo este paseo con mis nietos.\n\nLucía insistía en que quería que todos subiéramos en el bondinho del Cristo Redentor, un tren que te lleva hasta los pies mismo del Cristo, su valor 135 Reales o 25 dólares por persona, el paseo el doble más caro de todos los que realizamos en Rio de Janeiro, además no tienes ningún descuento para los extranjeros, su compra se puede realizar por internet y fijar el día y la hora de asistencia, siendo muy cómoda la solución el problema es, que no lo puedes cambiar, aunque el día esté lluvioso; otra alternativa es llegar hasta la puerta misma de la boletería y hacer la fila de compra y rogar que el horario de salida que te toque sea lo más pronto posible, eso significa unas dos horas de espera, para nosotros significaba cinco horas,  tercera alternativa, bajarte en la estación de metro Largo do Machado y comprar el boleto para la VAN oficial, la cual te lleva hasta el cristo en ese mismo momento si quieres, la única condición es que debe completarse la VAN con la máxima de capacidad de pasajeros, cuarta alternativa llegar hasta las voleterias, subirte a los vehiculos que están afuera entregando el servicio, pagar un sobre precio un poco mayor que la mitad del valor, te dejan en la mitad del cerro, desde allí debes negociar con otro guía que te ofrece subirte inmediatamente en otra VAN por otro pequeño sobre precio, en definitiva el valor original que es 135 reales salio por 160 reales por persona, una vez en la base del cristo pudimos apreciar rRio en 360 grados, el pequeño lugar se encontraba completamente saturada de gente.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-07-28","dataVisitacao":"2022-07-01","comentario":"Tentamos conhecer o Cristo em 2011 mas choveu. Tentamos em 2017 e o tempo estava nublado. Finalmente em 2022 no mês de julho conseguimos visitar o Cristo redentor. O dia estava lindo e sem nuvens. Foi difícil conseguir boas fotos devido a lotação mas mesmo assim foi incrível.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-28","dataVisitacao":"2022-07-01","comentario":"Visitei o Cristo no dia 26/07 e como já era esperado o lugar estava lotado! Muita fila e pouca opção de alimentação (na verdade, apenas um estabelecimento com o atendimento demorada). Não recomendo a visita em alta temporada. Vista linda.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-07-25","dataVisitacao":"2022-07-01","comentario":"Com acesso rodoviário e ferroviário, tudo é seguro e bem controlado. No entanto, penso que deveria haver um controle mais rígido do volume de pessoas que acessam o Cristo, que às vezes compromete até a tomada de boas fotos.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-24","dataVisitacao":"2022-07-01","comentario":"É uma visita necessária e indispensável, apesar de muito cansativa. Meu filho de 10 anos ainda não conhecia, por isso fizemos o passeio. Haja paciência para muitas e muitas filas, tem que ter calma para enfrentar todo o processo de subida. E quando chega no destino, é totalmente LOTADO, impossível tirar boas fotos. Mas, apesar de tudo isso, vale a pena, pois é uma das sete maravilhas do mundo moderno é realmente a vista é linda. Da paisagem consegue-se boas fotos, não consegue são boas fotos com o Cristo ao fundo, mas com uma dose extra de paciência pode ter algumas boas fotos.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-07-23","dataVisitacao":"2022-07-01","comentario":"Magnifique. Recommande l'option de prendre la navette depuis le centre de la ville vers le Christ. C'est le moins cher et le plus rapide.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-23","dataVisitacao":"2022-07-01","comentario":"Tips importantes\n\n1 no es necesario ir temprano.  Lo ideal es después de las 13/14 que se fueron los tours\n\n2 no tomar el tren que a la vuelta las colas son enormes \n\n3 y la más importante un uber te lleva sin problema hasta l salida de los buses pero al regreso NOOOOO hay señal de WiFi\nPor ende no podrás llamar a un uber y se encuentra la mafia de los taxis y de los empleados que están afuera del cristo ( no pertenecen a la empresa) y te piden cualquier precio por bajar más cuando te ven con niños y les das la impresión que estás preocupado por regresar\n4 llevar agua, zapatos cómodos, gorro y anteojos \n5 sabe que sacar fotos arriba es cuestión de paciencia y más paciencia \n6 los videos en español que hay en YouTube haciendo propaganda del cristo tómalo con \"pinzas \" muchos comentarios no son realistas \n\nComo \"anda al atardecer que es hermoso \"...yo le diría baja vos después por esa zona...un peligro !!\nO que bueno el tren para subir...porque no te diste cuenta que sale más de 80 reales por persona y la cola de vuelta es una locura\n\nEn conclusión arregla que un taxi o un uber te espere a una hora determina para volver\nNo es necesario un tour para ver el cristo","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-07-21","dataVisitacao":"2022-07-01","comentario":"A highly rewarding and enjoyable hike through the jungle if you want to walk and I’d highly recommend it!! \n\nTook me 2hrs 15mins and is stated as a 2-3hr walk starting off in the beautiful Parque Lage. I set off at 10:00am and met other people on the way which makes you feel better knowing there are other hikers on the route. Just carry what you really need in terms of valuables. I left my wallet at home and just took little cash and one bank card. \n\nOf course just the most epic view and experience from the top and would do the same again going back up there. \n\nBrian \n\nI took one of the mini buses back down","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-18","dataVisitacao":"2022-07-01","comentario":"O Cristo Redentor de símbolo do catolicismo da Arquidiocese do Rio de Janeiro se tornou um ícone cultural do Brasil e, quiçá, de toda a América Latina.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-13","dataVisitacao":"2022-07-01","comentario":"Cada vez que vamos ao Rio, sempre visitamos o Cristo redentor no Corcovado e a emoção se estar ali é algo transcendental. Sempre lotado de visitantes, as fotos não ficam boas, mas a experiência é gratificante.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-10","dataVisitacao":"2022-07-01","comentario":"Activité très agréable, réalisée le matin vers 8h30, il y avait déjà du monde.\nA l’arrivée, achat des tickets pour la montée en train (ou funiculaire comme ils disent) puis on monte et après l’ascenseur ou les escaliers, on arrive au Christ.\nUne vue splendide, mais trop de monde, tout le monde veut la photo donc pas facile.\nAprès la vue et les photos, on s repris le train, et voilà. Nous avons fait cette activité seule en prenant un taxi de l’hôtel.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-07-08","dataVisitacao":"2022-06-01","comentario":"Fomos em grupo, pelo trem que dá acesso. \nO acesso ao trem estava bem sinalizado, e havia funcionários para orientação, entretanto, a fila para embarque não existe e todos ficam amontoados, o que gera desconforto (para quem é de São Paulo,  lembrou a estação Brás em dia de pico) e isso se repete no retorno. entretanto, após o embarque o deslocamento foi muito tranquilo, e a vista era muito bonita. O funcionário que conduziu o trem avisou o momento de tirar foto da vista e reduziu a velocidade. A condição do trem estava em perfeito estado e havia ítens de segurança.\nNo desembarque foi possível localizar apenas uma lanchonete aberta (fomos no final de semana) e uma loja de souvenirs. Apesar de ter bastante gente visitando, se tiver paciência dá para fazer um bom registro fotográfico com o Cristo, mas a vista é realmente uma beleza à parte!","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-07-06","dataVisitacao":"2021-08-01","comentario":"O acesso por bondinho é caro e são poucos momentos onde temos vista boa. Chegando no  Corcovado, parece meio abandonado. Não existem mais restaurantes e lanchonete. E até as lojas de souvenirs que restaram estão bem fracas. Compra-se lembranças melhores no calçadão de Copacabana e Ipanema","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-07-06","dataVisitacao":"2022-06-01","comentario":"Local lindo, cheio de benças, local lindo, vale muito a pena fazer uma visita, não deixe de ir, fica a dica.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-06","dataVisitacao":"2022-07-01","comentario":"A expectativa de ver o Cristo  de perto, uma das 7 maravilhas  do mundo, foi frustrada pela malandragem dos cambistas.  Eles se apresentam como guias cadastrados do evento, com crachá  e uniforme. Abordam os turistas logo que descem dos táxis  e nos fazem acreditar que a próxima  Van , que dá  acesso ao Cristo  só  sairá  dentro de 2h, mas que ele, o cambista disfarçado  de agente de turismo do local, tem ingressos   já  tirados com embarque  imediato  nas vans. Claro que é  bem mais caro. Você  acredita porque  tem cartazes para todo lado proibindo  a prática  e policiais bem perto deles que dão  a entender que não são \nbandidos. Uma pena!","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-07-05","dataVisitacao":"2021-08-01","comentario":"I cannot stop thinking about this trek.  Seeing Christ the Redeemer up close was Spiritual, didn't wanna leave. The weather was perfect at this time of the year.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-02","dataVisitacao":"2022-06-01","comentario":"Fiz a experiência subindo através do trem do corcovado, que tornou até a subida um passeio interessante. No trem, todos os passageiros tem lugares sentados. Já lá em cima, você pode subir o restante do caminho até o Cristo pelas escadarias ou por elevadores e escadas rolantes. Há algumas lojinhas no caminho dessas escadarias e algumas lanchonetes. Há, no pé do Cristo, uma capelinha muito aconchegante e bem cuidada. No ingresso estava escrito que teríamos a vista parcial do Cristo, devido ao nevoeiro, mas para nossa surpresa, a visão estava perfeita! O passeio vale muito a pena!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-01","dataVisitacao":"2022-06-01","comentario":"Fortunately the weather was clear on the day of our visit. The views are incredible; however, so are the crowds. Take plenty of patience with you as many people are trying to get that perfect picture with the Redeemer. We did not do a tour but took an Uber to the visitor center and the train. Very easy and inexpensive to get to using Uber.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-07-01","dataVisitacao":"2021-07-01","comentario":"Não tem como negar: a vista do alto do Corcovado, aos pés do Critos é sem-igual, deslumbrante. No entanto eu recomendo que voce vá em dias de sol, pois em dias nublados as nuvens cobrem o Cristo","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-30","dataVisitacao":"2022-03-01","comentario":"Corcovado – Cristo Redentor\nCorcovado é um dos morros da cidade do Rio de Janeiro, onde está a estátua do Cristo Redentor.\nO morro do Corcovado possui 710 metros de altura, e está dentro do Parque Nacional da Tijuca, que fica próximo ao Centro da cidade. A primeira expedição oficial ao morro foi em 1824, liderada por D.Pedro I. Já existia a intenção de construir no topo do morro um monumento religioso, comum na época e durante muitos anos.\nVários projetos foram lançados e abandonados. Após a assinatura da Lei Áurea, em 1888, até a intenção de homenagear a Princ.Isabel com uma estátua, foi sugerida. Que ela agradeceu e rejeitou. \nEm 1921, próximo ao centenário da Independência, a ideia de uma estátua do Cristo Redentor, começou a virar realidade. Após vários projetos, escultores e engenheiros, começaram a construção da estátua, que dura de 1922 a 1931.\nA estátua do Cristo Redentor completou 90 anos em 12 de outubro de 2021. Aconteceram várias comemorações.\nÉ feita de concreto armado, e revestida de pedra sabão, com 30 metros de altura, e 28 metros de envergadura. Pesa 1145 toneladas. Em 2007, foi eleita informalmente, uma das Sete Maravilhas do Mundo Moderno. Em 2012, a UNESCO considerou o Cristo Redentor como parte da paisagem do Rio de Janeiro incluída na lista de Patrimônio da Humanidade. É considerado um dos maiores símbolos da América Latina. Recebe em média a visitação de 2 milhões de turistas por ano.\nUm dos acessos ao morro e ao Cristo Redentor, é o Trem do Corcovado, que também é uma atração. É uma linha férrea que começa no bairro do Cosme Velho e segue até o cume. A linha foi inaugurada em outubro de 1884 pelo imperador Dom Pedro II. E foi aberta à visitação, em 1931. O trajeto dura aproximadamente 20 minutos.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-30","dataVisitacao":"2022-02-01","comentario":"When I was reading the 7 wonders of the world as a kid, I never thought that one day I would be in front of one of them.  It was a really meaningful visit for me.  A must see place.  You can use Uber to reach here, or you can use the buses departing from the city center of Rio.  However, my suggestion is to go with Uber because it is economical.  You cannot reach the monument by direct taxi or bus.  You can reach Cristo Redentora by using the cable car / funicular using the stations.  You get used to the ticket here.  If it's foggy above, tickets are cheaper, don't forget that.  If you want to buy cheaper and more souvenirs for your loved ones, I recommend the vendors on Copacabana and Ipanema beaches, not the souvenir shops here.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-25","dataVisitacao":"2022-06-01","comentario":"Local lindo com uma vista fantástica, além de toda aquela parte religiosa! Simplesmente fantástico! Ainda tem uma capelinha no pé do Cristo, se der sorte, pode pegar uma celebração ali! \nCuidar a data da visitação. Finais de semana e feriado costumam ser muito movimentados. Fomos em um feriado e estava LOTADO! \nObservar a previsão do tempo também é muito interessante!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-25","dataVisitacao":"2022-06-01","comentario":"Muito boa a experiência. Tudo muito organizado. Fácil de chegar, acessar e sair. Sugiro o trem do corcovado, na maior parte do deslocamento a visão é apenas da mata, mas vale o passeio e a sensação.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-24","dataVisitacao":"2022-05-01","comentario":"Es muy lindo tur, muy visitado, mucha gente, hacerlo dias despejados y con sol, tambien visitar el barrio de la zona","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-24","dataVisitacao":"2022-04-01","comentario":"Experiência única, vale muito a pena, a única questão é que o lugar é bem cheio e fica difícil fazer boas fotos, fora isso é maravilhoso!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-23","dataVisitacao":"2022-06-01","comentario":"Fui no local na véspera da maratona do RIO e estava muito cheio impossível de curtir com tranquilidade.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-06-23","dataVisitacao":"2022-05-01","comentario":"Imponente e impresionante . Siempre me asombro cuando lo veo . Esta muy bien hecho , es un lugar icónico de  Río. Tienes una vista preciosa desde ahí . Eso si, siempre hay  mucha gente","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-21","dataVisitacao":"2022-06-01","comentario":"Vale super a pena visitar esse cartão postal do Rio. A perfeição é um dia ensolarado, longe de fina de semana e feriados. Se tiver essa sorte, não perca!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-18","dataVisitacao":"2022-06-01","comentario":"jesus cristo esta presente en este sitio , quiero vbolver otras veces con mis hijos y con las novias","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-13","dataVisitacao":"2022-03-01","comentario":"And excelente view of Rio de Janeiro, you can expect a lot of people and selfies too! But despite that, the place and the Cristo is beautiful!!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-04","dataVisitacao":"2022-03-01","comentario":"around ticket office some drivers offer car ride to the christ, they say it takes time to go by train, it is expensive and other rubbish suggestions which is truly wrong. getting to the top point by train is really a nice experience.\nChrist is the first Must see of Rio in my opinion, the symbol of Rio and a real wonder.\ni could see the christ via my short helicopter flight which gave me this opportunity to see the statue from other view, was fantastic, amazing.\nmost of the time is crowdy and it would make it worse if it rains.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-06-03","dataVisitacao":"2022-05-01","comentario":"Cerca de 20 minutos de carro, muito rápido, tranquilo e fácil de chegar.  Fomos de uber e tudo  correu como o esperado.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-03","dataVisitacao":"2022-01-01","comentario":"Quer ter a sensação de voar, pegue o bondinho do pão de açúcar e voe, vista panorâmica, vista de todo Rio de Janeiro.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-02","dataVisitacao":"2022-05-01","comentario":"me encantó la visita , muchas personas , hermosa vista, idealmente es mejor subir en un dia no nublado.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-02","dataVisitacao":"2021-07-01","comentario":"Sempre ouvi falar cidade maravilhosa! Mas maravilhoso mesmo é esse Cristo que abençoa essa cidade!❤️","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-06-01","dataVisitacao":"2022-05-01","comentario":"Fantástico , vista deslumbrante da cidade maravilhosa , com elevadores bacanas , funcionários educados , solícitos , acesso fácil , existe uma capela muito bonita  ......","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-31","dataVisitacao":"2022-03-01","comentario":"Fui cedo, um dos primeiros horários. Não peguei fila para a Van, em compensação já estava bem cheio lá em cima.. Dá pra tirar fotos legais, mas o melhor mesmo é a vista. Vá num dia de céu aberto e aproveite.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-05-31","dataVisitacao":"2022-04-01","comentario":"Não dá para ir no Rio de Janeiro e não visitar o Corcovado e o Cristo Redentor.\nO local é uma das 7 maravilhas do mundo moderno e, apesar de já existirem estátuas maiores pelo Brasil, este lugar é único.\nA vista da cidade do Rio de Janeiro é espetacular, além, é claro, das fotos com a estátua e com a vista.\nSubimos de trem, mas é possível fazer também o acesso com as vans (mas de trem é mais bonito).\nMelhor chegar cedo, pois ao longo da manhã o movimento vai aumentando, ficando cada vez mais difícil tirar uma boa foto sem aparecer algum desconhecido na imagem. Por isso é bom embarcar no primeiro trem ou na primeira van.\nUm dos restaurantes do local estava fechado, por isso, podem existir poucas opções de alimentação, sendo mais aconselhável se alimentar no Centro de Visitantes, onde existe um bom café.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-31","dataVisitacao":"2022-05-01","comentario":"Be prepared to be pushed and shoved  by the  crowds at the top.\n\nUnless you are a genius with a camera and can work out some clever angles  you are highly unlikely to be able  to get that perfect shot  without a stranger photobombing your picture.\n\nDont bother  waiting fro a space to appear , it will just get filled  quickly by the endless  hoarders of new visitor  who arrive but don't seem to leave.\n\nYou may get a clear  shot of  just the statue  from the rear or if you are very tall . \n\nbest to spend your time at the top  looking at the views","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-05-30","dataVisitacao":"2021-12-01","comentario":"Lugar lindo e cheio de energia positiva! \nExperiência magnífico!\nFuncionários educados e prestativos.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-26","dataVisitacao":"2021-11-01","comentario":"El día estaba sombrío mis fotos salieron opacas. Recomiendo tener en cuenta que el día esté muy soleado para tener lindas fotos de recuerdo","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-05-23","dataVisitacao":"2022-05-01","comentario":"Sinceramente, não iria mais ,vale apenas para você dizer que conheceu apenas,nosso passeio lá em cima não durou mais que meia hora ,e é porque fui em baixa estação,era um empunhado de gente ,você não consegue nem bater uma foto  com o tumulto ,um monte de gente se apertando em um lugar ínfimo.horrível!!!!","companhia":"FRIENDS","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2022-05-21","dataVisitacao":"2022-04-01","comentario":"A railway takes you to the top for a spectacular view of the statue and of Rio! A real surprise when seeing the statue close up to see what it is covered in....won't spoilt the surprise here...","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-19","dataVisitacao":"2022-02-01","comentario":"Soooooooooooo \nBeeeeeeeeeaaaaaaaauty\nI want to back other day\nIncrible, I love Rio.\nMy pictures are wonderful\nI'm Loving","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-18","dataVisitacao":"2022-05-01","comentario":"Ponto positivo que todo mundo já sabe, a vista é espetacular, consegue se ver de todos ângulos a cidade maravilhosa.\nPonto negativo, que todo mundo já sabe também, é o excesso de pessoas, fomos sábado de manhã bem cedo, mas não teve jeito, é muita gente.\nVale a pena para conhecer uma primeira vez.\nSubimos de van, é um conselho que dou, faça o mesmo.","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-05-17","dataVisitacao":"2022-05-01","comentario":"A vista do Cristo á maravilhosa, porém a experiencia de subir pela trenzinho é muito ruim. Comprei o ticket pela internet, chegando no local tem somente um guichê para você poder imprimir o ticket (é obrigado imprimir lá) e os funcionários não conseguem instruir e organizar de maneiras eficiente as diferentes filas, muito confuso todo o processo. \n\nOs banheiros são mal iluminados e a limpeza não é das melhores.","companhia":"NONE","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2022-05-16","dataVisitacao":"2022-04-01","comentario":"Este passeio é maravilhoso, NÃO TEM COMO NÃO FICAR FELIZ.´Única observação a fazer. Falta organização nas filas. Afinal ainda estamos em pandemia e a fila de preferencial eles não dão prioridade alguma. Um terror.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-12","dataVisitacao":"2022-05-01","comentario":"El Cristo es un imperdible si vas a Río sin embargo no lo recomiendo para días de mucho calor. Hay demasiada gente siempre y cuesta sacar una foto pero se puede lograr. Podes ir en tren o taxi x tu cuenta. El tren que te sube sale 98 reales ida y vuelta. Sino que te suba un taxi y pagas la entrada. Sale 52 reales en temporada baja.  No es barato! Una vez ahí te sube una van y después podes subir una escalera x tu cuenta o ascensor o escalera mecánica. Llevar agua es importante.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-05-12","dataVisitacao":"2022-05-01","comentario":"o serviço do trenzinho é muito bem organizado. Os funcionários do complexo são muito bem treinados, gentis, disponíveis, profissionais.Total segurança.Cristo restaurado.Vista deslumbrante.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-11","dataVisitacao":"2022-05-01","comentario":"Passeio agradável, para chegar indo de Copacabana vai em media 45 minutos, bastante cheio mas deu para tirar fotos legais.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-09","dataVisitacao":"2022-05-01","comentario":"A estátua do Cristo é muito linda; as vistas dos mirantes são belíssimas.\nSugiro chegar ao Cristo pelo Trem do Corcovado; é um passeio muito legal pelo meio da Mata, em torno de 15 min, e seguro.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-09","dataVisitacao":"2022-04-01","comentario":"Magnificent.\n\nI suggest to go with the little train and book online at least the day before to avoid surprises. Do not go with bad weather, it would be a waste.\n\nThe view of Rio is Beautiful and the monument fantastic. I don't give 5 stars because it's not short-breadthening like pyramids of Giza or the Coliseum  in Rome, but it's close. :)","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-05-07","dataVisitacao":"2022-01-01","comentario":"Parada obligada pero  no se qué horario será más conveniente porque siempre está muy lleno de gente,  tanto no se puede ni caminar y en plena pandemia horrible nadie andaba con mascarilla ni nada pero la vista desde arriba maravillosa","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-07","dataVisitacao":"2022-05-01","comentario":"Incontournable.\nTemps magnifique, vue sur Rio époustouflante.\nLe christ est une attraction merveilleuse.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-05-05","dataVisitacao":"2022-04-01","comentario":"Hermoso paseo. El día que fui estaba radiante. Disfruté todo, desde la subida al majestuoso Cristo. Espectacular!","companhia":"NONE","pontuacao":5}];

    const filter = document.getElementById("attractionFilter");
    const chart = document.getElementById("chart");
    const totalReviews = document.getElementById("totalReviews");

    const peakValue = document.getElementById("peakValue");

    const monthLabel = iso => {
      const [year, month] = iso.split("-");
      return new Intl.DateTimeFormat("pt-BR", { month: "short", year: "2-digit" })
        .format(new Date(Number(year), Number(month) - 1, 1))
        .replace(".", "");
    };

    function monthKey(dateString) {
      return dateString ? dateString.slice(0, 7) : null;
    }

    function getMonthRange(items) {
      const months = items.map(x => monthKey(x.dataPublicacao)).filter(Boolean).sort();
      if (!months.length) return [];
      const [sy, sm] = months[0].split("-").map(Number);
      const [ey, em] = months[months.length - 1].split("-").map(Number);
      const result = [];
      let y = sy, m = sm;
      while (y < ey || (y === ey && m <= em)) {
        result.push(`${y}-${String(m).padStart(2, "0")}`);
        m++;
        if (m === 13) { m = 1; y++; }
      }
      return result;
    }

    function aggregate(items, attraction, months) {
      const counts = Object.fromEntries(months.map(m => [m, 0]));
      items
        .filter(x => x.atracao === attraction)
        .forEach(x => {
          const key = monthKey(x.dataPublicacao);
          if (key && key in counts) counts[key]++;
        });
      return months.map(m => counts[m]);
    }

    function svgEl(tag, attrs = {}, text = "") {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      if (text) el.textContent = text;
      return el;
    }

    function drawLine(values, months, className, pointClass, width, height, margins, maxY) {
      if (!values.length) return;
      const plotW = width - margins.left - margins.right;
      const plotH = height - margins.top - margins.bottom;
      const x = i => margins.left + (months.length === 1 ? plotW / 2 : (i / (months.length - 1)) * plotW);
      const y = v => margins.top + plotH - (v / maxY) * plotH;
      const points = values.map((v, i) => `${x(i)},${y(v)}`).join(" ");
      chart.appendChild(svgEl("polyline", { points, class: className }));
      values.forEach((v, i) => {
        const circle = svgEl("circle", { cx: x(i), cy: y(v), r: 4, class: pointClass });
        const title = svgEl("title", {}, `${monthLabel(months[i])}: ${v} avaliações`);
        circle.appendChild(title);
        chart.appendChild(circle);
      });
    }

    function render() {
      const selected = filter.value;
      const filtered = selected === "Ambos"
        ? reviews
        : reviews.filter(x => x.atracao === selected);

      totalReviews.textContent = filtered.length.toLocaleString("pt-BR");

      const months = getMonthRange(filtered);
      const cristo = aggregate(filtered, "Cristo", months);
      const bondinho = aggregate(filtered, "Bondinho", months);
      const combined = months.map((_, i) => cristo[i] + bondinho[i]);

      const peakIndex = combined.length ? combined.indexOf(Math.max(...combined)) : -1;
      peakMonth.textContent = peakIndex >= 0 ? monthLabel(months[peakIndex]) : "—";
      peakValue.textContent = peakIndex >= 0 ? combined[peakIndex].toLocaleString("pt-BR") : "0";

      legend.innerHTML = "";
      if (selected === "Ambos" || selected === "Cristo") {
        legend.innerHTML += '<span class="legend-item"><i class="dot" style="background:var(--cristo)"></i>Cristo Redentor</span>';
      }
      if (selected === "Ambos" || selected === "Bondinho") {
        legend.innerHTML += '<span class="legend-item"><i class="dot" style="background:var(--bondinho)"></i>Bondinho</span>';
      }

      chart.innerHTML = "";
      if (!months.length) {
        chart.appendChild(svgEl("text", { x: 500, y: 200, "text-anchor": "middle", class: "axis-label" }, "Sem dados para o filtro selecionado"));
        return;
      }

      const width = 1000, height = 400;
      const margins = { top: 20, right: 30, bottom: 65, left: 60 };
      const visibleSeries = [];
      if (selected === "Ambos" || selected === "Cristo") visibleSeries.push(cristo);
      if (selected === "Ambos" || selected === "Bondinho") visibleSeries.push(bondinho);
      const maxRaw = Math.max(1, ...visibleSeries.flat());
      const step = Math.max(1, Math.ceil(maxRaw / 5));
      const maxY = Math.ceil(maxRaw / step) * step;
      const plotH = height - margins.top - margins.bottom;
      const plotW = width - margins.left - margins.right;

      for (let i = 0; i <= 5; i++) {
        const value = Math.round((maxY / 5) * i);
        const yy = margins.top + plotH - (i / 5) * plotH;
        chart.appendChild(svgEl("line", { x1: margins.left, y1: yy, x2: width - margins.right, y2: yy, class: "grid-line" }));
        chart.appendChild(svgEl("text", { x: margins.left - 12, y: yy + 4, "text-anchor": "end", class: "axis-label" }, String(value)));
      }

      const labelEvery = Math.max(1, Math.ceil(months.length / 12));
      months.forEach((m, i) => {
        if (i % labelEvery !== 0 && i !== months.length - 1) return;
        const xx = margins.left + (months.length === 1 ? plotW / 2 : (i / (months.length - 1)) * plotW);
        const label = svgEl("text", {
          x: xx, y: height - 27,
          "text-anchor": "end",
          transform: `rotate(-35 ${xx} ${height - 27})`,
          class: "axis-label"
        }, monthLabel(m));
        chart.appendChild(label);
      });

      if (selected === "Ambos" || selected === "Cristo") {
        drawLine(cristo, months, "line-cristo", "point-cristo", width, height, margins, maxY);
      }
      if (selected === "Ambos" || selected === "Bondinho") {
        drawLine(bondinho, months, "line-bondinho", "point-bondinho", width, height, margins, maxY);
      }
    }

    filter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
