antage of the early hours of the day. Despite the agglomeration, the combination of landscape and monumentality makes it a must-see destination.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-11-28","dataVisitacao":"2024-10-01","comentario":"The most classic tour of Rio de Janeiro is worth it mainly for the view from above, from where you can see the whole city. I recommend taking the train","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-11-26","dataVisitacao":"2024-11-01","comentario":"Superb and not to be missed. Simply get a taxi to the station, avoid the chatter that says it is the last train and you should pick up a van to meet the train halfway up.  The trains run regularly. We caught the 5 pm and it took 20 minutes to go up.  Had plenty of time to see the spectacular views and marvel at the sunset before going down.  If you want a taxi at a reasonable price once you have descended, I suggest you walk away from the site so that you get a reasonably priced Uber.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-11-25","dataVisitacao":"2024-10-01","comentario":"Iconic place.Unmissable.Many people in the Christ... so that there are fewer people you have to arrive very early.Ideally, you should take an excursion because to get there is not so easy.Unless you want to take an adventure and do it for your own motus but I think it is more cumbersome.We took advantage of the fact that just was giving a Mass in the chapel of the Christ that remains in the back below it.It was a very nice surprise.We witnessed the blessing of a couple.From there is a spectacular view just cross your fingers that is not a cloudy or rainy day.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-11-25","dataVisitacao":"2024-11-01","comentario":"This is one of the wonders of the modern world.  There are big crowds.  If you want to visit why not just stop, watch and drink in the wonder of the statue, what it represents, and the views of Rio. You can’t because all the lounging,  posing “exclusive me me me photos” are  heedlessly monopolising all the space and views.   For goodness sake people….it’s not all about them  and the tik tok moment.  \nThere were also just too many people up there- no direction, and many crowd pinch points..only authority figures were two disinterested “security” guards chatting under an “awning”.\nThis is the world class attraction- yet it seems to be about how many punters can be stuffed into the small area.\nThe provided -and only way to get to the monument~ bus / driver seems to not have to abide with the posted speed limits going down either.. (30 and 40 kph- often 45-50 Kph respectively ) really don’t know why they have transponders  if the drivers can drive at whatever speed they want….","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-11-24","dataVisitacao":"2024-11-01","comentario":"I highly recommend to go to the Cristo on Sunday if you are catholic person. Sunday mass is taking place there which was such a wonderful and spiritual moment! Sadly, there was many people since it is one of the 7 wonders of the world so be prepared. The views are just AMAZING and breathtaking!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-11-23","dataVisitacao":"2023-11-01","comentario":"A wonder of Brazil, offering stunning views of the city and natural landscapes. The combination of urban scenery and nature is simply unmatched, making it a must-visit destination.The photo opportunities here are endless!","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-11-22","dataVisitacao":"2024-11-01","comentario":"Travelling by cog railway was an experience, wonderful view, we did not have sun, but still had a good view. This mountain is higher than Sugarloaf Mountain and is therefore more worthwhile for the view than Sugarloaf Mountain.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-11-20","dataVisitacao":"2024-11-01","comentario":"Train ride takes you up to the top. It is a good idea to go with a guide as they get you to the front of any queues and know the most direct routes. The views were fabulous. We went in the begining of November and I thought it was busy but our guide said that during peak season it is so busy you can hardly move!!","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-11-16","dataVisitacao":"2024-08-01","comentario":"The place is stunning in all respects but the immense amount of people bother a lot. People gather to take photos with open arms and it is very difficult to walk.\nIt is worth it to go and I think that visiting Rio de Janeiro without going to Corcovado would be unthinkable... but maybe you should limit the number of people who can access the place at the same time.\nOne tip is to go as soon as the monument opens to the public and try to avoid crowding.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-11-08","dataVisitacao":"2024-11-01","comentario":"It was an incredible experience. We went by van departing from the beach of Copa Cabana. Because we are with a small child, we were provided with an accessible van to get up to Corcovado. The Carioca tourism organization is congratulated","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-31","dataVisitacao":"2024-10-01","comentario":"It's worth the sight, it's amazing how they could get that statue there, but too many people and a little messy. I should offer something more, as in my opinion it does not deserve to be a wonder of the world.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-31","dataVisitacao":"2024-10-01","comentario":"The view is of course stunning, go there even if the weather is overcast, think about going early, the number of tourists is large but the atmosphere good child","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-23","dataVisitacao":"2024-10-01","comentario":"Rio de Janeiro is beautiful, and with the Anderson guide our tour was quiet and safe! I indicate with closed eyes and we will come back more times and we will always hire the Carioca trails to guide us!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-19","dataVisitacao":"2024-10-01","comentario":"It was very accessible for being up a mountain. Great infrastructure. I enjoyed the train ride up & down the mountain. The staff guided everyone along well. It was very organized! I Ubered to it from my hotel & bought the admission tickets their at their window. I went twice. First on a Sunday to spend time with Christ, the Redeemer on a Sunday. It was I think R$123 & then I went back on a Wed & the weekday price was I think R$98. These prices are for non-Brazilians. Please check the price yourselves because I don’t remember the exact amount. It was affordable otherwise I wouldn’t have done it twice. \n\nI went twice because when I went on Sunday & really wanted to go, there was so much fog & they told me they weren’t letting anyone else up but I pleaded because I really wanted to spend part of my Sunday with Christ, the Redeemer. So they let me go up. I could barely see the statue. And you could not see the view at all! They were right in closing it early. But even with the fog, it was a very moving experience. It was just myself there & a couple & their friends and/or family who got engaged there!! It was lovely to witness that! And I understood why they insisted on making it up also. It was their special occasion that they probably came from far to do! Hats off to the future husband on creating a very memorable proposal!! \n\nWhen I returned on Wednesday, there was a full crowd! Big difference but it was a comfortable crowd & still enjoyable! And on a clear day, Christ, the Redeemer & the surrounding views were something to behold! Definitely worth it! I would consider this a must do excursion.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-12","dataVisitacao":"2024-07-01","comentario":"Nareszcie mamy panoramiczne widoki urzekającego Rio de Janeiro i to z Corcovado, co prawda zatłoczonego, ale i tak wspaniałego. Turyści oblegają wszystkie możliwe punkty, a zrobienie tu zdjęcia to nie lada wyczyn, ale krajobrazy zatoki Guanabary i wzgórz otoczonych wodami Atlantyku rekompensują to wszystko. Nad całością góruje statua Chrystusa Zbawiciela, w której cokole znajduje się kaplica organizująca m.in. śluby.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-09","dataVisitacao":"2024-10-01","comentario":"We are a couple from Canada and today oct 8 2024 being in Rio de Janeiro we decided to take an excursion to see the city and most important turistic attractions. Our bus driver  was Eduardo and our tour guide was Monica Bertazzolo. We were pick up in time from our hotel and we had a very pleasant experience . Our guide Monica was very profesional, polite and gave us a lot of informations about city history, culture and traditions. She proved to be very knowledgeable and explained in three languages everything making everybody very comfortable during our trip. She promptly responded to all our questions and allowed us to have enough  time to take photos in all places visited in the city. Meeting her made our trip in Rio more memorable! Thanks so much!!!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-06","dataVisitacao":"2024-09-01","comentario":"Fantastic sight. This is a not to be missed experience. Staff were excellent, very helpful . We did not wait long although there was a long queue. We visited on a Sunday morning at 11am and there was mass with communion. Crowded but did not spoil our experience. At the end of your visit don't miss out on the chocolate shop, delicious.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-06","dataVisitacao":"2024-10-01","comentario":"Writing this review as when planning our visit found a lot of conflicting information online. \n\nWe visited on a Sunday without pre-booking tickets. We got a taxi to Cosme Velho station which is where you can buy tickets and board the train up to Christ the redeemer. There were 3 booths selling tickets that took cash or card. Once buying tickets you then queue to board the next train. \n\nWe arrived at 7:30 at the station, queue was very short and probably the best time to visit without waiting around. We just missed the first train at 7:40, however another train arrived around 8:00. Even by 8:00 the queue to buy tickets had grown considerably from when we had walked up so an early start is recommended. \n\nAt the top, despite being the second train up, it was very very busy as expected. After around 20 minutes we were done. A great sight to visit but expect to be stood in a huge crowd no matter what time of day you visit. \n\nThe queue down was not long- managed to get on the train when it arrived without waiting for a second. I think this was only because we visited early before the main crowds hit.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-10-01","dataVisitacao":"2024-09-01","comentario":"It is best to reach the point where the funicular is, in front of the church of San Judas Tadeo. Hence take the funicular, it is entertaining I suggest not to take the transfers that take you direct is not entertaining.  The funicular is more beautiful and you get straight to Christ once there the views of Rio are amazing. They must go up when it is sunny because if it is covered you will not be able to see the Christ.  Carry water, blocker and hat because with sunshine it is very hot as above is all cement.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-26","dataVisitacao":"2024-09-01","comentario":"It is impressive the structure and the view of the city from the height of the Corcovado. In my case I went with Guide/Photographer and we were able to get in the first group by car, we took most of our pictures without people around, then we were given historical data and had breakfast in the restaurant. If I have the opportunity again I would do it alone to use the train on weekdays in low season and early. You climb by car or train to the door of the souvenir shop where the entrance ticket is purchased, then board a small bus that climbs us to the base of the statue where the escalators are located.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-23","dataVisitacao":"2024-09-01","comentario":"The view on the bay is sublime, as there is no fog... you have to arrive early because there are a few people and for the photos, you have to play elbows. But it's definitely a must-see. Christ is truly beautiful and one of the two sculptors is French! And the other Romanian...","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-23","dataVisitacao":"2024-09-01","comentario":"Traditional tour but very nice to do with the family, price half salty, but the view is worth it, be careful if it is by car because it passes by favelas","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-23","dataVisitacao":"2024-04-01","comentario":"I definitely recommend taking the trilha from the Garden of Lage.\nIt can be intense activity if you are not used to it, but it is worth climbing through the vegetation.\nI found it more rewarding to reach the Cristi after the effort made to reach the top.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-09-22","dataVisitacao":"2024-08-01","comentario":"The main Attraction of Rio: majestic and imposing. An absolute spectacle. The only negative note, being clearly the best known Attraction, hordes of tourists in unlikely poses. Worth a visit, spectacular view.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-20","dataVisitacao":"2024-09-01","comentario":"Very good, a panoramic view of the city in a large part, perfect location, well thought out. \nMy customers loved very much","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-18","dataVisitacao":"2024-08-01","comentario":"An iconic symbol in the metropolis of Rio de Janeiro. It rises and rises above the skyline. Mandatory visit for those going to Rio","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-17","dataVisitacao":"2024-08-01","comentario":"Not sure why this is a wonder of the world. Yes it's symbolic and something facinating but not really a W of W.  Take uber to the foot where you buy ticket from vending machine. Very orderly and quick (esp if you get there before 9am). Then line up to take funicular up. At top you will walk up more stair and see some sneak peak and monkeys everywhere up on trees. DON\"T FEED THEM or aggrevate them please.  Hint take some pic of cristo from behind (down by snack bar and WC). You won't have millions of people in your pics. Yes it's a zoo up there.  Hundreds of people trying to get that straight on pic from the stair of others on the floor on their back trying to take pictures upwards without people. It's sort of funny watching everyone. Take your time and you will get a break from the hoards of people. OR use your google pixel camera or Samsung and ERASE All the people in your photos. It WORKS !!!.  At the end you will get a pic of Sugarloaf.  It's ok but another zoo and line up to go down. Do not take a van up, just use the tram. Ignore all the van touts at the bottom telling you its faster or cheap with van.  For 92 Reals it's ok and a bit pricey but guess something you gotta do when in RIO. Logical sense after this is to take an Uber to Parque Lage after.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-09-16","dataVisitacao":"2024-08-01","comentario":"Unmissable tour on a visit to the city of Rio de Janeiro. Nice panoramic views of the city, ideal for cute souvenir photos. It is advisable to hire a Trips Agency to carry out this tour due to the insecurity of the neighbouring area. 100 recommended.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-14","dataVisitacao":"2024-01-01","comentario":"Guided tour so missed a lot of the crowds. Amazing views, well worth the trip. Visit the whole site and take plenty of photos.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-13","dataVisitacao":"2024-07-01","comentario":"The tour to the Tijuca National Park requires attention, to avoid entering areas dominated by organized crime.\nNow, the climb to the reception of tourists is b asphalted and fully wooded.\nThe visitor centre is organized.\nThe Christ is beautiful and the city view is wonderful.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-12","dataVisitacao":"2024-09-01","comentario":"a very imposing monument the construction, the view that can be seen from the height, I recommend doing it and if possible early because in the afternoon there is a lot of people","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-11","dataVisitacao":"2024-09-01","comentario":"Very good!\n\nVery organized the whole tour. A must when tourism in Rio.\nGreat structure, with clean bathrooms and everything very well marked.\nDispense the vans, because there may not even be a queue, and the train ride is very cool.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-11","dataVisitacao":"2024-09-01","comentario":"It is a must-see place, a beautiful view of the wonderful city. We went with the van from Corcovado, everything very well organized.\nOf course there is a little queue on arrival and departure, and a lot of people crowded up there - we went on Saturday - but nothing that took the glow of the ride.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-09-08","dataVisitacao":"2024-09-01","comentario":"Yes, it’s Rio’s must-see, but it’s so jammed that you don’t like the place. \nWe were there one morning and there were clearly too many of us. Arriving at the top of the escalator we could no longer advance so it created a mess with those who were poured by the escalator. Dangerous limit. No picture can be taken because there are so many people. \nWe must limit the number of people! What interest to have us taken on board if it is full upstairs.\nI had the Impression of being on the B line during rush hour and on strike with a little Traveler malaise... the real ones will understand me!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-09-06","dataVisitacao":"2024-09-01","comentario":"Best time from 15:00, in the morning is always full if the weather is good. The train journey is faster and more busy, the vans depart from different points of the city such as the Lido square in Copacabana and the square of the beach of Machado.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-08-31","dataVisitacao":"2024-08-01","comentario":"A must visit the corcovado christ the redeemer.Beautiful statue and amazing views of Rio de janeiro.Book your tickets in advance.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-08-28","dataVisitacao":"2024-08-01","comentario":"Marking point of tourism in Rio . Even if it is covered (which often happens) see the statue from close is worth it.  The service is quick and attentive staff","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-26","dataVisitacao":"2024-08-01","comentario":"We went with an organized tour because getting there is not very easy, it is very far and you can not reach it by metro. Also complicated to get train tickets online. Arrived on the spot with an elevator you get to the base of the statue in a moment. Crowd of tourists taking pictures at most I can't from all angles (but it's to be done). It is one of the 7 wonders of the modern world, not to be missed in Rio. Beautiful view from up there and beautiful Sugarloaf from that 'height,.... leaves you breathless!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-25","dataVisitacao":"2023-10-01","comentario":"If you go to Brazil, you should visit. It is a beautiful place, I recommend to go up by elevator and down the stairs where you can enjoy the scenery and buy some souvenirs to bring.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-23","dataVisitacao":"2024-08-01","comentario":"Exciting tour. Spectacular view with an amazing sunset!! It was super quiet to get off Official Van departing from Largo do Machado. There are other starting points. Sorry it was crowded, even though it was a Monday and off high season. I highly recommend to tourists and not tourists.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-16","dataVisitacao":"2024-07-01","comentario":"We took the train that leads to Corcovado. Poor service at the box office, poor vendors, we were very poorly served. We had an excellent reception at Pao de acucar ticket office and a horrible disappointment at the train ticket office to Corcovado. The journey on the train and the Christ are worth it. A pity that the first impression at the entrance is horrible.","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2024-08-14","dataVisitacao":"2024-08-01","comentario":"7 euros a lemonade and a red bull!!!!!\n6 euro parking for 40 minutes!!!!!\nGuys, anything but Christ \nSTAY HOME WHICH IS BETTER! ALL THIEVES!!!","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2024-08-13","dataVisitacao":"2024-04-01","comentario":"Impossible not to go, it is something that excites, we got a day of total clear sleep and had a great time! Guide a total genius explained everything","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-12","dataVisitacao":"2024-07-01","comentario":"Beautiful views, although the day was cloudy, there are many people always, patience. I recommend getting on the train and not by bus, as you can better appreciate the scenery.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-12","dataVisitacao":"2024-08-01","comentario":"You know that expression, go to Rio and not the Christ, it is similar to go to Rome and not the Pope, it is true, it was the 15th that I was in Rio, all business and was the first that 1 day and a half free, and I had this opportunity, I did not go in a high season and had a lot of people, in short the photos that will not be any news due to the amount of visitors that know to Corcovado, but the tip will always be, for more accessibility there is found on the internet, I recommend buying with tour companies and better if it is private, they will go through the Guide to give valuable tips, as well as I went on a sunny day, the next day rained and was covered all that wonderful view and in a private program they can change the order of visits and even days if available in the schedule of who travel.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-10","dataVisitacao":"2024-07-01","comentario":"Christ the Redeemer is definitely a must see while in Rio. Book the express ticket train and go early in the morning to avoid the crowds. The views of Rio from the top are simply stunning! Also look out for the little monkeys near the cafe!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-07","dataVisitacao":"2024-07-01","comentario":"More than a tourist spot, the Christ the Redeemer is a symbol of Brazil recognized throughout the world. It was the second time I had the privilege of seeing this wonder.\nThe first time I hired the official service that is in the Copacabana Lido Square, which seems to me the best option. This time the Uber driver left us a square next to the corcovado train, crowded. We took an unofficial van among the many available and went up to the Visitor Center of Christ the Redeemer, where the ticket is purchased. Then we took a huge queue to board the official van that took us to the foot of the statue.\nAs we climbed up we visualized Christ clearly, however in a few minutes the closure blocked the statue. I didn't think this would happen, because down there the weather was good.\nIt was necessary to have some patience to take a good photo, because the closure went and came back at all times, in minutes' intervals, in addition to the fact that the place was completely crowded with people, many of them probably waiting for the closure to pass.\nThere is also the option to climb the Corcovado hill with the Corcovado Train, but it is necessary to buy the ticket the day before and make sure that the weather will be good, in order to be able to view the statue.\nIt was a whole day in Rio de Janeiro only to visit the Christ the Redeemer and the Sugar Bread, which despite the difficulty compensates, because they are two of the main Brazilian tourist points.\nAlong with the Christ the Redeemer ticket I also bought tickets for the AquaRio, which we visited the next day.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-06","dataVisitacao":"2024-07-01","comentario":"I recommend to all who come to Rio de Janeiro to meet the Redeemer Christ. Nowadays the Attraction is with stairs, lifts... very different from the time when I was a kid who had an endless staircase. The view is stunning 360 degrees. There's a nice store to buy souvenirs.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-05","dataVisitacao":"2024-06-01","comentario":"Sensational the view of Christ the Redeemer the perfect point for good photos and for all FML qm never came need to come to know the Christ the Redeemer and qm already met returned to be sure q is beautiful even as the other views of Rio the corcovado is beautiful","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-05","dataVisitacao":"2024-07-01","comentario":"We got on the train, very nice experience. We pulled the tickets right there, few people waiting. The climb is very nice. You can see everything up there. It's impressive.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-08-04","dataVisitacao":"2024-07-01","comentario":"INCREDIBLE, you have to visit on a sunny day, go preferably with a tourist agency because it gets everything much easier, there are a lot of people in the place but it is all very beautiful, amazing view.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-08-01","dataVisitacao":"2024-08-01","comentario":"First time in Corcovado...\n\nImpossible to describe the beauty..the view of the city...\nBut to avoid disturbances, I recommend using tour guide...riotur very good by the way\n\nDon't forget to know","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-30","dataVisitacao":"2024-04-01","comentario":"Η εμπειρία ήταν απλά καταπληκτική.!! Η θέα ήταν απίστευτη.!! Πετύχαμε καθαρό ουρανό και είχαμε τρομερή θέα σε όλο το Ρίο.!! Ο οδηγός-ξεναγός μας ήταν τέλειος και διαθέσιμος να μας βγάλει όσες φωτογραφίες θέλαμε.!!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-30","dataVisitacao":"2024-07-01","comentario":"Tickets were purchased from the website: the corcovado paineiras, in a combo with AquaRio, cost R$195, which made the visit a little cheaper (first tip). By the package, we climbed the corcovado in the vans, the intention was to arrive early, but on the day reserved in the purchase of the ticket the visibility was not very good in the morning (July is winter in Rio), so we went to other attractions, at noon, the sky had opened, and we ran there! We picked up an uber and climbed up to the paineiras (tip 2: do not go by car, there is no parking, the cars are on the hillside, some km away), there, queues to validate the tickets and get on the vans. The route is beautiful, and if you are lucky, you can see some animals (we saw some monkeys), on arrival, more queues to the stairs of the statue. The third tip is that if you turn around there are stairs and lifts. The top was crowded, could hardly move, photo only with many people appearing, result of days without sun and visibility (and all had the same idea of taking advantage of the sun to go..rs). Despite being crowded, the place is sparkling, the view is beautiful! There is a chapel at the foot of Christ, and tourists try to organize to take pictures on the staircase in front of the monument. \nAn important information about tickets purchased on the site is that they can be rescheduled within 7 days, if you do not have the possibility to visit the chosen day. \nBonus tip: it is possible to follow Christ live from the official website, take a look to assess if visibility is good before you go! \nDon't stop going!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-27","dataVisitacao":"2023-12-01","comentario":"Udsigten er vild, havde en hygggelig togtur op og ned - men tager trappen næste gang. Mulighed for drikke undervejs, men medbring vand.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-26","dataVisitacao":"2024-04-01","comentario":"Visiting Corcovado to see Christ the Redeemer was absolutely fantastic. This iconic statue is a must-see when you're in Rio de Janeiro. The sheer size of Christ the Redeemer is mind-blowing – it’s even bigger in person than it looks in pictures. The view from up there is just stunning, giving you a 360-degree panorama of the city, the ocean, and the surrounding mountains.\n\nWe went there as part of a tour, so took a van up there through the lush Tijuca Forest, which adds a bit of nature and excitement to the trip. It can get VERY crowded so factor in that you will need some time to get the best pictures without random strangers. A word of caution - the gift shop here is one of the most expensive places to  buy souvenirs in Rio so if you are part of a tour (usually the first stop) bear in mind you can buy the same sort of stuff later for much less. \n\nAnother tip if you would go independently – try to go early in the morning or later in the afternoon to avoid the crowds and the midday heat. Also, check the weather forecast because clear skies make a huge difference in the view and your overall experience.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-24","dataVisitacao":"2024-07-01","comentario":"It wasn't raining, but the cloud cover near the top of the mountain made the city almost invisible.\n\nOn the way up, there was a time when the scenery expanded, so the timing was just wrong.\nThe weather wasn't good but the top was just crowded.","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-07-24","dataVisitacao":"2024-06-01","comentario":"I enjoyed going to see the landmark.\nWe took an Uber to the bottom of the mountain, and then bought a ticket to take a mini bus up to the monument.\nUber is the best way to get about Rio, in my opinion.\nThe monument was quite busy at the top, as you would expect.\nAbout half way up the mini bus stopped so people could take pics from a view point.\nIt wasn't expensive, and there was no pressure to spend money on anything.\nWorth doing.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-07-23","dataVisitacao":"2024-07-01","comentario":"There's no way not to enjoy this ride. Tips that worked in my case: first look at the weather forecast, buy the ticket on the website, go in the morning, go to UBER, come early because you have a line, go to the trenzinho which is very cool.\nUp there is just to enjoy, no hurry, it will be full, take this in a good, go seeing the view and take your photos in a good.\nThen on the way order a new Uber and go to lunch in Ipanema that is full of cool stuff to do.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-21","dataVisitacao":"2024-07-01","comentario":"Extremely beautiful place \nIt's well organized. \nStaff attentive to tourists \nRecommended to all tourists \nExcellent","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-20","dataVisitacao":"2024-05-01","comentario":"Another place full of people, very touristic and also special vibes, visited by tourists from all over the world, Located in the Tijuca National Park you can take a train that takes you to the top of the Christ 20 minutes or so and in that journey there is a great viewpoint, if you go with Guide leave your cart parked in the street he does everything or if you go by Uber then you get off and now. When you get upstairs you can go upstairs by elevator but I preferred to do the 220 steps that have the same beautiful view and you feel more involved in the walk, they look like many steps but it is fast. It is almost impossible to take the photo without other people because it is full of people and you have to be very fast, you can not miss it if you visit Rio, interact \nPeople end up taking pictures of tourists and they take pictures of you. Then you can go down for a drink a few steps down and of course your cheese loaves that are not missing anywhere in Rio (divine) there are any number of monkeys that ask you for food and it is better to keep them away, it has a chapel at the feet of the corcovado small and busy do Mass at certain times, nice experience.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-15","dataVisitacao":"2024-07-01","comentario":"Christ is wonderful! The view, the vibe... it's impossible not to love. Even if it's a little more full, it's worth it! I've been many times and every time I come back to Rio, I end up going there. I recommend taking the train from Corcovado, even if the price is a little saltier than that of other companies.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-13","dataVisitacao":"2024-06-01","comentario":"Another must-do when in Rio. \nThere can not be a better view of a city anywhere in the world. (Cape Town from Table Mountain comes in a distant second, I believe.)\nWe went in late June, which is before Brazilian schools end. To avoid crowds, we deliberately avoided the weekend, and went on a Friday morning. \nWe arrived at 9:40 and got tickets for a 10:20 departure with the train. We enjoyed the train ride, which was comfortable and scenic. \nAt the top, there were quite a few people, but you can't expect to have views like this all for yourself. \nOn a cloud free day, this is the best view of a city that you could possibly have. \nI have been here in the past when the statue was covered in clouds. Then it was a complete waste of time and money.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-12","dataVisitacao":"2023-10-01","comentario":"Amazing views of RJ and stunning monument. Without a doubt RJ is a place I would always return to, and clearly a visit also by Christ the Redeemer.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-10","dataVisitacao":"2024-05-01","comentario":"The Christ the Redeemer, without a doubt, is one of the most iconic places in Brazil. And it is not in vain: the 360-degree view of Rio de Janeiro from above is of falling the chin. The tour can be a bit expensive, especially for Brazilians, but I recommend you go at least once in your life. It's worth it! The view from above of Christ the Redeemer is simply unbeatable. You have the whole city at your feet, with all its beaches, hills and monuments.  The statue of Christ itself is beautiful and really impressive. It is amazing to be at the foot of such a grand monument and the sanctuary within Christ the Redeemer seemed to me a place of peace and tranquility, even with the monument being crowded. When I was there there were several people praying and having an intimate spiritual moment, it seemed to me a great place to pray and reflect. It is important to have patience when visiting\nthe place because the place is usually crowded, so have patience to take pictures and enjoy the view. I also find it important to remember that the sun in Rio de Janeiro can be strong. Wear sunscreen, water and a hat to protect yourself depending on the time you visit the site, and wear comfortable clothes and appropriate shoes. Now a golden tip is Buy your tickets online in advance to avoid queues and arrive early on the spot to avoid the bullshit.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-09","dataVisitacao":"2024-06-01","comentario":"Here are some tips for visiting Christ the Redeemer: take the train or van up Corcovado Mountain for scenic views,  wear comfortable shoes as there is some walking involved, and be prepared for crowds, especially during peak season. Overall, Christ the Redeemer is a must-visit for any traveler to Rio de Janeiro.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-07-05","dataVisitacao":"2024-07-01","comentario":"Get to the tram 7.30 and there was minimum crowds. I am not religious but found the Christ an impressive monument and would highly recommend. Clean and well organised. Views amazing","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-07-04","dataVisitacao":"2024-06-01","comentario":"Beautiful views.  Sadly it is way too crowded and we went up at 7am. Everyone is trying to take a perfect picture and blocks the platform instead of just enjoying the view. They need to stop photography on the top or have q photographer taking 1 picture each. Sadly It is a tick the box exercise.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-06-29","dataVisitacao":"2024-06-01","comentario":"One of the wonders of the modern world. You can not miss visiting. Exciting and wonderful view. Beautiful walk.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-29","dataVisitacao":"2024-02-01","comentario":"Impressive place that is located on Corcovado Hill, it is the protector of the city of Rio de Janeiro and is surrounded by beaches, it is wonderful","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-28","dataVisitacao":"2024-06-01","comentario":"Sensational! \nThere is nothing in this world more amazing than the view of the wonderful city!\nIt is not in vain that it is considered one of the 7 wonders of the world!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-27","dataVisitacao":"2024-06-01","comentario":"It is a must-see, beautiful, you can take a train or a van to climb to the top. There were a lot of people, yet everything was fine. We went straight from the hotel on Uber app, cheap and hassle-free.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-25","dataVisitacao":"2024-06-01","comentario":"We bought tickets online. This is a must do tourist attraction.  Best way we did it was to uber right to the top. Get in line get your ticket verified and get into a van that drives you the rest of the way. We just think it saves on time and lines. The train is 90 R, and has nearly 20 min waiting times both ways depending on train and crowds. Uber does drive you all the way up. Vans are organized and convenient. Its included in price of admission. We went at 8:30 am. It wasn't too bad. Of course the area around the statue is always crazy no matter what time. Checkout the other views of the city. Walk around the platforms . We took a taxi back to the next destination. You can also take the train back and get tickets at the station. The souvenirs are overpriced. There are restrooms.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-22","dataVisitacao":"2023-09-01","comentario":"Amazing tall statue of Jesus at top of hill with a scenic train to reach it and fantastic view of city and bay of Rio. Beware of snatchers.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-19","dataVisitacao":"2024-06-01","comentario":"A place full of positivity, faith and a view that will take anyone's breath away! From its access through the Tijuca Forest National Park, to reaching the top of Corcovado!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-17","dataVisitacao":"2024-01-01","comentario":"Visiting the Christ the Redeemer statue in Rio de Janeiro was an unforgettable experience. Perched atop the Mount Corcovado, this iconic symbol of peace offers a panoramic view of the city that is simply unparalleled. The statue itself is a marvel of artistic and engineering prowess, standing tall with arms outstretched in a welcoming embrace. The atmosphere is serene, almost sacred, making it a perfect retreat from the bustling city life below. Whether you’re soaking in the scenic vistas or admiring the intricate details of the sculpture, Christ the Redeemer deserves nothing less than a five-star rating for its awe-inspiring presence and the profound impact it leaves on every visitor. A must-visit for anyone traveling to Brazil!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-13","dataVisitacao":"2024-06-01","comentario":"The tour and meeting in this wonderful place was magnificent! I hope to visit this beautiful place again soon with my family and friends!!!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-09","dataVisitacao":"2024-05-01","comentario":"Incredible views. A marvel. Easy to access by train. A place to enjoy. Just try to make sure there are no low clouds","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-09","dataVisitacao":"2024-06-01","comentario":"It's a shame that the most visited place in Rio, you are robbed without a weapon in the parking lot (which is public). You arrive at the location to access Corcovado, pay 81.50 to take the van that takes you to Christ, but when you arrive at the (public) parking lot, a group (faction) charges 150 reais, a place that is public. It's a shame that the most visited place in Rio is the face of Rio, a lawless land!","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2024-06-08","dataVisitacao":"2024-04-01","comentario":"Christ the Redeemer can be seen from different points of the city and is one of the wonders that you should not miss. From the top the views are incredible. You have to go on a day when the weather is good, because if it is cloudy you cannot enjoy it to its full extent. We returned to Rio de Janeiro with my husband after a few years and discovered some attractions in a different way, with more time to explore it is much better.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-07","dataVisitacao":"2023-12-01","comentario":"One of the best views of Rio de Janeiro. In December, it is best to book in advance and arrive earlier than the ticket time to get in at the right time. Easy access for the whole family. It is best to bring sunscreen and a hat or clothing to protect you from the sun.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-02","dataVisitacao":"2024-05-01","comentario":"Overlooking the city, Christ welcomes everyone with open arms. The experience of visiting the site is amazing, and you get a good view of the city from the top. \n\nYou can reach by train Or Van, train takes more time but it offers good view of Tijuca national park. \n\nIf you want to go by van, reach visitor centre by cab (uber) and can easily buy ticket (can be bought online as well). Although timing is mentioned on ticket but they are not strict. \n\nTry to reach early, as it is either more crowded or less crowded. Escalator are available.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-02","dataVisitacao":"2024-06-01","comentario":"We were on the 7:40am train and it wasn’t too busy when we arrived, we were able to walk around pretty easily to admire the views and of course the statue. The statue is very impressive close up and very well maintained. It’s too touristy for any sense of religious contemplation but it was still a great experience.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-02","dataVisitacao":"2024-05-01","comentario":"Mandatory stop if you are in Rio. Christ the Redeemer blessing the Marvelous City, with a breathtaking view! A shame the day I went the weather was cloudy and closed, but if the weather is clear, don't think twice!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-06-01","dataVisitacao":"2023-08-01","comentario":"It wasn't rainy season, but it rained a lot when we visited Christ, and even so the place is beautiful, imagine on a sunny day...","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-29","dataVisitacao":"2024-05-01","comentario":"Although we were only in Rio for a few days we went up Corcovado twice.  The first time was an organised excursion which was part of our trip so we went even though it was a very misty day.  We could hardly see the statue, let alone the view.  We went in a mini bus to about half way, when the official park transport takes you up to the statue.  There are inevitably a lot of people there but it didn't detract from the magnificence of the statue.  We also went the following day when the sky was blue!  We went in the afternoon so that we could be there for sunset (about 5.15 p.m.)  This time we took an Uber to the train and went up on the train - the cost included the train and the admission to Corcovado. A wonderful experience - but if you have the choice of when to to go make sure that the weather is good.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-28","dataVisitacao":"2023-09-01","comentario":"Excellent views. It is worth going to see once in your life. The statue is truly imposing. I booked an excursion, I think it is the most recommended if you don't speak the language.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-28","dataVisitacao":"2024-05-01","comentario":"A second visit 15 years later and it still is a wonderful sight and has wonderful views of the city in many directions. Is it one of the 7 wonders of the world? Well yes by population of one country voting for its own attraction. But compared to the Taj Mahal or the Pyramids or Angkor Wat etc, no. It is not a magnificent architectural or engineering achievement of the ancient world. It is just a big statue, admittedly a wonderful statement above the city. But easy access means lots of face shots and poses and pouting in essentially a religious setting which is quite unseemly. But it still has to be visited, it is a city statement and is a trip with the funicular railway journey and offers great views of the city.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-27","dataVisitacao":"2024-05-01","comentario":"Managed to see the Christ the Redeemer statue at Corcovado. So this now completes   visits to all of the Seven Wonders of the World","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-05-26","dataVisitacao":"2024-05-01","comentario":"For those who have never been to visit Christ, it's worth visiting one day! But BE VERY CAREFUL! This was the second time I went and both times I was there, I was nervous! This time I was deceived by a very tough scalper who ripped me off in front of a bunch of people! There were even police there and the boy wasn't even intimidated! He showed up saying he was from the park and would advance our ticket sales to go up by van, and that the package (ticket + van) cost 180.00 per person! There were 4 of us and we paid thinking that was the price! When we got there we realized that the ticket, which includes the van, cost 80.00 per person (he robbed us of 100.00) per person! And when we went looking for him to complain, he was gone!","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2024-05-25","dataVisitacao":"2024-05-01","comentario":"Pretty pretty pretty ! Incredible view of Rio de Janeiro, a tour not to be missed. I recommend it to everyone who visits Rio de Janeiro","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-25","dataVisitacao":"2024-05-01","comentario":"It is great to see the statue in details and a nice 360-view of the city below.  If you Uber/taxi to the top drop off point, walk up to the visitor center to get tickets. DO NOT listen to the scammers selling the same transport tickets at the drop off point at 3X the official ticket price.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-05-24","dataVisitacao":"2023-10-01","comentario":"It was an unforgettable experience.\n\nThe day in Rio de Janeiro was slightly rainy and cloudy so few visitors were expected at the statue of Christ the Redeemer.\n\nIt wasn't a day at the beach either.\n\nBut my husband saw that it was going to light up around noon so we decided to go anyway.\n\nWe rented a car and drove around with the Waze navigator without problems. \n\nIt was very exciting to arrive at the Christ, it is huge and the views are incredible.\nAt the restaurant we ate something delicious and bought souvenirs for everyone in the gift shop.\nIt is worth the visit.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-22","dataVisitacao":"2023-07-01","comentario":"Corcovado is a magical place, visiting Christ the Redeemer is wonderful, something negative is the price of the ticket to access Christ.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-21","dataVisitacao":"2024-05-01","comentario":"Wonderful visit, the entire structure of the train to Christ is super complete, the price is super fair. We had very clear weather, however, the next day, even though it was hot, there was a lot of fog, so I understand that it can vary depending on the weather.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-20","dataVisitacao":"2024-05-01","comentario":"Pay close attention when purchasing your ticket, as they already include transport and vary in price depending on the transport chosen. If you come by train, it will take you in front of the Cristo elevator (you will need to go up the elevator and then 2 escalators, you will not pass by the Paineiras Visitor Center). Another option is to take the official van from Copacabana or Largo do Machado, there will be designated points for boarding. The other option is to take a taxi or Uber to the Paineiras Visitor Center. And from there you take the official van for 5 minutes (already included in the ticket) and it leaves you at the van parking lot close to Christ. You walk a short distance, take the elevator and then 2 escalators.\nStudying all the logistics and considering that I was staying in Copacabana, I chose to take a taxi to the Paineiras Visitor Center (I paid R$55.00 with the meter on). I chose the Visitor Center ticket for the first time slot, at 7am. You won't get an Uber at 6am, because they won't have a passenger back, so they won't even accept the ride. But there are a lot of taxis in Copacabana and I had no difficulty getting one to take me to the Visitor Center. I got there at 6:45 am. A queue will form at the entrance to the shop. You enter the store when it opens and go completely to your left (if you already have your ticket purchased on the website and printed out). You will go through a ticket window and the attendant will check the ticket purchased on the website and exchange it for another one. After passing through this window, you will pass through the ramp (which you can see from the outside, but you have to access it after entering the store). Go through the parking lot and you will see the vans. From then on, you only show the ticket that was exchanged at the store. Get in the van and after 5 minutes it arrives at the van parking lot very close to Christ. You take a quick walk, take the elevator up and then the 2 escalators. That's it, you've arrived at the foot of the statue. The guides want to dominate the place to take photos of their clients. Doing it this way is more likely to get you to Cristo before the train and vans from Copacabana. No unofficial cars, taxis, Ubers or vans are allowed to go beyond the Visitor Center. You will necessarily need to use the van that leaves from the Visitor Center to get to the foot of the statue. To get back you can get an Uber, as there are people arriving at the Visitor Center. I paid R$23.00 for an Uber from the Visitor Center to Leblon. If that doesn't work out, you have the option of the vans that go down to Copacabana. It really makes a difference if you arrive early, book to enter at the earliest time, it fills up quickly, as people can stay as long as they wish. Estimated time to do this tour: 3 hours. If you want, you can combine Christ in the morning and the Cable Car in the afternoon (then you can catch the sunset there). I did the Cristo and the Bondinho, but if I had to choose just one, I would go for the Bondinho, because that's what I liked the most.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-19","dataVisitacao":"2024-05-01","comentario":"The Christ is located in Tijuca National Park and this implies that there must be certain conservation standards.\nWe went up to Cristo on the train, which is fast, comfortable and cool (I recommend). Upon arrival we found a very high turnout of tourists, too high. It was impossible to walk, much less take photos. People pushed you, yelled and so on.\nOn the other hand, there was no one on the platform from the national park to stop the hundreds of tourists who fed processed food to the monkeys, which is strictly prohibited. They could calmly damage the monument since no one controls it.\nHonestly, I didn't enjoy a minute, since I arrived I was already thinking about leaving, very sad.","companhia":"FRIENDS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-05-19","dataVisitacao":"2024-03-01","comentario":"Probably everything has already been written and said about the place itself, so here are a few tips to \"optimize\" the experience.\n1. It's best to go there first thing in the morning when it opens, it fills up brutally quickly and then it's almost oppressive and a great photo without 28 strangers in it is impossible...\n2. I recommend taking the cog railway, which rattles, creaks, slowly and comfortably up through a small jungle. The entrance fee to the statue is included in the fare.\n3. Despite numerous offers with buses that \"go up\", it's better to \"drive yourself\", which can be done by train, bus, taxi, Uber and then train (see 2.)\n4. Plan for around 2 hours including the journey up and back, it's practically impossible to go any faster.\n5. If you're flexible, pay attention to the weather! On about half of all days it's cloudy or foggy, you can see the statue up there to a certain extent, but the great view over the city, which is really great, is then lost in the clouds. (if Christ is covered in clouds, you can't look down either ;)","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-05-19","dataVisitacao":"2024-05-01","comentario":"Wanted to be one of the first to see the Christ the Redeamer in the morning...we ubered up to the Paineiras Visitor Center and was there by 7am...there was already a long line on Brazilian tour groups so by the time we got to the Christ by opening at 8am it was packed...also, the tour groups were taking up both sides of the promenade and the stairs to take photos . That being said, the views were amazing and loved seeing all the monkey's","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-05-17","dataVisitacao":"2024-04-01","comentario":"Impressive when you get to the base of the Christ, the magnitude of the figure. And then there are the views of all of Rio, which on a clear day without clouds (which there are many times) are impressive, not just because of the height but because of the 360 views of the entire surroundings of Rio, city, beaches, etc.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-15","dataVisitacao":"2024-04-01","comentario":"Glad we did the train trip up to the Redeemer but unfortunately the weather gods were not kind. A fog blanketed the entire hill and luckily lifted at the top as we arrived. But we only got short glimpses of the city below as the fog persisted, so it was a little disappointing, but weather can be fickle. Could not believe the number of people at the top and it was fairly crowded, but we got some shots in! Worth the visit as it is such a recognizable part of Rios makeup.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-05-12","dataVisitacao":"2024-05-01","comentario":"What can I say about this Wonder of the World? The statue itself deserves the gold medal, but the view of Rio de Janeiro is simply unbelievable, I dare say it is the most beautiful place I have ever visited. The first time I visited and it won't be the last, Christ the Redeemer deserves its praise as a Wonder of the World.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-08","dataVisitacao":"2023-06-01","comentario":"Great day at Christ with a French tourist. We took the Corcovado trail to the statue of Christ.\n\nFor TOUR's contacts 21997218206 (Artur)","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-07","dataVisitacao":"2024-05-01","comentario":"It is a beautiful place to visit and an iconic site. However, be mentally prepared as it can get quite busy. The Christ the Redeemer monument is located on Corcovado Hill and can be reached through three main ways: hiking, driving up a narrow and steep road, or taking a train. On my visit, I chose to take the super busy train that day, resulting in a lot of queueing and waiting. Nevertheless, it was worth the wait.\n\nThe view from the monument is breathtaking, and the monument itself is truly remarkable. The history behind it is intriguing.Certain sections of the monument can be reached easily through the use of lifts and escalators. However, it's advisable to verify in advance if you require this kind of access. Unfortunately, the restrooms can only be accessed by climbing up or down stairs. In addition, there are prayer chapels available for those who prefer to pray or meditate. The restroom facilities that I used were clean.\n\nWhile visiting the monument tree gardens, I observed some conservationists tending to a spotted sloth or monkey (I cannot recall which one) perched on one of the trees. They were sharing their knowledge with tourists who were happily taking photos of the animal. This is not surprising, as the monument is situated within Tijuca National Park, an urban park located within Rio de Janeiro's mountainous terrain that boasts of a diverse range of flora and fauna. Upon reading up, I discovered that it is a reforested park. Forests around Rio de Janeiro were cleared in the 1700s for fuel, coffee growing, and livestock, leading to water shortages and flash floods due to the destruction of small streams that once served as the city's water source.  In the mid 1800’s the Emperor used slaves to re-plant trees to rewild and restore the former forest.\n\nThe souvenir shops at the top of the building were surprisingly disappointing. They were selling the same limited variety of items  at overpriced rates, in my opinion. However, the gift shop one located on the ground floor at the train station platform had a better variety of items and a friendly team to assist with your needs.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-05-07","dataVisitacao":"2024-05-01","comentario":"A beautiful and charming place, for all ages and audiences. It has a beautiful view of the city of Rio, the best time to visit is the low season, in the autumn period.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-03","dataVisitacao":"2024-05-01","comentario":"Let’s be real, is it crowders, YES, absolutely, but it is worth the views and it really is great! Obviously the prices are going to be high so don’t expect a bargain. It was a little under R$200 for my wife, me and my baby boy to go up by train. It was fun and exciting. I think it’s a great couples thing or for families with older children. It’s complicated for babies, but they do their best to accommodate everyone. There’s elevators and escalators all the way to the top. It was hot and busy, but that’s our fault for going at 10:30am","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-03","dataVisitacao":"2024-04-01","comentario":"A beautiful sight that you have to see. The cog railway takes you from the entrance to the last stop in 10 minutes. At the last stop you can take the elevator or walk up a few steps. There are small shops on the stairs where you can buy souvenirs, food, drinks, etc. Once you get to the top you have a beautiful 360 degree view of Rio. The highlight is of course the Cristo, but you have to be lucky with the photo  we were there at around 8.30 a.m. and it was already very busy. And all of that for 97 Reals.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-03","dataVisitacao":"2024-02-01","comentario":"Went very early in the morning before the crowds started, part of our guided tour with Scenic. Bigger than you expect and really spectacular to see up close .","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-05-01","dataVisitacao":"2024-04-01","comentario":"We had excellent weather and the views were terrific. Crowded, yet everyone seemed excited to be at the top. We had a guide and that faciliated our ability to take the tour.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-26","dataVisitacao":"2024-04-01","comentario":"The place itself is beautiful, worth the visit. The comment is a tip for tourists who visit: like almost every tourist spot, there are photographers taking those photos that 90% of the time are very ugly! On our way out, we were approached by these people selling photos, but we didn't want to buy any. After a lot of insistence, we agreed to keep one photo (R$ 30.00), but they claimed they didn't have any change to give it back to us and kept pushing the other photos, after much denial, we paid the 30.00 on the card and received the photo, but to our surprise, they gave us the 3 photos for R$30.00 (the normal price was R$70.00). So, here's a tip, deny the photos until they sell them for the lowest price (because photos that are not purchased will be discarded).","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-04-26","dataVisitacao":"2024-04-01","comentario":"Amazing views, but expectedly crowded at all times. Recommended for the views more than the \"TikTok\" experience, you won't be by yourself in ANY picture or video","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-04-25","dataVisitacao":"2024-04-01","comentario":"I wonder how this site was chosen to be one of the new 7 wonders of the world excluding the Pyramids of Giza. I visited all these sites except the last one in Mexico and this is the one I have given the lowest rating . \n\nFirstly, you can’t even enter the monument unless you go into the chapel at the base to pay respect . You can’t even enter inside the monument unlike the other wonders . After some time, you will just get bored looking at the statue and divert your eyes to the surrounding area that has a good view . \n\nThe stuff in here is way marked up - if you buy souvenirs, buy it at the Catholic shop, not the commercial shops . Also, you have to take the van to the entrance to justify the high fees you pay to enter your look at a statue . \n\nDon’t spent more than an hour there . You will get bored . By the way, you know that there are similar Christ the redeemer statues in other parts of the world?","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-04-23","dataVisitacao":"2024-04-01","comentario":"Family visit. Taxi to the ticket office car park, then mini bus to the top.\nIncredible view of the city. It's worth it even if it seems to be crowded, it's well organized.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-23","dataVisitacao":"2024-04-01","comentario":"The tour was great! Every place we visited was wonderful! The whole day with many attractions and lunch! Top! The Karen eagle, sensational!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-21","dataVisitacao":"2024-04-01","comentario":"We had a day with many clouds that passed quickly, sometimes it cleared a little and sometimes it was covered. However, the view down was not very clear. But for me going to RIO meant knowing, above all, CHRIST and SUGAR LOAF. We did it on a FULL RIVER excursion, which we had included in the package we had purchased. I liked it despite the clouds. We go up in a van, then you can choose the elevator or stairs, we go up by elevator and then escalators. There were a lot of people upstairs, and it's not high season, but it was Sunday, I don't know if it made any difference. There is also a train that goes up, instead of the combis.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-20","dataVisitacao":"2024-04-01","comentario":"My first visit to the Redemption Cyst. The sumptuousness of the monument is impressive. The day was perfect (no clouds), and the view of Rio de Janeiro from up there is breathtaking.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-15","dataVisitacao":"2024-04-01","comentario":"We returned on the last train of the tour to Christ. Beautiful sunset and lots of helicopters filming the sunset. Beautiful and unforgettable","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-09","dataVisitacao":"2024-03-01","comentario":"I visited this as part of an entire day tour package, which worked out great. This was our first stop via van, we arrived at 9:30am and there were no lines to get there, but the base platform was already packed. Be prepared for crowds and rude people. \n\nIt was a great experience, I would go again, just ensure to go early. It also seemed to save a lot of money, time and effort by doing an all day tour package of Rio.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-04-09","dataVisitacao":"2024-04-01","comentario":"To say that the attraction is overcrowded and that it has an incredible view is to be a fool. Yes it's incredible. But through this evaluation I want to draw attention to the lack of janitorial and landscaping. There is no need to add absolutely anything to the current infrastructure in place, what is missing is zeal, care, care and good service. The wasted potential and lack of appreciation for one of the 7 wonders of the modern world are regrettable. The impression is that it is a place exclusively for raising money that does not reinvest the minimum amount in the maintenance of the place and the well-being of visitors.","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2024-04-07","dataVisitacao":"2023-12-01","comentario":"We booked an excursion, we went on the little train, it is very nice\nUnfortunately when we arrived, the day was cloudy and we practically did not see the Christ.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-04-07","dataVisitacao":"2024-04-01","comentario":"We had a cloudy day. It is complicated if it is not very clear because down below you can't see anything and it is difficult to see Christ. You have to go in spring or summer.\nGo by train and don't listen to the bus people because they scare you and tell you that the train is expensive and you have to wait in line. All lie.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-04-04","dataVisitacao":"2024-03-01","comentario":"Gorgeous! Went on a cloudy day and was worried about not being able to see the statue but it was clear once we got to the top. Used the tram, many rude people in the tram but that has nothing to do with the actual statue, I guess we just had bad luck. We also got to see a few monkeys who were hanging out around the statue, pretty impressive and I was really not expecting that. In terms of souvenirs, I'd advise getting them anywhere else as the prices of local artisans are not as elevated. Gorgeous view of Rio as well. It is usually packed but we were expecting that, still enjoyed my visit.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-03","dataVisitacao":"2024-02-01","comentario":"We went with my wife and mother-in-law on a tour from a cruise ship. The wait to get on the train was somewhat chaotic and a bit long. When we reached the top, luckily there were escalators that were used to climb the last section. The Christ and the views of the city are impressive, something worth visiting.\nThere were a lot of people, I think it's inevitable, it was extremely hot. When we wanted to go down there was a problem between our guide and the local security of Cristo, all this happened as a result of the poor organization of the park itself and the poor location of a souvenir shop that interferes with the queue to take the train. descent (this took us an extra half hour).","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-04-02","dataVisitacao":"2024-04-01","comentario":"An amazing experience, we were lucky that the mist cleared at the top of the mountain.\nTrain ride up was good with some nice views. At the top there is a lift and escalator for those who needed them. We walked up the 210 steps, caught our breath and lost it again when we saw the views of Rio de Janerio, must be one of the most beautiful cities in the world. We were blessed with good weather. The clear sky gave us magnificent 360 degree views.\nA must do visit.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-02","dataVisitacao":"2023-05-01","comentario":"I went to Rio for the first time with my wife and I had no idea what awaited me. The view is paralyzing, the height, the landscape. When we see it in a photo we never have the real dimension of what it is in reality, and when I saw myself there, standing in front of that monument, I could only be grateful for being able to experience it. It's really worth it, and if I could give you one piece of advice it would be this: hire a guide. My experience was perfect thanks to this, as we had no problems with tickets, queues or transfers, and the extra point is that they are excellent photographers too and are dedicated to providing the best of the city to those who only know Rio da TV.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-04-01","dataVisitacao":"2023-07-01","comentario":"The view is beautiful, there's not much to do, just admire. I've been several times and every time I'm as surprised as the first time!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-31","dataVisitacao":"2024-03-01","comentario":"Very nice, essential stop if you come to Rio. We got the ticket in advance but it was the same thing that we had to wait in line to pick up the tickets and another line to get in, it took longer. poorly organized","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-03-31","dataVisitacao":"2024-03-01","comentario":"I read a lot of reviews to go early in the morning, but that didn't work out with our schedule.  We ended up taking the train (the views are fine, but you're not seeing a lot on the train up), which was fine.  We went around 4:30 and it wasn't too crazy; however more people came as we got closer to sunset.  It's obviously massive and spectacular to see, but I wouldn't anticipate staying a long time.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-03-29","dataVisitacao":"2024-03-01","comentario":"Mythical sight in Rio de Janeiro. This time I arrived in a very different way than the previous ones. We went by jeep and then by van to the top.\nAdvice: the best and simplest way to make the climb is to take the \"bondinho\", an electric train that takes you close to the top.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-27","dataVisitacao":"2024-03-01","comentario":"Excellent experience in Rio. It could be a little foggy in the morning. There is also a Helicopter experience that people can enjoy.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-27","dataVisitacao":"2023-12-01","comentario":"Christ the Redeemer is definitely something you should visit while in Rio. It's a beautiful status on top of the mountain. However, it does get heavily crowded so please be aware of the amount of people present. I had a great visit, but definitely a lot of people present.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-03-26","dataVisitacao":"2024-03-01","comentario":"To me, this is the #1 site to see in Rio.  We rode a cog railway train to get to the top of the mountain.  Once you get there, you can’t help but be impressed by the size of the statue.  However, one word of caution, try to get there as early as possible because the crowds can be overwhelming.  It’s a great site, but very crowded","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-03-25","dataVisitacao":"2024-03-01","comentario":"Our trip to Christ the Redeemer was part of an organized tour post-cruise. The trip up the mountain was accomplished in a rack-style train. Once off the train elevators and escalators take you up to the observation deck. Be prepared for a large crowd year-round, and be prepared that everyone there wants to have their photo taken with the statue behind them. This was a once in a lifetime experience but the crowd was chaotic, as most people there were pushing and shoving. We did not stay long and descended to the train platform to wait on our group.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-25","dataVisitacao":"2023-11-01","comentario":"Beautiful view from the Corcovado mountain!! Apart from that - is this figure really worth being in 7 wonders? I have some doubts","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-03-25","dataVisitacao":"2024-03-01","comentario":"The spectacular views from the top are as impressive as the Statue itself.  Come prepared for the crush of humanity riding the train to the top as well as those around the Statue.  Truly a must see for anyone visiting Rio.  Very inspirational.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-24","dataVisitacao":"2024-03-01","comentario":"Went on a guided tour in Rio where this was the first stop. Crowded and messy, as well as difficult to find good photo angles when you are so close to the statue. The statue is beautiful but there are other large Christ statues that are at least as beautiful. Hard to understand that this is one of our new seven wonders.","companhia":"FRIENDS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-03-24","dataVisitacao":"2024-03-01","comentario":"Many people, you can't walk, endless lines to take the train and get on and off, people don't talk, they compete for who shouts the loudest. Otherwise the river landscape looks complete, there are clean bathrooms.","companhia":"FRIENDS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-03-23","dataVisitacao":"2024-03-01","comentario":"Amazing monument. Must visit and a great story behind it. You get a very nice view of the city and the beaches from the top.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-23","dataVisitacao":"2024-03-01","comentario":"The monument is spectacular, an incredible view of the most famous tourist spot in the world, as well as an incredible view of the city. However, it is always full, bringing together visitors from all over the world.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-03-22","dataVisitacao":"2024-03-01","comentario":"Through Frank Hoppe we got a German-speaking guide Jalbier for two days. He drove us wonderfully for two days in his comfortable car through Rio de Janeiro. Christ the Statue and Sugarloaf Mountain were not to be missed. He had booked tickets in advance and a specific category, because we passed all the queues and quickly got to the top without a long wait. We got to know many sights, city areas, squares, beaches, specialties such as “cheese bread” and special ice cream. We were given a tip for going out in the evening with tango and eating locally. All in all a successful city tour, although 2 days are quite short. Thanks Frank and Jalbeir.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-22","dataVisitacao":"2023-10-01","comentario":"雕像很很震撼。但是人很多，不方便拍照。而且没有遮挡，很晒。上面有很多小虫子，我被咬了好几个包，很难受。但是地方很值当去的。","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-03-21","dataVisitacao":"2024-03-01","comentario":"I know it’s an iconic destination but can’t give it a good review. It was crowded and chaotic and the wait time for the train up was long and hot in oppressive humidity. It was cool to see the statue up close but the crowds made it difficult to take any good pictures. The views of Rio are much nicer  (in my opinion) from Sugarloaf even though it’s not as high. The worst was the lack of ability to cue and lack of manners and even aggressive pushing in the lines. The worst, I’m sorry to say were tourists from Russia who still can fly here and their reputation as rude tourists precedes them. Overall unpleasant experience and would have been happy to skip it (or maybe take a van instead)","companhia":"COUPLES","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2024-03-21","dataVisitacao":"2024-03-01","comentario":"OK, this is an incredible monument and it must be visited BUT the queues to get there and crowding en route and there are frustrating and make the whole visit unpleasant. Not sure what the answer is but if you are expecting a pleasant, meaningful and peaceful experience you will be disappointed. Worth checking what cruise ships are in. If the larger ones in port avoid their ashore times if possible.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-03-20","dataVisitacao":"2024-03-01","comentario":"Excellent e
