xcursion. Very well organized and the Christ imposing.\nMy tour included other attractions such as the Maracana, Sambodromo and the Cathedral.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-03-18","dataVisitacao":"2024-03-01","comentario":"Excellent landscapes, very welcoming people, the best beaches...clean and tidy. In conclusion wonderful city.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-17","dataVisitacao":"2024-02-01","comentario":"The statue of Christ the Redeemer is impressive, although it is not as huge as it looks in some photos. The views from the Corcovado mountain are gorgeous, although the light in the middle of the day is flat and a bit boring. Sunrise and sunset would be much better for taking good photos. The area around the bottom of the statue is extremely crowded. One can have only a few seconds to look in each direction, because there is a queue of people waiting for the spot. Lots of people take photos imitating Christ's gesture (apparently without understanding its meaning), which is weird and a bit unpleasant.","companhia":"FRIENDS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-03-17","dataVisitacao":"2024-03-01","comentario":"Getting to the site is easy taking Uber (great service in Rio overall), just put in Painerias Corcovado location takes you to the top drop off area by the visitors center.  You can also take a train/tram but crowds can be large and waiting.  Once at visitor center (buy your tickets before online) check in and take a van to top (included with ticket) and a long walk and steep.  Go early before 9 to limit crowds. At base of statue many people no matter what time but can get your pics of the statue and great views of the city below. I was concerned about getting a car back (several Ubers dropped our ride up due to the distance and rough roads I think) but that was easy and pick up is at the drop off area, not the actual entrance of the visitors center.  There are also many cabs but Ubers were quick the morning we were there.  Worth the time and money if you go to Rio!","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-03-16","dataVisitacao":"2024-03-01","comentario":"The panoramic view that you can enjoy is unparalleled. The ascent with an elegant rack is original and completely unexpected.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-15","dataVisitacao":"2024-03-01","comentario":"I had an idea about Corcovado. I was not deceived. An 8 m base which supports a 30 meter high statue at the top of a hill, overlooking the favelas.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-13","dataVisitacao":"2024-03-01","comentario":"Amazing location and view! We bought train tickets in advance and collected them at the Corcovado station. Go early (around 8 AM) to avoid the huge crowd.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-12","dataVisitacao":"2024-03-01","comentario":"It could have been better if there had been *organization in the queue to enter* and a limit of people. Unfortunately, no one understood which queue to be in and I saw a man buy 1 ticket on the spot (it wasn't an exchange for an advance reservation) and he went ahead of many people. There is no limit to the number of people at the viewpoint and on Sunday it was so crowded that it was impossible to take a good photo.\nTo get there, take the train (getting on the train was also crazy), then there is the elevator option (ok) and finally the escalator, very good accessibility.\nAnyway....lack of organization.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-03-11","dataVisitacao":"2023-04-01","comentario":"You need to visit here! This is admiration and magnificence!!!!! Power! My husband proposed to me here! Paid entrance. But everything is convenient and fast","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-09","dataVisitacao":"2024-02-01","comentario":"The Christ the Redeemer statue and the view over Rio De Janeiro bay are both incredible!! We were fortunate that we went on a day with no cruise ships in port, since the day before there were 4 and it was packed. we took the 184 bus, the 183 goes there as well. It's the cheapest way to go from the Copacabana area to the mountain. You need a bus card which cost 4 Real and are available at any metro station.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-07","dataVisitacao":"2024-02-01","comentario":"Very beautiful and exciting to go up to see Christ, the view is truly spectacular!!! It's a shame it got cloudy and we only saw half of it.\nWe hired a personal guide to go to Sugar Loaf and Christ, he picked us up early at the hotel in his car, he accompanied us and explained absolutely all the historical, technical data, etc. both the attractions and the city.\nWe went up by train, it is a little more expensive, but it is much more picturesque and comfortable\nThere were a lot of people and it was quite hot, but you can't leave Rio de Janeiro without visiting Christ the Redeemer!!!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-06","dataVisitacao":"2024-03-01","comentario":"Magnificent statue reached by a train that carries about 500 pax and has a 20\nMinute turnaround. The only problem is it is absolutely packed full of people. Not just normal\nPeople that walk around, take a pic and enjoy the view. I'm talking about couples, large families and those dreaded Instagram influencers that try to secure large areas where they can have multiple photos taken with multiple poses and expect that the thousand people there will just stand idly by and allow this to happen. If we did that we would never get to one side of the place to the other. In addition people walking  around smiling and throwing their butts on the ground at a supposedly religious and significant place. You are literally shoulder to shoulder with people and you have to just ignore people pushing you out of there photo space.\nBut the views are wonderful and if like us you prefer to actually look at the view and take it in via your eyes and not the lenses of your phone camera it can be a wonderful\nExperience. Not sure why people bother sometimes they arrive, take 100 pics, check the phone, do a re shoot and check the phone and leave .","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-03-04","dataVisitacao":"2024-02-01","comentario":"Christ the Redeemer was something that I have longed to do for decades. Once there I could not wait to get away due to the hordes  of rude people that hold people hostage while taking their epic postcard photo with Christ. Views are stupendous up there but there were simply too many people!!!!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-04","dataVisitacao":"2024-03-01","comentario":"Although the place is very beautiful and knowing Christ the Redeemer is a beautiful experience, getting there can be torture. We arrived with purchased tickets and they didn't know how to tell us where to go. They do not have staff who speak Spanish.\nOn the train that goes up we were stopped since there were more people than the capacity. We arrived and to return the same people stopped. There are no water refill stations and the place where you wait for the train (above) does not even have fans, the heat cannot be tolerated. So they charge a minimum of a bottle of fresh water or a juice they should give you.","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2024-03-04","dataVisitacao":"2024-02-01","comentario":"It is the icon of Rio de Janeiro, the place where you cannot stop going. From Copacabana vans leave that take you to the base of Christ, including the entrance fee and round trip ticket.\nThe other option is to go by Uber, in our case there were 4 of us. It was cheaper to go by Uber to the Christ the Redeemer ticket office (you have to put it like this on the Uber) and we bought the ticket, we paid 50 reais in low season, I don't know if it was because of the day or because February at the end of the month is low. The Uber from Copacabana cost 50 reais. Keep in mind that you should always look at the paneiras YouTube cameras or search for the live Christ the Redeemer camera before going. If there are clouds, you don't see absolutely anything, not even the Christ, and even if it is sunny from the bottom up, there may be clouds.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-03","dataVisitacao":"2024-01-01","comentario":"due to the weather condition we waited until our last day in rio de janeiro and then we got the chance. the panoramic view is amazing","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-03-03","dataVisitacao":"2024-03-01","comentario":"You go to the Largo do Marchao subway station and then take bus 422 (behind the church) to the cog railway. The whole trip is beautiful, the view from the top is great. You should plan 4 hours for the trip. So start early, then you can go to the Maracana for a game in the afternoon.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-27","dataVisitacao":"2024-02-01","comentario":"Not sure how often this happens but due to low cloud we could hardly see anything.\n\nMessage is clear…… check the forecast!!!!!!\n\nHowever we enjoyed the train journey (about 30 mins) up and the place was still very busy.\n\nI have a ghostly photo of the Redeemer but obviously am pretty disappointed…… but no-one’s fault\n\nMaybe I will get chance again in the future…….. as this statue is certainly\niconic.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-02-26","dataVisitacao":"2024-02-01","comentario":"Incredible, we went on the Corcovado trendel, remember to book a time online if it is high season or a weekend or you can have a good time waiting in line in the heat. But it's worth the wait anyway.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-23","dataVisitacao":"2024-02-01","comentario":"We went early in the morning, on a somewhat cloudy day, which helped keep it from being so hot. Beautiful views. Lots of people in the place. We go up with the train, then the elevator and then the escalators, which makes the journey very simple.\nBeautiful views of Rio de Janeiro.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-23","dataVisitacao":"2024-02-01","comentario":"Amazing all around views of Rio. Breathtaking! Definitely a must stop on your trip to Rio of Janeiro. You will be mesmerized.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-22","dataVisitacao":"2023-10-01","comentario":"Without a doubt spectacular and exceeded my expectations.\nWhen you see something that you can't explain how it was made, how it was placed.\nWear comfortable shoes.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-22","dataVisitacao":"2023-11-01","comentario":"November is a good time to visit Rio if what you want is to visit Christ the Redeemer, since it is a hot season and it is always clear, you walk a bit and climb quite a few stairs so you have to take that into account and bring water for hydrate and refresh, other than that it was an excellent experience","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-02-21","dataVisitacao":"2024-02-01","comentario":"Second time I visited it and again it was a cloudy day, but this time I was able to see more clearly the face of Christ and the imposing nature of the statue.\nWe managed to see at least the northern part of Rio, the Maracaná stadium and surrounding areas.\nOne of the 7 wonders of the modern world that you cannot miss.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-20","dataVisitacao":"2024-01-01","comentario":"It was a very warm day when we visited the attraction. Also it was a holiday in Brazil. Need I say more!\nA lot of people, attraction prices for water beer etc .. \nHowever the views were extraordinary from all sides .. \nif only once in Rio you gotta do it ..","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-02-20","dataVisitacao":"2024-02-01","comentario":"If you're going to Rio, you have to go, but be prepared for a lot of heat, a lot of people, because of the location, the ideal would be to enjoy it for longer... I never managed to stay long, it takes longer between shopping and getting up (by train is more fun, and it makes the investment is worth the view and experience) than actually being there. There should be a limit on the number of people going up, it would be a more connected experience.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-02-19","dataVisitacao":"2023-03-01","comentario":"Best views in Rio. Unlike anything I’ve ever seen. A true wonder. Beautifully laid out and landscaped en route up to the statue. It gets very busy and very warm so take water with you. Flat shoes are a must. There are a lot of stairs to get to the top. Once you’re there the views are simply spectacular and the statue itself is utterly breathtaking.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-17","dataVisitacao":"2024-02-01","comentario":"Amazing views. Very crowded. \nAt the train waiting area they could definitely use some AC because it s boiling hot. Resonably priced although when you buy your ticket there are different prices for tourists or brazilians. Just choose that you re from Brazil lol","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-02-16","dataVisitacao":"2024-02-01","comentario":"A great experience. We went with a local guide, but you can go on your own without problems. There are a lot of people, so it is advisable to go early, but even with the large number of people, you can access the Christ without problems. By looking for a good angle you can take good photos of the place and the view of Rio is incredible.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-15","dataVisitacao":"2024-01-01","comentario":"It is a mandatory stop if you are traveling to Rio de Janeiro for the first time. On my visit, I chose the Corcovado train, which is extremely impressive for the climb and the views it offers. However, being under Christ the Redeemer and having a view of the city without the presence of clouds is a unique moment. Really worth it. I recommend going very early in the morning, because even though it is at 10 a.m. there will be quite a few people.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-15","dataVisitacao":"2024-02-01","comentario":"Were there lots of tourists? Yes! Was it a bit expensive? Yes! Was it still worth it? Yes!\n\nDefinitely a bucket list thing for many people, I feel lucky to have had the chance to go. The views over Rio were great. We got the tram up and the whole process was so much less stressful than I had imagined. I had got the impression that if you don't book the day before it would be a mistake.\n\nWe winged it and just arrived reasonably early and bought tickets from the machine. We then had about an hour to have a lovely brunch at a classy cafe just a few mins away. When we got back, our timed ticket meant that we were ushered straight through the crowds near the front of the queue. The journey up was spectacular and even though there was a wait getting on again on the way down, I thought the queuing system was generally excellent- and we had the bonus of seeing the biggest butterfly ever while we were waiting!\n\nAll a memory to keep forever.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-14","dataVisitacao":"2024-02-01","comentario":"As usual, a must see for anyone visiting Rio.  This is truly a modern marvel.  The history of how the statue location and built is quite interesting.  Well worth it.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-13","dataVisitacao":"2024-02-01","comentario":"Totally overhyped. Full of tourists. The price is not worth to lose time to go there. Rio has other options. Go and see other places.","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2024-02-12","dataVisitacao":"2024-02-01","comentario":"Well, firstly iis a world wonder; so of course it is amazing. It is around 280 Brasilian real for two people. They gave us a ticket for the train. You can take the train and hangout as much as you like up there, and go back anytime you want. There are toilets, gift shops, a restaurant up there. It is super crowded in February ( it was carnival time though) and super hot. So if you are coming in summer season do not forget your glasses, you hat and most importantly the sun screen.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-11","dataVisitacao":"2024-02-01","comentario":"The view is wonderful, you may have a little difficulty taking photos because it is very crowded, but the atmosphere is wonderful.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-10","dataVisitacao":"2024-02-01","comentario":"Perched atop Rio de Janeiro’s Corcovado mountain, Christ the Redeemer is an iconic monument that commands attention. Standing 30 meters tall, this statue of Jesus Christ with outstretched arms offers stunning views of the city and serves as a beacon of spiritual and cultural significance. A visit to this awe inspiring landmark is a testament to both human ingenuity and the enduring power of faith.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-09","dataVisitacao":"2024-02-01","comentario":"Good experience. Buy the Tk on the official website and I went by Uber, contracted the train experience. It didn't have air conditioning, and I went up first thing in the morning with many people already in the Christ. They respected the train schedule. Suggestion, do not book an excursion. Do it by your own means.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-02-09","dataVisitacao":"2023-12-01","comentario":"Honestly, it doesn't stop. Another kite statue after Vung Tao, Cusco, Świebodzin, Puerto Plata and Indonesia.\nThe only difference is the scale - yes, this one is big. The picturesque and winding road leads you from the alleys of the favelas towards the sky - towards the mountain that dominates all of Rio. It is from here that the postcard image of Rio de Jeneiro (known throughout the holiday) can be seen.\nThe terrible inconvenience of the place is the fact that there are always \"a million people\" there, so you should forget about the comfort of enjoying the views and nature surrounding you. Tickets are at a normal price (80 reais).\nWhen in Rio, you have to be here... but is it worth it?","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-02-02","dataVisitacao":"2024-02-01","comentario":"With my wife and daughter we visited Christ the Redeemer, and the truth is that the experience was very good.\nIn our case, we went in a van from the Paneiras company that took us to the reception of the monument, and from there we took a second van that was offered to us in the place for being with an almost two-year-old girl, which did not allow us to go up. the stairs at the foot of the statue.\nOnce at the top, it is very easy to take good photos of Christ, regardless of the number of people at the top. That said, the best time to visit is the morning, to avoid crowds and high temperatures if you go in summer.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-02-01","dataVisitacao":"2024-01-01","comentario":"Terrible service to tourists from the company that handles all the logistics of visiting the Christ, \"I clarify that my Rating is the service and prices that one pays to that company\" they charge a lot of money that in the end is not reflected in a good service , slow transportation, ruined stairs, dirty areas, complications to get to the tourist area almost at the top of the mountain where you can just use your purchase tickets.\n\nThere is literally a bigger and taller Christ in Cochabamba Bolivia and with better facilities for tourists","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2024-02-01","dataVisitacao":"2024-02-01","comentario":"We did 10 min ride to christ the redeemer. Staff was very professional and ride was very safe. We had a very beautiful view of christ the redeemer.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-28","dataVisitacao":"2024-01-01","comentario":"The views were incredible! We took a lot of photos! The truly impressive Christ. We went on the Corcovado Train and the experience was 10 points! Easy, fast and very entertaining train journey both there and back! Bring plenty of water because it is very hot up there!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-24","dataVisitacao":"2024-01-01","comentario":"Always as magical, the greatest joy is not having to queue at the entrance and you will have this privilege if you are 60 years old and over, zero waiting, real happiness when it's 40 in the shade.....","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-23","dataVisitacao":"2024-01-01","comentario":"Not to be missed, it is somewhat expensive, 120 reais per person, those over 11 already pay as an adult. Although we had bad weather, I recommend visiting it.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-22","dataVisitacao":"2023-12-01","comentario":"Christ the Redeemer is a must-see in Rio. As it is a super touristy place, it is advisable to go early, in the morning. The Christ is imposing as are the views of Rio de Janeiro. Taking photos is an odyssey due to the number of people circulating, but with patience it is achieved.\nThe road to get there is winding but it can be done calmly (we hired an excursion because we were coming from Buzios)","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-01-21","dataVisitacao":"2024-01-01","comentario":"It is impossible to visit Rio without seeing Christ. Very beautiful place, with a beautiful view. I went up to Corcovado by train, super fast, comfortable.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-20","dataVisitacao":"2023-10-01","comentario":"Recently got chance to witness this amazing statue part of 7 Wonders of the World. View was mesmerizing.\n\nTips :\nHire a tour guide around 300 Reais from your hotel due to language barrier.\n\nAvoid weekends if possible due to long queue of people, check pics for crowds.\n\nPlan for first half (before noon).","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-01-17","dataVisitacao":"2023-07-01","comentario":"Being one of the 7 wonders of the world defines in itself what you can expect from a monument and that is that it is an imposing sculpture, in addition to being in a great location.\nVisiting Christ the Redeemer does not only mean seeing the monument, but also the spectacular views from there.\nOf course, precisely because of all this, it is overcrowded, and the capacity is controlled with the different hourly passes. But if you don't arrive first thing in the morning, it's a lot of people coming and going, and it's even a bit overwhelming to move around, because it's a struggle to get a place to appreciate the views.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-17","dataVisitacao":"2024-01-01","comentario":"We booked the first time on the Corcovado Train and arrived at the foot of Christ at 7:40. When we arrived it was quite empty, we could take photos alone with the statue, but the place fills up VERY FAST!\n\nThe views from the train are beautiful but not unmissable, so if the intention is to save money or take really beautiful photos, I think it's a good idea to go by van, as the first vans arrive before the first train.\n\nThe downside of going early is that we didn't find almost any shops/snack bars open and we were dying for some ice cold water, as even in the morning it was very hot and very sunny (it's also very windy, I went in a skirt and it went up in several moments).\n\nCentro Paineiras has several beautiful souvenirs, but very expensive! Prices for foreigners!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-16","dataVisitacao":"2024-01-01","comentario":"Highlight: spectacular view of Rio\nLow points: crowding in the morning and absurd heat at the train station and inside the train\nSuggestion: 1) go in the afternoon in high season. I returned at 2:30 pm and the station was empty. It will be a more comfortable experience; 2) buy tickets via the app in advance (avoid queues).","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-01-16","dataVisitacao":"2023-12-01","comentario":"One of the attractions that has the most impact at first glance. It is a must-see if you visit Rio de Janeiro.\n\nConsidered one of the 7 wonders of the world, Christ the Redeemer imposes itself from minute one. The train that must be taken to get there contributes to generating that feeling of expectation and anxiety when faced with something new.\n\nIf the splendor of being meters from an immense wonder were not enough, the view one has of the city from up there is sublime. One of the strategic places in Rio to get Instagram-worthy photos.\n\nKey to keep in mind: visit it on a day when the sun is good. Going on a cloudy day will take away the feeling of being 3 meters above the sky.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-15","dataVisitacao":"2024-01-01","comentario":"The view is incredible, we took lots of photos.\nIt is not easy to park your own vehicle and, in this case, we do not recommend late afternoon because nearby parking lots close at 7pm.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-01-13","dataVisitacao":"2024-01-01","comentario":"Its worth visit when in Rio.We visited here two times.i recommend boking online and visit very early.its a unique experience","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-11","dataVisitacao":"2024-01-01","comentario":"We hired the climb to Christ with a trafic since the train was full, until the afternoon there was no way to get on it, except by means of trafic that offer the service or private vehicles. They offered us 70 reais each to go up to the Christ, we paid 210 reais, the air in the vehicle did not work, it was very hot at 11 in the morning. We arrived at a large parking lot, we got off, everyone finished their journey there and there were 3.5 km of climbing left to reach the destination. There they informed us that we had to pay another 50 reais each to get to the top in another traffic. In response to our complaint, they confirmed that there was no way we didn't pay and that another option was to walk up. Faced with the impotence of not having an answer, we made our complaint to the tourist information that is in that place, no one gave us an answer since we had paid the climb to Christ and the traffic leaves you and leaves, that is, there is no one to help. claim from the Moraleja company the only way to get to Christ is on the train. This way they will not have a bad time since no one takes care of the tourists or the control of the traffic they sell and whether they comply with what is agreed.","companhia":"FRIENDS","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2024-01-09","dataVisitacao":"2023-07-01","comentario":"So, I actually enjoyed visiting, but it was very crowded, so I almost lost my family. I recommend the visit to anyone going to Rio de Janeiro.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-01-08","dataVisitacao":"2023-12-01","comentario":"Mandatory visit. Wonderful view. But always full. Difficulty taking photos and enjoying the place calmly. I recommend taking the train that leaves from Cosme Velho station. We bought tickets online and picked up tickets on site. There was no queue. It's a very quick visit for those (like me) with children as apart from the view there isn't much to do.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-01-07","dataVisitacao":"2024-01-01","comentario":"The train process is totally chaotic and annoying. Buying in advance helps get a slot on the train, but be prepared to wait in four lines to get up, and a long line to exit. Once up top, the views are absolutely killer, if you can navigate the teens and tweens who are snapping the same ridiculous pics and thinking they're clever.","companhia":"COUPLES","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2024-01-05","dataVisitacao":"2023-07-01","comentario":"Anyone who comes to Rio de Janeiro cannot miss visiting one of the seven wonders of the modern world! Simply Sensational  a unique and unmissable experience!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-03","dataVisitacao":"2023-12-01","comentario":"Imposing, majestic, evocative, located on the top of Corcovado, a 710 m high mountain, or Monte Cristo, in the Tijuca national park.\nEnchanting, breathtaking view.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-01-03","dataVisitacao":"2023-11-01","comentario":"It's beautiful? Yes, but it's not worth the money invested, unlike some other tourist attractions in the city, there is no discount for anyone who is Brazilian or lives in RJ. The problems start on the city's official tourism website which recommends going by van, it's about 50 minutes from Copacabana to get there, when you arrive there is a souvenir shop and a mini interactive museum about the forest that surrounds the region, some bathrooms are not very sanitized, and recommend continuing to the end to catch another van that takes you further, with a basic stop to take a souvenir photo in front of the mural (which is sold at the exit). When you arrive there is no sign, nor anyone telling you how to get to Christ, so you climb several flights of stairs until you reach the top, when you arrive there is no facility to buy water or sit down to rest a little and recover your energy (there is even a mini altar with some chairs, but security doesn't allow you to sit down, even if there is no mass or event taking place), much less the limit of people there, there are easily more than 200 people trying to do exactly the same thing: getting a photo decent. I believe I went on the worst possible day and time, Saturday 1pm, with a heat of 42°C and a feeling of 60°C. When I finally gave up on enduring the heat and the crowd, I discovered that to go up there is an option for an escalator and an elevator (which could have avoided exhaustion from climbing several flights of stairs). I felt ill with a drop in blood pressure and they told me to go to the local medical clinic (all of which are fantastic! and they told me that I shouldn't have gone by van, as besides taking a long time, it's more dangerous, and that the best option was to have gone by train - which is not listed as an option on the city's official tourism website), once cleared it is time to go down the hill, upon arriving at the first stop it is time for the vendors to offer the photo that was taken when leaving the museum , \"only\" R$30 each, but there is a discount if you take 4, then there is a queue to catch the next van that returns to the point of origin in Copacabana and they recommend staying at the restaurant with its overpriced prices while you wait. It's the typical tour for tourists to go once and never again.","companhia":"FRIENDS","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2024-01-03","dataVisitacao":"2023-12-01","comentario":"The only time that our schedule allowed for a visit was late afternoon on a very cloudy/foggy day.  As the clouds blew through, there were times when we could barely see the statue even though we were standing right under it.  However, as the clouds intermittently cleared, we were treated to a truly awe-inspiring sight.  My biggest regret was the inability to get the panoramic views of the city, the beaches, and Sugarloaf that other visitors' photos had depicted.  Regardless, it was definitely worth the trip.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-01-02","dataVisitacao":"2023-12-01","comentario":"Beautiful place, super touristy, easy to access, the landscape going up is beautiful to take good photos as a couple, we had a super clear day, if there are a lot of tourists but it is part of the place, I would go a thousand times.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-12-30","dataVisitacao":"2023-12-01","comentario":"A wonderful place with an amazing view of RJ. We went early and yet there were many people which did not allow us to enjoy it as we would have liked. Recommendation: do not go in high season. I want to mention that we stopped near Post 5 in Copacabana and from there the local bus (583) takes you, drops you off at the door and costs R$ 4.3 per person. In our case it was convenient because there are 2 of us, but if there are 4 people for R$ 20 an Uber will take them from this point. To get on there are 3 options, the first and most chosen for the experience it provides is on the train which costs approximately R$125 and already includes the entrance, the second is to hire a Van with one of the guys in a white t-shirt, which costs $R70 per person and does not include entry to Christ. The third for the very bold is walking, but you have to be very physically fit to do it! Since in high season the train had to wait more than 4 hours, we opted for the Van. We traveled with air conditioning and they dropped us off at the foot of Christ. Be careful, as soon as you get off it is FULL of people who sell fake tickets, the typical verse is to say that they give it to you a little cheaper, or that there are delays of hours and they make you pass faster by paying a premium. It's a lie people, don't fall!! I had read here that several users had warned about it. The strange thing is that it is full of guards and official guides and no one does anything, they watch tourists being scammed in the face and just stand by and watch. ONLY BUY THE ENTRANCE TICKET AT THE OFFICIAL TICKET OFFICE, which is located inside the building. Once inside, you can go up by elevators and escalator or by common staircase, it is optional. Before arriving at the Christ they take a photo of you with a banner in the background so that when you leave you can take the souvenir for R$50, it is a good option since as I said at the beginning during the season there are a lot of people and it is impossible to get a good shot. Once up you appreciate the panoramic view of the city, it is a beauty. If they are Catholic there are chapels to pray. There is also a restaurant to drink or eat something. and there are bathrooms, although not very hygienic, at least upstairs. To return to Copacabana we took bus 584. I hope this experience is useful to you!","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-12-24","dataVisitacao":"2023-12-01","comentario":"It is considered one of the seven wonders of the new world, located on one of the highest points of the city with a spectacular 360° view. We were there on a gray day, but even so there was a beautiful view. The big problem is the huge crowd that prevents you from fully appreciating the context","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-12-20","dataVisitacao":"2023-11-01","comentario":"I had good weather, cloudless and warm, excellent to see the wonderful view of Rio, the overall experience is very good, it is definitely worth visiting this wonder of the world.\nAs a suggestion, buy your train tickets online to avoid long lines.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-12-20","dataVisitacao":"2023-11-01","comentario":"Incredible, the view of Rio is spectacular from the top, without a doubt November was a good time to visit, there were not too many people nor were there clouds, I recommend buying the train tickets online to avoid waiting in lines","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-12-16","dataVisitacao":"2023-12-01","comentario":"Relieved that our visit here didn’t include waiting hours in queues. Visited mid November and the entire experience was really positive. Defo book online to avoid queuing for tickets. Train up, lifts and escalators made our visit efficient and pleasant. Amazing views from the top along with being amongst one of the worlds most at iconic places.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-12-16","dataVisitacao":"2023-12-01","comentario":"Third wonder of the modern world! Symbol of South America! Largest Art Deco sculpture in the world! It all starts with a prophecy by Amerigo Vespucio in 1502!","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-12-16","dataVisitacao":"2023-12-01","comentario":"Getting there. Canadians in Barra. Take Uber , easy and efficient, however very important the address. We had christ redeemer in Uber and took us to the cog train start. What we have learned! Put Painerias Corcovado. Very important. Research it. This is 5 min drive from the top, Uber can take you there. From there 50 meter walk up hill to ticket center. Cost 55R per person. This gets you into van and drive another 5 min or less. Keep ticket  to get back on van down 5 min. Then get Uber or taxi from spot you got dropped off at. That's it. It's thst simple. However get Uber to take you to right spot at the beginning, from there everything else is straight forward. \nTop, crowded, great views, a must sew and then tick thst bucket list!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-12-14","dataVisitacao":"2023-11-01","comentario":"Symbol of Rio de Janeiro, wonderful landscape of the wonderful city. Tourist Rio takes you with great safety and comfort.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-12-14","dataVisitacao":"2023-12-01","comentario":"As for the climb to Christ, everything was as expected. The day was beautiful, we were able to take photos and we enjoyed it. But there was an incident that I want to leave here, because thanks to a comment from a user of this page we were able to resolve it.\nWe decided to go to Christ by car. The route is very friendly, well signposted and without setbacks. The issue was when arriving at the entrance for the climb (Estr. das Paineiras). There we were intercepted by a group of people from travel agencies. Seeing ourselves surrounded and because we were with our three daughters, we decided to back away out of fear, since we did not know who these people were who threw themselves on top of the car screaming. One posed as a government agent!!! After leaving, being chased by one of them on a motorcycle, and re-entering, we were able to overcome this unfortunate situation.\n In order not to extend myself, I make it clear:\n1) If you go by car, when you get to that point DO NOT stop (even though you hear screams, they scare you that it is dangerous, there are fabellas, etc. NONE of that is true). They wanted to charge us 200 reales each when in truth it costs 56 reales to climb the Christ. They also take you to the same point where you can reach yourself.\n2) it is a road with many curves and climbs, but well signposted (about 8 to 10 minutes)\n3) you arrive at a very large building where the tickets are purchased.\n4) You leave the car before reaching that large building approximately one block away. Where are all the cars left (they will charge you something for parking there)\n5) In short, we paid 56 reais and they put us in a van. you can do it by train from there for 100 reais\nIt's a shame that they do that with tourists and that if it happens all the time, they don't take action about it.\nI hope this review helps you","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2023-12-08","dataVisitacao":"2023-08-01","comentario":"The place is too crowded, it is very difficult to take a photograph that does not have 50 people behind it. There are people almost fighting for a space for photography… the views are beautiful and accessibility is very easy.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-12-04","dataVisitacao":"2023-05-01","comentario":"Although this site is not one of the most beautiful in Rio, it is truly unmissable!\nHowever, to avoid being disappointed, you must choose your day, your departure time, and your means of transport carefully.\nFor what?\n1) Mount Corcovado, where Christ the Redeemer is located, is the highest place in Rio, and is therefore often covered in clouds when it is not raining! You should know that the mist often rises after 11 a.m. and blocks the view. Yes, the weather is changeable in Rio where the climate is oceanic. So CHECK THE WEATHER CAREFULLY AND PROVIDE A VISIT IN SEVERE WEATHER!\nWhich is completely impossible if you buy your funicular tickets in advance for a day... the time of which we still don't know!\n2) This is the reason why we were advised not to take the funicular, but a taxi, as early as possible, i.e. at 7:30 a.m. to go to the entrance to the Park from where the departure points the minivans taking you to the ticket offices under the statue of Christ: The funicular does not leave until 8 a.m. and the queues, even with skip-the-line tickets, are impressive. (Moreover, the funicular journey which boasts of passing through the Tijuca forest is not exceptional because you can enjoy this forest everywhere in Rio, and especially in the magnificent Botanical Garden and in the Lagé Park where very young children monkeys come and eat from your hands.)\nThe best solution is therefore to take a taxi at 7:30 a.m., which allows you to avoid the crowds around Christ!\n3) If the statue of the Redeemer is much smaller and less impressive than we imagine, the panorama is absolutely extraordinary!\n4) You can easily visit the site of Christ the Redeemer first in the morning, then continue with Sugarloaf Mountain in the afternoon. We found Sugarloaf Mountain much more beautiful, and much easier to visit, because there are fewer tourists and, as it is lower, there is no risk of it being drowned in mist.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-12-03","dataVisitacao":"2023-11-01","comentario":"I had been there many years ago, but I was enchanted again. We went on the cable car, after arriving you have the option of stairs or elevator to Christ. The stunning landscape of Rio, the imposing statue, enchants everyone. It's always worth going back and forth.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-12-01","dataVisitacao":"2023-11-01","comentario":"The visit is oversold, they should offer them on schedule, establishing a maximum number. The place is small and you have very good views of the city but everyone tries to take a photo with Christ and it is done between jostling, and always in an atmosphere of disorder and lots of people. It would be useful and appreciated if the same managers and guides helped organize it.","companhia":"BUSINESS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-11-30","dataVisitacao":"2023-08-01","comentario":"Definitely a beautiful view. I recommend taking the corcovado train instead of the vans, the price is the same or even cheaper and the view is better. If you have the opportunity, hop on the first trains, until the 8:20am train. You will have less queues on the way up and on the way down and there will be fewer tourists up there.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-29","dataVisitacao":"2023-11-01","comentario":"Beautiful call, once in a lifetime experience. Great service, beautiful view, only praise, I intend to return!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-29","dataVisitacao":"2023-10-01","comentario":"A must visit when you are in Rio.The best attraction in Rio.beautiful views from the top.unique experience","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-28","dataVisitacao":"2023-10-01","comentario":"The Corcovado mountain with the huge statue of Christ the Redeemer is spectacular. From its height it allows an exceptional view of the panorama of Rio de Janeiro. It's worth it.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-28","dataVisitacao":"2023-11-01","comentario":"Christ the Redeemer is magnificent! I'm a tour guide and I take trips every day to Corcovado telling the history and curiosities of this beautiful monument and wonderful city! And every day I am enchanted by this majestic work!","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-27","dataVisitacao":"2023-11-01","comentario":"I went on a rainy day, it's a shame I couldn't enjoy it more. There are a lot of people in the official store offering photos to buy, it gets annoying.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-24","dataVisitacao":"2023-11-01","comentario":"For me it was the best in Rio, they are very well organized, you can go by bus, or by train, we chose the latter and we thought it was the best, beautiful views and very efficient in boarding and disembarking; Upstairs they sell souvenirs but the prices are higher, in Ipanema or Copacabana you can find the same thing and for half the price.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-24","dataVisitacao":"2023-11-01","comentario":"A must on your visit to Rio de Janeiro. I have gone twice and both times I have gone with the train. I recommend purchasing train tickets directly from the application. In case of fog you don't see much, but if you wait a while (having a soft drink or in the gift shop) the fog passes quickly. You can see Sugar Loaf, Marcaná, among others. The problem with the photos is due to the number of people, but that is inevitable in these tourist places.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-22","dataVisitacao":"2023-11-01","comentario":"make a reservation on the tram website, then take an uber to the station from wherever you are.  the paid tours are NOT worth the money unless you are really uncomfortable travelers and really need somone to hold your hand the entire time.\nuber rides are cheap and safe,  and the station, although a bit hectic y first world standards, is easy enough to navigate.\nalso , go in the morning to avoid crazy crowds","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-19","dataVisitacao":"2023-11-01","comentario":"It has no structure for high temperature days. Disorganized queue that does not respect preference for the elderly, there is no shelter from the sun, there is no security or guidance when opening the gate to get on the tram. We bought tickets in advance but there is a waiting line that gets in before those who have a scheduled time.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-11-18","dataVisitacao":"2023-11-01","comentario":"A wonder of the world with awesome views of the city and its beautiful natural landscapes. Quite popular with tourists even in low season so it is challenging to take a photo. Many instagram selfies too. A must see in Rio.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-11-18","dataVisitacao":"2023-11-01","comentario":"Unfortunately for us, we came during a heat wave… the line to enter the park was very long and it was under the sun. Then when climbing the stairs you have the mechanical option or climbing the 220 steps, climb them if you can, it's worth it to live the full experience!\nUpstairs it was so full of people to the point that a photo cost a lot, be careful with the hats, because the wind was still strong hahaha.\nNice experience yes, use a lot of sunscreen and hats. Drink plenty of water to stay hydrated.\nThere are very clean and nice bathrooms at the entrance to the park and up in the same Christ.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-11-16","dataVisitacao":"2023-11-01","comentario":"The view from up there is fantastic. It is Brazil's main postcard and is worth a visit. It is possible to get there with official tram vans (also official). On hot days it's best to go first thing in the morning.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-11-15","dataVisitacao":"2023-04-01","comentario":"Very nice, but very crowded, you have to get the idea that there are a lot of people from the first hour. So walking and taking photos difficult. But the view is incredible","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-11-12","dataVisitacao":"2023-11-01","comentario":"We visited early morning and went on the rail trams, it was not to badly crowded but there was a bit of cloud about , sometimes the statue disappeared and then magically appeared again .Very good views all around and one of the must see Brazil landmarks .There is a little chapel at the back of the statue base.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-11-06","dataVisitacao":"2023-11-01","comentario":"Wonderful trip with a great view of the Manacana Stadium, Sugarloaf Mountain and Copacabana. Be careful when you arrive so that you don't fall into the hands of the catchers. They don't take the small bus all the way to the top and you still have to walk. Only tour buses from travel agencies go to the top","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-04","dataVisitacao":"2022-12-01","comentario":"To do despite the crowds, 360 degree view of all of Rio. Small journey to get to the top, but it's worth it. The statue is majestic","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-03","dataVisitacao":"2023-11-01","comentario":"Worst tourist trap ever. Should have started reading poor reviews sooner. It's all there, the long queues, the constant hustling. Nobody gives you the whole information. You either take the train (get tickets online in advance) or then pay for being taken up to the entrabce, where another long queue might get you up if you wait 3 hours. We took a pic from the statue's behind and called it a day. Worst place to spend time in Rio.","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2023-11-03","dataVisitacao":"2023-10-01","comentario":"It was an amazing experience the atmosphere was spiritually intense I loved every moment of it! I love Rio de Janeiro ❤️","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-11-02","dataVisitacao":"2023-09-01","comentario":"Spectacular view of Guanabara Bay, Rodrigo de Freitas lagoon, Rio-Niterói bridge, Maracanã… good structure, unmissable!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-31","dataVisitacao":"2023-10-01","comentario":"It was rainy when we were there. We could not see the view over Rio, and the monument was not clearly visible yet still stunning. This is a must see in Rio.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-30","dataVisitacao":"2023-10-01","comentario":"How could the City of Rio allow the installations of Christ the Redeemer, the most visited monument in Latin America, to reach its current state??? There are two tiny bathrooms for all visitors, a lot of dirt and only one snack bar where you can buy food and drinks. A shame...","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-10-26","dataVisitacao":"2023-06-01","comentario":"One of the greatest moments of my life! You take the train up there and get to see so many things. Once you get up there its a whole experience. The views are incredible and the feeling is one you can not beat.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-26","dataVisitacao":"2023-10-01","comentario":"I booked the ticket from the website of the same train company. I didn't find any queue. Maybe because Sunday afternoon. The ride up with the train is very beautiful and you can admire the view of the city. The Christ I expected bigger. The view is spectacular. Visit to do","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-26","dataVisitacao":"2023-10-01","comentario":"2 options for getting on: the train or the van. We chose the van. We went there at the end of the day and during the week. So, no waiting and few people. It is a must-see in Rio with a breathtaking view of the entire bay.\nAn unforgettable moment.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-24","dataVisitacao":"2023-10-01","comentario":"Several possibilities to reach the statue. We chose the train. We arrived without a ticket on a weekday at 8:30am. There wasn't too much of a line yet, but we still had to wait almost 40 minutes to get on the train. If you arrive later, a skip-the-line ticket is required.\nArriving at the statue, everyone settles down so they can take a vacation selfie. The view is magical. To do but the wait can be long.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-10-22","dataVisitacao":"2023-10-01","comentario":"The app made purchasing tickets easier - which avoids queuing and you know the timetable for visiting. Easy location and easy to board and disembark when using cars via app. Expensive ticket, very expensive. It's a price made for foreigners to pay, which makes Brazilians avoid the tour - there could be a discount at this point.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-10-21","dataVisitacao":"2023-09-01","comentario":"The landscapes are incredible. How beautiful Rio de Janeiro is! Being close to the image of Christ is very cool, however, it is crowded. We went on a very sunny day during the week. Going up was easy, without queues, but when we arrived at the place where the image is, it was very crowded. I imagine what it must be like on weekends, impassable and with hours of waiting to get up. Taking photos without other people appearing, just juggling. Regardless, it's a must-go place, but avoid weekends and holidays. If you have no option, be prepared to wait and when you get there to be in a crowded place.\n\nThere are two ways to go up: Train and Van. The first is a little more expensive. By van, which is made by people accredited by the City Hall, you have the option of stopping at Mirante da Dona Marta. We went by van and the view from the viewpoint is amazing too. In addition to this advantage, there are fewer people than Cristo, as those taking the train cannot stop at the Mirante. The stopping time is quick, 15 minutes. I suggest dedicating them entirely to the Mirante, as there is another view which is, if I'm not mistaken, from an old helipad. I asked the van driver and he said that the view from the viewpoint is prettier.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-10-19","dataVisitacao":"2023-10-01","comentario":"If it is cloudy, you can also consider the option of taking the tour offered at the Corcovado train station for R$100 where they take you to two other viewpoints apart from Christ.","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-10-16","dataVisitacao":"2023-06-01","comentario":"An unforgettable experience from this one of the most beautiful places on Earth. The sculpture of Christ is impressive. Beautiful view of the city and coast.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-15","dataVisitacao":"2023-10-01","comentario":"Located at the top of Corcovado Mountain, Christ the Redeemer is the best-known Brazilian icon in the world.\nIts view is spectacular, from the top you can literally see the city from above.\nHire a good tour operator and guarantee records to keep in your memory.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-11","dataVisitacao":"2023-07-01","comentario":"An unparalleled experience, perfect and organized guides.\nClean and comfortable transport. It's so good when we can count on someone who makes your dream come true.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-11","dataVisitacao":"2023-10-01","comentario":"It is a must-see in Rio, it is impressive to be up there, the great statue, the surroundings, the views of the city. The ideal is to go up on a clear day. There can be a lot of wind at this time.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-09","dataVisitacao":"2023-09-01","comentario":"Amazing locale. Took taxi and then ascended with the rail cars. Reached atop the mountain. what a view. We went early morning to beat the crowd. But was foggy and the statue was often covered by the cloud. Waited half an hour even with the light drizzle and we awere able to get a clear glimpse and were able to take some good pictures. Enjoyed the trip","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-06","dataVisitacao":"2023-10-01","comentario":"It exceeded all my expectations. The place is exceptional, it's worth every second up there. Highly recommended!!!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-10-05","dataVisitacao":"2023-07-01","comentario":"OK, so it has great views. That's really what I went for. Unfortunately, I went in the afternoon, when a bazillion other people were also there. Super cramped. Not enjoyable.\n\nNOTE: If you intend on taking the train to the top, make sure it's operating before you jump in a taxi to take you to the train station. I had this all planned - took a taxi, arrived right at opening time, hardly any line, only to find out.... the train had broken down. Was told it would be hours before it was fixed. Had I know this in advance, I could have saved the time and money it took me to take a taxi there from my hotel, and a taxi back to my hotel.\n\nAnyway, since my morning attempt failed, I came another day and was only able to come in the afternoon. Train station was PACKED. More or less chaotic. Employees do best they can to keep people in lines and keep things moving, but it's a slow process and there are just so many people. Train ride itself is OK. You don't really see much. My taxi driver advised not to get into one of the many vans the hawkers are trying to get you into; he insisted to take the train, which to my understanding is cheaper.\n\nAnother note: If going by train, be aware there is a line at the station for buying tickets, for collecting online tickets, and separate lines for getting on the train. IF YOU BOUGHT YOUR TICKETS ONLINE, there is a specific line you go to to collect your tickets! Don't stand in the line to BUY tickets! Just ask any employee standing around - the few I talked to were all helpful and pointed me to the right line.\n\nAlso know that there will be waiting in lines to get back DOWN via the train. There is some shade, so that helps. There are also shops to get a drink or snack at the top.\n\nDo yourself a favor, go right at opening time.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-10-01","dataVisitacao":"2023-09-01","comentario":"Absolutely amazing place not to be missed. The ride to the top is nice and easy by train, elevator and escalator!! Almost effortless","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-28","dataVisitacao":"2023-09-01","comentario":"There are five main ways to get there:\n\n1. Mountain railway\n\n2. Van (a shared car like a Hiace)\n\n3. Taxi\n\n4. Uber\n\n5. Walk or bike (I think this is not an option)\n\nWhatever the method, you go to Centro de Visitantes das Paineiras and then take a van to the top. I used Uber because I don't speak Portuguese (there is no traffic in the morning, so it's less than 30 minutes from Copacabana).\n\nThe day I visited was during a four-day holiday in Brazil, so even though I had a ticket for 7:30, it was very crowded.\n\nPlease note that the return trip from Centro de Visitantes das Paineiras is not possible. You cannot use the van just for the return trip, so if you are going by a method other than the van, I recommend that you plan your return trip as well.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-09-26","dataVisitacao":"2023-08-01","comentario":"Christ the Redeemer is even more beautiful than I imagined. We went up very early on a Tuesday and it was still crowded. We went with the little train and it goes through the middle of the Tijuca forest and it was very pleasant. The view from the top of the corcovado is simply sensational. Prefer to buy your souvenirs in stores before going up, as it is more expensive up there.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-25","dataVisitacao":"2023-09-01","comentario":"Place with unique and singular energy... negative point is the lack of organization of the enterprise, and be patient, lots of queues and lack of empathy!","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-09-24","dataVisitacao":"2023-09-01","comentario":"I visited the statue 22 years ago,  but is is still magical.   We were v lucky as the cloud cover  burnt off just before we got there at 3pm. Worth going in the afternoon for that reason.\n\nIt is crowded but an amazing experience","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-23","dataVisitacao":"2023-08-01","comentario":"The number one place to visit in rio.this place is truly breathtaking.This has always been in my bucketlist,100% worth it","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-16","dataVisitacao":"2023-09-01","comentario":"Top location is a very good environment to go with the family and take photos, whoever went always comes back, my family was enchanted by the view","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-15","dataVisitacao":"2022-10-01","comentario":"It is really important to climb the Christ... even if there are lines, waiting, etc. etc The scale of the work is impressive and the views (on a clear day) are also impressive.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-14","dataVisitacao":"2023-09-01","comentario":"Tour guide César, professional and kind. Keep being that 1000 guy! Thank you ❣️","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-12","dataVisitacao":"2023-09-01","comentario":"It was a perfect visit.\n\nWhat a fantastic experience to have the opportunity to see the city from the top and still experience the statue in all its splendor.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-12","dataVisitacao":"2023-09-01","comentario":"No trip to Rio would be complete without a visit to Christ the redeemer -It’s the icon of Rio.\nWe are staying in the Flamengo area and picked up the official bus from Largo do Machado near the fruit market. TBH ,it’s idiot proof ,you pick up the minibus, taken to the bottom base, put onto another minibus to the base of the building on which the statue is on, go up 2 escalators and bob’s your uncle, you are there. We were there for 9ish ( on a Tuesday ) it was busy but hardly any queuing or waiting.\nIt really is worth the trip and it matched my expectations with magnificent views of Rio and photos of Cristo.\nAfter 30 mins, back to the base to get on the minibus back to where we got it from- simples!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-12","dataVisitacao":"2023-09-01","comentario":"It's worth going at least once in your life. I went to Rio many times but I always refused to do the \"touristão\". No surprise really. Lots of people, but it's worth it. The view is fantastic. A tip, buy in advance if you are going by train. If you go by van, don't take the one that leaves the Paineiras Visitor Center, because on the way back, taking an Uber or taxi is chaotic. Prefer the Vans that leave from below, as the descent will already be guaranteed. We had to get off with the capacity, which is not official, as it is impossible to find your Uber there at the embarkation/disembarkation point.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-09-09","dataVisitacao":"2023-08-01","comentario":"It is not worth going to Rio and not going up to Corcovado, the Christ is impressive and the views of all of Rio are spectacular. Buy the ticket on the official train website, it includes the visit to Christ. You can buy even on the same day, but check available times. Although they recommend going on the first trip, it quickly fills up with people, there are 3 trains and the trip lasts 20 minutes, which is what you have if you want to take photos with some comfort. We went on the 2nd train, the 8 o'clock one (we had a ticket at 8.40 but we arrived earlier and were able to get on) and it was already packed, there were almost cakes for photos, but the Christ is so huge that you can take whatever you want. Upstairs there is space, but many people. Above all, choose a day with guaranteed sun, if it is cloudy you will not see anything. That is why the stay in Rio has to be 4-5 days to guarantee that someone will have full sun... and be able to fully enjoy the city. In good weather there is little wind up. When you get off to go to the return station you have 3 souvenir shops. Essential.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-08","dataVisitacao":"2023-07-01","comentario":"Wonderful\nBeautiful!! Perfect place for walks and bathing! Be careful to go with a guide; with water; appropriate clothing !\nStunning view to spend the day","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-07","dataVisitacao":"2023-08-01","comentario":"Extremely recommended is the climb to Christ the Redeemer, which seems to embrace Rio and all of Brazil in a commiserating gesture. Breathtaking view and glimpse of unlikely influencers going there with designer shoes and handbags for a post!","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-09-06","dataVisitacao":"2023-08-01","comentario":"ON a mountain summit,the statue is an emblem of Rio de Janeiro & indeed Brazil. It is a beautiful piece of work visited by many and a glorious view of Rio is seen from the summit. The day I visited there was christening ceremony in the little church.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-09-05","dataVisitacao":"2023-09-01","comentario":"Great experience, going up by train is very good (don't accept going up in a van), the view from the top is incredible, the organization of getting up and down is also a positive point","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-09-02","dataVisitacao":"2023-09-01","comentario":"We bought our tickets online without a problem then showed them on our phones. You don't need a paper copy like it says online. You queue to get into the little train station, they check your ticket once and give you a piece of paper, then you go up to the booth and they take the paper and give you a ticket. You queue again and are made to have a photo taken (which they encourage you to buy at the end), then get on the train. It takes around 20 minutes, the view up is pretty.\nWe got the first train up, the space at the top is small so it gets busy really quickly. I can't imagine what getting a later train is like. First train is at 7.40am (worth it!). The sun is already up but the views across Rio are breathtaking. The city is huge and you really get a feel for that when you are that high. The mountains in the background are the most beautiful part. The statue itself is cool but it is just a statue really. Lots of people queuing to take photos - get your snap outside the queue, then enjoy the view around you more importantly. \nTo go back down you just walk down the steps to the train platform (same one you got off) and just get back on. You need to show your ticket again. You don't need to prebook your return train, just get any one you like.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-31","dataVisitacao":"2023-08-01","comentario":"The place is very nice, just be careful with the scammers who ruin the experience, at the main entrance some supposed official agents stop, they have credentials and everything and they try to stop your car saying that you cannot get in by car and they even jump on you ( my advice is to move forward and not stop), these scammers will try to sell you the climb to Christ and the entrance at ridiculous prices, once up there be careful with the scammers 2 who try to sell you the entrance just steps from the official office at another absurd prices and They will offer parking service, for which they ask you 1,000 reais, something like $175,000, yes, for parking XD, you can negotiate with them but make sure you have that cash or lastly ask them for a machine and they will make the effort to get one, but I recommend cash since since they are scammers the machine is probably adulterated. I don't understand why the police don't monitor this.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-08-30","dataVisitacao":"2023-08-01","comentario":"An incredible experience with our guide WARLEY, very willing to listen to our questions and made our visit very entertaining. 100% recommended.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-28","dataVisitacao":"2023-08-01","comentario":"The view is very beautiful, not because of Christ the Redeemer, which, by the way, is not that big or that beautiful, but because of the image of Rio that you can see from Corcovado. Splendid. Tip: the earlier the better, don't expect to go after 10am and want it to be empty, get the earliest slot.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-26","dataVisitacao":"2023-08-01","comentario":"RIO DE JANEIRO - Every time I climb Corcovado I am surprised: more and more organized. If you want to go up by car, you can pay one of the guides (uniformed and accredited) who are on the way up to Cosme Velho (this makes parking easier), otherwise just go up on your own and park a little further away from the van point that takes you. leave at the feet of Christ. I advise not going during holidays or vacations, as there are always a lot of people.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-24","dataVisitacao":"2023-08-01","comentario":"Take the train/funicular if you can, really... Try to get your ticket at a time fixed in advance. Everything is included and you are sure to leave and arrive at the top at the scheduled time. Try to absolutely avoid vans, they promise you the same price and immediate departure, and nothing happens as planned: the price is more expensive, does not include entry to the site, each company has its van and they wait until they are full to go up as well as to come down... Some touts are real professionals in scams, beware. Another solution is to go up by public transport, a little walk to finish and a superb descent via the forest path to the beaches!","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-08-22","dataVisitacao":"2023-08-01","comentario":"Wonderful place!!! But get there early, as there are a lot of people and a long queue!!! Board the Corcovado train for a wonderful experience!!!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-20","dataVisitacao":"2023-08-01","comentario":"Unmissable in Rio but the crowd there spoils the pleasure, too bad. The view still remains unforgettable","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-08-20","dataVisitacao":"2023-02-01","comentario":"One of the first wonders of the world, beautiful but incredible, let's go back again, Rio de Janeiro, very beautiful, everything magical","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-19","dataVisitacao":"2023-08-01","comentario":"It is an unmissable place in Rio de Janeiro, without a doubt you have to visit it.\nI think it will depend on your luck if you find many people, although there are many people every day.\nYou must have patience and tolerance with so many people who want to monopolize everything for a good photo, many people forget about respect for others in order to get a photo their way; It can become exasperating to see wild attitudes from so many people.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-08-18","dataVisitacao":"2023-08-01","comentario":"I bought my ticket online, it was really easy. In this case, I ended up getting in even earlier than expected. It has a good structure for those with mobility difficulties and preference for seniors. The cafe is crowded. But it's always an incredible experience.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-17","dataVisitacao":"2023-08-01","comentario":"Being able to visit this world-renowned tourist spot with your family is priceless. It was the first of the day, we were lucky because the weather helped a lot, the sky was clear and cloudless.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-16","dataVisitacao":"2023-08-01","comentario":"If you visit Rio, you should definitely do this. The view of the city and the impressive statue (and the way it was made) will amaze you.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-15","dataVisitacao":"2023-07-01","comentario":"It really is an unforgettable tour. We went on a Monday in July, during the holiday period, extremely crowded, but it was as expected for the time... it was still worth it. Preferably visit on a sunny day, to admire the spectacular view.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-15","dataVisitacao":"2023-07-01","comentario":"More than 61,000 very good or excellent reviews, speaks volumes about this attraction!\n\nWe took a  half day guided tour that we’d arranged a week earlier. After visiting Sugarloaf mountain we arrived late morning in our minibus at the ticket office. We had a quick visit to the souvenir shop, bought some water and then ‘jumped the queue’ to take another minibus to the top. It’s supposed to be quicker and easier than taking the train. (and more comfortable with air con)\n\nI would not recommend walking as it’s a long steep and winding road which is busy with vehicles, plus the heat was unbearable!\n\nOnce we arrived at the top we had to walk up a lot of steps or use an escalator and a few steps. The plateau was very crowded, everyone looking for the angle to take photos.\n\nA great experience with fantastic views and highly recommended!\n\nMy top tip is to arrive as early as possible to avoid the queues especially if you’re not on a guided tour, unless you intend going for sunset!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-15","dataVisitacao":"2023-07-01","comentario":"The lading Top attraction in Rio.you will never go to Rio and miss this.be here very early to avoid the crowd.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-14","dataVisitacao":"2023-08-01","comentario":"For anyone traveling to Rio this is an obligatory stop. Located at the top of the Corcovado mountain, reachable either by a train or by car up to a certain point and then continuing with mini tourist buses. Once you reach the top you can admire the grandeur of the statue and the breathtaking view of the bay of Rio with the other mountain of Sugarloaf in front. I would say something extremely spectacular. On the back of the statue there is also a very small chapel, where they perform some ceremonies. Not to be missed","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-08-11","dataVisitacao":"2023-06-01","comentario":"The view from the top is incredible, also a unique landscape. Many people to meet, and also see the greatness of God.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-08","dataVisitacao":"2023-08-01","comentario":"Very beautiful view of the river. Too many people. Be careful that there is no cloud cover because otherwise the panoramic view will be lost. We go up by train. Very nice tour","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-08-08","dataVisitacao":"2023-06-01","comentario":"A magical moment when visiting Christ the Redeemer. Ticket price is expensive and half price is not accepted for students.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-07","dataVisitacao":"2023-08-01","comentario":"What a wonderful place!!! Feel the energy from afar, a beautiful, beautiful place, no wonder it is the 7th wonder of the world! If you go to RJ, you have to visit this place! But a tip: go early, it fills up quickly and if you can with a guide, take photos with it “empty”","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-07","dataVisitacao":"2023-08-01","comentario":"Classic tourist role in RJ for the first time, going up Corcovado, there is a trail to the left with the Dona Marta viewpoint which is surreal, I recommend going and then continuing up to Christ","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-08-04","dataVisitacao":"2023-07-01","comentario":"I think most people come here because it's the iconic Rio landmark.   It's worth the view and the train ride is quite nice.   It was very crowded on our visit, I hear it is almost always quite crowded though so that's just part of the experience.  \nThere is a train stop just below the summit that anyone is welcome to get on/off at.  This is a visitor center for Tijuca National Park (which you are in) and it has some nice displays on the nature in the area if you have a little extra time.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-03","dataVisitacao":"2023-07-01","comentario":"Fantastic, they give a discou
