<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Avaliações</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #687386;
      --border: #dfe5ef;
      --cristo: #eb4a74;
      --bondinho: #3cbab6;
      --shadow: 0 10px 30px rgba(23,32,51,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 32px auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 38px); }
    .subtitle { margin: 0; color: var(--muted); }
    .filter-box {
      min-width: 220px;
    }
    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font-size: 15px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .metric, .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .metric { padding: 20px; }
    .metric span { color: var(--muted); font-size: 14px; }
    .metric strong { display: block; font-size: 30px; margin-top: 7px; }
    .panel { padding: 22px; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0; font-size: 20px; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .chart-wrap { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 700px; height: 400px; display: block; }
    .axis-label { fill: var(--muted); font-size: 12px; }
    .grid-line { stroke: #e8edf4; stroke-width: 1; }
    .line-cristo { fill: none; stroke: var(--cristo); stroke-width: 3; }
    .line-bondinho { fill: none; stroke: var(--bondinho); stroke-width: 3; }
    .point-cristo { fill: var(--cristo); }
    .point-bondinho { fill: var(--bondinho); }
    .empty {
      padding: 50px 20px;
      color: var(--muted);
      text-align: center;
    }
    .note { margin-top: 12px; color: var(--muted); font-size: 13px; }
    @media (max-width: 720px) {
      .metrics { grid-template-columns: 1fr; }
      .container { width: min(100% - 20px, 1180px); margin-top: 20px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>Dashboard de avaliações</h1>
        <p class="subtitle">Evolução mensal da quantidade de comentários publicados.</p>
      </div>
      <div class="filter-box">
        <label for="attractionFilter">Visualizar atração</label>
        <select id="attractionFilter">
          <option value="Ambos">Cristo e Bondinho</option>
          <option value="Cristo">Cristo Redentor</option>
          <option value="Bondinho">Bondinho</option>
        </select>
      </div>
    </header>

    <section class="metrics">
      <div class="metric">
        <span>Total de avaliações</span>
        <strong id="totalReviews">0</strong>
      </div>
      <div class="metric">
        <span>Mês com mais avaliações</span>
        <strong id="peakMonth">—</strong>
      </div>
      <div class="metric">
        <span>Quantidade no pico</span>
        <strong id="peakValue">0</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Avaliações por mês</h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 1000 400" role="img" aria-label="Gráfico de avaliações mensais"></svg>
      </div>
      <p class="note">O gráfico utiliza a coluna “Data de publicação”. Meses sem avaliações aparecem com valor zero.</p>
    </section>
  </main>

  <script>
    const reviews = [{"atracao":"Bondinho","dataPublicacao":"2026-07-11","dataVisitacao":"2026-07-01","comentario":"Local de fácil acesso. Bem organizado. Ambientes limpos. Refeição variada. Beleza indescritível. Natureza exuberante","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-07-15","dataVisitacao":"2026-07-02","comentario":"Experiência incrível. Vistas maravilhosas. O ideal é tentar ir num dia claro. Reserve antes, pois fica muito cheio de turistas. A maioria são estrangeiros. No inverno, leve um casaco leve, pois venta bastante lá em cima.","companhia":"-","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-07-16","dataVisitacao":"2026-07-03","comentario":"What a wonderful experience. From the moment you get your ticket the whole experience is professionally organised. The views are amazing.The first stop gives you access to a beautiful eating and viewing area. Lots of choice in food and drink. Plenty of places to sit in shade or the glorious sunshine. Second stop, the top is fabulous as well. Lots of room to take photos. Highly recommend.","companhia":"Amigos","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-07-19","dataVisitacao":"2026-07-04","comentario":"Fomos com guia, super recomendo rjcomjulio, para acompanhar vocês em sua experiência, fomos no horário do pôr do sol, o horário mais requisitado para realizar as visitas e ter uma vista inexplicável!\nIngresso custa 160 reais inteira\nMeia 100 reais","companhia":"-","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-07-21","dataVisitacao":"2026-07-05","comentario":"Foi com certeza a pior experiência turística que já vivi. Comprei antecipadamente, atrasou mais de 2h do meu horário, completa desorganização na fila, quando subi já era noite. A fila para subir no segundo trecho e estava absurda e a de volta mais absurda ainda. Fiquei “presa” com meu filho esperando pra voltar no bondinho lotado e escuro. Foi péssimo, não recomendo pra ninguém esse programa.","companhia":"-","pontuacao":1},{"atracao":"Bondinho","dataPublicacao":"2026-07-21","dataVisitacao":"2026-07-06","comentario":"Horrível. Filas gigantescas, desorganização. Mais de 1h30min de espera para cada trecho, mesmo com a compra antecipada de ingresso. O turista não é palhaço.","companhia":"-","pontuacao":1},{"atracao":"Bondinho","dataPublicacao":"2026-01-01","dataVisitacao":"2026-01-01","comentario":"Esta é a pior atração turística que já estive. As linhas são loucamente longas, como acima de 1. 5 horas cada caminho. Se você planeja passar uma tarde ou uma noite inteira lá, talvez valha a pena, mas fique na fila por 1 : 30 pm se você quiser um tiro no pôr do sol e planejar para o passeio para baixo para ser mais longo do que o passeio para cima. Se eu pudesse dar isso zero estrelas, eu faria.","companhia":"Solo","pontuacao":1},{"atracao":"Bondinho","dataPublicacao":"2026-01-02","dataVisitacao":"2026-01-01","comentario":"A pior experiência turística que tive na minha vida. Ficamos presos em um pesadelo de linhas intermináveis por cinco horas sem nenhuma maneira de interromper a experiência. O site sugere que os ingressos são limitados, mas na verdade eles vendem centenas de mais do que têm capacidade. Ele dá um novo significado ao termo armadilha turística... uma vez que você começa a subir nas gondolas você está literalmente preso por horas.\n\nEsperamos na fila para 1. 5 horas para subir a primeira montanha (esta teria sido a hora de abortar, mas não sabíamos quanto pior seria). No topo da primeira montanha esperamos mais 45 minutos para chegar à segunda montanha. Uma hora para voltar ao primeiro e outro 1 . 5 horas para voltar ao chão. O gelo sobre o bolo começou a chover, então estávamos imersos esperando nessas linhas. Imagino que bater o sol seria tão mau. Se você está visitando em temporada turística pesada, faça-se um favor e admire isso da praia com uma caipirinha em vez disso.","companhia":"Casal","pontuacao":1},{"atracao":"Bondinho","dataPublicacao":"2026-01-03","dataVisitacao":"2026-01-01","comentario":"Isso definitivamente não valia a pena. A vista no topo era agradável, mas não vale 200 r. As linhas eram extremamente longas, uma vez que a empresa vende muitos bilhetes. Essa experiência levou todo o dia por causa disso. Eu não recomendaria fazer a montanha do pão de açúcar - talvez o passe rápido é melhor? Mas é mais caro e eu já pensei que o gasto para o bilhete comum não valia a pena. Alimentos e bebidas no topo são caros","companhia":"Amigos","pontuacao":1},{"atracao":"Bondinho","dataPublicacao":"2026-01-06","dataVisitacao":"2026-01-01","comentario":"não vale a pena pelo valor. talvez a meia entrada valha mais. passeio para ir apenas uma vez na vida. equipe bem simpatica e cordial.","companhia":"Não informado","pontuacao":3},{"atracao":"Bondinho","dataPublicacao":"2026-01-10","dataVisitacao":"2026-01-01","comentario":"Não ouça os livros de guias que dizem que isso é uma obrigação - faça experiência!\n\nEsta foi uma das piores atrações turísticas que já visitei, e inteiramente por causa da logística e organização. Eles admitem muita gente em relação à capacidade dos elevadores de gônda. Embora a vista fosse agradável, não valia o tempo e o estresse da experiência. Tivemos uma experiência muito melhor ao ver Cristo o Redentor e sugeriria que você faça isso em vez disso.","companhia":"Casal","pontuacao":1},{"atracao":"Bondinho","dataPublicacao":"2026-01-13","dataVisitacao":"2026-01-01","comentario":"Passeio imperdível para quem vai ao Rio de Janeiro. Fácil acesso e beleza incomum. Toda a vista do Morro da Urca ou do Pão de Açúcar vale cada centavo do ticket. A subida leva 2 minutos apenas (cada trecho) e é tudo muito bem organizado. Vai lá conferir. A vista é de 400 metros sobre o nível do mar.","companhia":"Casal","pontuacao":3},{"atracao":"Bondinho","dataPublicacao":"2026-01-14","dataVisitacao":"2026-01-01","comentario":"Experiência extremamente decepcionante!\nO Rio é lindo naturalmente, a vista é sensacional, mas as enormes filas, superlotação, calor, falta de informação e organização deixaram muito a desejar. E detalhe que não é por falta de mão de obra ou funcionários, mas pela má vontade das pessoas que estão trabalhando em\nAjudar, dar informações ou simplesmente tenta ajudar. Já na entrada a perguntar onde era a entrada, já que tinham duas filas, já tive uma má e debochada resposta falando que o bilhete era na bilheteria.\nSou carioca, fui com minha mãe que tem\nDificuldade de locomoção e pra ela conseguir usar os elevadores foi uma luta, tendo que ver os funcionários fazerem carinha de deboche ou nem liberarem o elevador. Teve uma determinada hora que ficou aguardando e tocando a campanhia por um tempo e depois de uma espera cansativa, acabou desistindo e subindo de escada e ao passar em frente da porta do elevador já na saída, o tal funcionário que deveria ter aberto estava jogando no celular e disse que não ouviu ela apertar o botão. Debruçado na cadeira estava, debruçado continuou.\nSe passamos raiva e tumulto sendo brasileiras, fico me perguntando o sufoco que os gringos passam. Não recomendo pra ninguém!","companhia":"Não informado","pontuacao":2},{"atracao":"Bondinho","dataPublicacao":"2026-01-15","dataVisitacao":"2026-01-01","comentario":"O passeio em si foi muito proveitoso. O local é realmente muito lindo e, apesar da superlotação, estava razoavelmente organizado. Porém, ao final do passeio, fui pagar pelas fotos que tiramos ao chegar e tive meu cartão clonado. Por sorte, temos proteção e conseguimos agir rapidamente. Fiquem atentos!!","companhia":"Não informado","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-01-18","dataVisitacao":"2026-01-01","comentario":"Com tantas opiniões, há muito pouco a dizer! Fomos logo após a pausa de Natal às cerca de 9 . 30 horas. A fila durou talvez 10 minutos. Eu me reuni alguns dias antes de ter sido 2 horas! Escolha seu tempo com cuidado. É um belo, mas curto passeio de cabo (s) para o topo e as vistas são tudo o que você espera. Nós adoramos e absolutamente não deve ser perdido se você (como nós) é um visitante de primeira vez no Rio","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-01-28","dataVisitacao":"2026-01-01","comentario":"É um espetáculo a parar e contemplar, um por do sol digno de um quadro, com muita acessibilidade. É pode subir por trilha também.","companhia":"Não informado","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-02-05","dataVisitacao":"2026-02-01","comentario":"Um dos melhores pontos turísticos do RJ lindo por natureza é uma experiência única, tudo perfeito vistas impagáveis e um ótimo atendimento pelos staffs.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-02-12","dataVisitacao":"2026-02-01","comentario":"A visita é uma grande visita da tarde. Certifique-se de ir em um dia claro e ficar o mais tarde possível. Desfrute de uma bebida ou sorvete dos vários bares para absorver as vistas em torno de todos os pontos de vista. Comprar os cartões, muito difícil de olhar e tirar fotos enquanto você viaja nos carros.","companhia":"Amigos","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-02-12","dataVisitacao":"2026-02-01","comentario":"Encontramos um set de DJ do pôr-do-sol e foi uma agradável surpresa! Também tivemos que se abrigar no local sob cobertura no pico da montanha Sugar Loaf devido ao risco de relâmpagos. Felizmente, havia vendedores ao lado do abrigo vendendo sorvete, hot dogs e cerveja. A linha para baixar foi bastante longa.","companhia":"Amigos","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-02-21","dataVisitacao":"2026-02-01","comentario":"Belas montanhas e vistas ainda melhores no topo de Sugarloaf em direção ao Rio e no outro lado do Oceano Atlântico vistas. Rio parece muito melhor do topo. Carros de cabo são muito lotados em torno de 64 pessoas para um carro. Claro que certos países sempre pressionam para chegar à frente. Muito para ver em ambas as estações e lojas de boa qualidade e lojas de comida. Recomendo vivamente visitar aqui enquanto estiver em Rio. As opiniões sozinhas valem a pena","companhia":"Não informado","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-03-05","dataVisitacao":"2026-03-01","comentario":"Toda a operação foi suave. As vistas são fantásticas. As oportunidades de comer e beber ou fazer compras não eram particularmente atraentes. A água potável é importante e abundante.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-03-08","dataVisitacao":"2026-01-01","comentario":"Enquanto conseguimos escapar das multidões em Cristo Redentor pegar o primeiro trem da manhã (leia essa revisão), aqui estávamos preparados para esperar na fila.\nA propósito, escolhemos a hora mais popular antes do pôr do sol para capturar tanto a vista de dia quanto de noite. Eu sugiro comprar seus bilhetes com antecedência no site oficial para garantir o tempo desejado, bem como para economizar tempo no balcão esperando na fila.\nEsperamos um pouco mais de uma hora em uma enorme linha na frente e dentro da estação inferior.\nHá dois teleféricos para chegar à montanha mais alta de Sugarloaf. Vista de ambos, Morro Urca colina e Pao Azucar são mente soprando e espetacular.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-03-12","dataVisitacao":"2026-03-01","comentario":"Nós tivemos pre-reservado e o dia em que chegamos foi muito chuvoso e nublado. Não houve possibilidade de reembolso ou mudança de horário e fomos forçados a ir em um dia onde havia visibilidade zero. Obviamente, o clima não é controlável, mas reembolsos ou mudança de horário devem ser uma opção para estes dias.","companhia":"Casal","pontuacao":1},{"atracao":"Bondinho","dataPublicacao":"2026-03-13","dataVisitacao":"2026-03-01","comentario":"É muito turístico, mas eu não poderia resistir a fazê-lo. A vista da parte superior é absolutamente deslumbrante. Ir cedo durante o dia para bater a multidão.","companhia":"Amigos","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-03-17","dataVisitacao":"2026-03-01","comentario":"Muito tranquilo e bela vista. Comprei os ingressos pelo site oficial do bondinho. É recomendado para evitar filas pra comprar no local.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-03-21","dataVisitacao":"2026-02-01","comentario":"A pista para descer da montanha foi o inferno, estávamos literalmente agarrados de forma desorganizada por mais de 1 hora à espera de descer. Certifique-se de que o resto do seu horário é claro quando visitar.","companhia":"Amigos","pontuacao":3},{"atracao":"Bondinho","dataPublicacao":"2026-03-22","dataVisitacao":"2026-01-01","comentario":"O Bondinho do Pão de Açúcar é uma das experiências mais fantásticas para se fazer no Rio. Mesmo com o céu meio nublado dá para curtir bastante.\nAchei bem organizado, os atendentes são super simpáticos e o parque é bem limpo.\nDá para negociar o valor das fotos impressas no final. Achei uma boa lembrancinha.\nO único \"problema\" é que os valores dos restaurantes lá em cima são realmente para turistas estrangeiros. Para quem é da própria cidade, não vale tanto a pena assim.\nPara quem tem medo de altura é um bom teste kkk a subida entre os morros é bem rápida (menos de 5 minutos).","companhia":"Não informado","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-04-02","dataVisitacao":"2026-04-01","comentario":"Visitei o Bondinho do Pão de Açúcar recentemente e, apesar de achar o valor do ingresso um pouco elevado, a experiência compensa — e muito.\n\nFui com uma amiga e, desde o início, tudo é muito bem organizado, seguro e com uma estrutura excelente. O trajeto do bondinho é simplesmente encantador, com vistas panorâmicas de tirar o fôlego da cidade do Rio de Janeiro.\n\nLá em cima, o visual é ainda mais impressionante… um dos cartões-postais mais bonitos do Brasil, sem dúvida. É aquele tipo de passeio que marca, perfeito para quem quer viver algo especial ou registrar momentos inesquecíveis.\n\nNo geral, mesmo com o preço mais alto, entendo por que é tão bem avaliado: é uma experiência única, bem cuidada e que vale a pena pelo que entrega.\n\nRecomendo!","companhia":"Amigos","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-04-03","dataVisitacao":"2026-03-01","comentario":"Eu sou realmente ruim com as alturas, mas sabendo que eu estava indo para o Rio eu realmente não queria perder em visitar a Montanha do Açúcar (ou Cristo o Redentor). Visitei esta página de revisão várias vezes colocando \"alturas\" como uma pesquisa na esperança de obter algum conforto de outros com o mesmo problema, mas os resultados foram mistos.\nEu sabia que a pior parte seria o passeio de teleférico, mas isso não foi muito ruim - todos se apressam para garantir um lugar nos lados para as melhores vistas, então isso deixa os espaços do centro bastante fáceis de garantir, então foi apenas uma questão de cabeça para baixo para o passeio de 2 minutos.\nUma vez no topo da montanha, (bem, meio caminho) foi maravilhoso, há muitos restaurantes e lojas e as vistas são fantásticas. Não tenha medo de ir para as bordas, que é geralmente o pior, como não há gotas puras, então, novamente, nenhum problema.\nEu tive um pequeno balanço voltando para o teleférico para descer como você tem que ficar em uma pequena plataforma para subir, mas passou muito rápido. Conduzir até mesmo tomou um lugar em um dos lados e gostou da vista.\nVocê realmente não deve perder isso e, acredite em mim, se eu posso fazer isso, você também pode.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-04-03","dataVisitacao":"2026-04-01","comentario":"Sobre a vista panorâmica do Rio de Janeiro, acredito ser a única parte que faça valer alguma menção positiva sobre o passeio.\n\nMas a logística de ingresso aos “bondinhos” é simplesmente terrível.\n\nNão é respeitado o intervalo escolhido na compra dos ingressos (comprei para 15-16h, cheguei 15h e só consegui acessar o bondinho 17:20, após 2h20 min de fila).\n\nApós o 1º morro, para acessar o Pão de Açúcar propriamente dito, outra fila enorme que me desmotivou e me fez optar por não subir ao outro nível, uma vez que já estava escuro e com a visibilidade prejudicada.\n\nDecidi descer, e adivinha? Outra fila. E lá se foi + 1 hora de espera.\n\nSaldo final: 3h20 de fila para menos de 1h de atração incompleta.\n\nDeixo aqui um conselho que pode solucionar o problema: Limitar a venda de ingresso/bilhete. Funcionários já estavam impacientes / exaustos pelo alto fluxo de visitantes, visitantes já estressados pela experiência prejudicada pela demora - caos total.\n\nObs.: Existe uma opção de acesso rápido pelo dobro de preço… então já sabe né? A demora na fila pelo visto já não é mais encarada como um problema, e sim uma conveniência para vender a mesma vaga por um valor mais alto…","companhia":"Não informado","pontuacao":2},{"atracao":"Bondinho","dataPublicacao":"2026-04-04","dataVisitacao":"2026-04-01","comentario":"Ah, ir no bondinho é sempre um bom passeio, embora o melhor tempo é ir sem ser feriado, pois não lota tanto, mas afinal estamos falando de um ponto turístico reconhecido mundialmente.\nUm passeio lindo, ao ar livre, com belíssimas paisagens e a atração do passeio no bondinho. Tudo é muito lindo de se curtir.\nEntretanto, o comércio cresceu muito por lá, onde antes era apenas natureza, hj tem um espaço para exploração comercial, muitos quiosques, comércio de sorvetes e lanches. Enfim, espaço tem para todos, ainda bem!","companhia":"Não informado","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-04-05","dataVisitacao":"2026-04-01","comentario":"Ingresso p subir no bondinho as 10h Estava lotado , fila no sol, apareceram uns guarda chuvas do local p proteção do sol quando estávamos a mais de 45 minutos embaixo de um sol escaldante . Conseguimos entrar no bondinho mesmo c horário marcado e bilhete comprado on line mais de 1h e 15 min depois.\nMorro da Urca com lojinhas, restaurantes e banheiros e do\nPão de Açúcar com menos opções .Vista bonita mas o perrengue da fila não foi legal .","companhia":"Não informado","pontuacao":3},{"atracao":"Bondinho","dataPublicacao":"2026-04-11","dataVisitacao":"2026-03-01","comentario":"Experiência surreal! O conjunto dos morros da Urca e do Pão de Açúcar é simplesmente magnífico, um dos pontos turísticos indispensáveis no Rio. A vista lá de cima é única: o encontro do mar com as montanhas, a Baía de Guanabara, as praias ao longe e aquele ventinho gostoso, especialmente no pôr do sol, quando o céu fica incrível. O Morro da Urca é perfeito para curtir com calma, caminhando pelos caminhos, observando a vegetação e tirando fotos tranquilas, enquanto o Pão de Açúcar eleva tudo a outro nível.\n\nDica importante: compre o ingresso do bondinho com antecedência pelo site, no primeiro horário, para evitar filas gigantescas na bilheteria, a infraestrutura é ótima, com espaço para fotos, lojas e alimentação. Mas prepare-se para os preços: tudo é tabelado bem alto, quase como aeroporto, o que dificulta para quem é assalariado brasileiro aproveitar ao máximo (água e lanches são caros demais). Ainda assim, a beleza do lugar compensa, é um cenário dos mais bonitos do Brasil, vale cada centavo e merece ser revisitado","companhia":"Casal","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-04-17","dataVisitacao":"2026-03-01","comentario":"Visitamos o Sugar Loaf como parte de um passeio organizado. Este é um lugar icônico para visitar no Rio de Janeiro. O passeio, em dois teleféricos, é rápido e você é recompensado com vistas deslumbrantes sobre a cidade e o oceano do topo. O topo era muito vento. No ponto de meio caminho há mais com lojas, micro-bar e restaurante. Nós também vimos Black Tufted Marmosets que são nativos do Brasil.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-04-17","dataVisitacao":"2026-04-01","comentario":"Uma ótima opção de passeio ao visitar o Rio. Bem organizado e acessível, o bondinho proporciona ótimas vistas de várias regiões e pontos famosos da cidade, além de contar com diversas opções de alimentação. Recomendo experimentar o crepe. Também é interessante ir pouco antes do almoço, pois costuma ficar mais vazio. É uma visita que vale a pena, porém o custo total pode ser alto.","companhia":"Amigos","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-04-21","dataVisitacao":"2026-04-01","comentario":"A vista é deslumbrante, sugiro ir no meio para o fim da tarde, pois daí consegue acompanhar o pôr do sol e o anoitecer. De lamentável apenas as filas imensas, assim como no Corcovado. Se quiser e puder desembolsar mais dinheiro, vale a pena comprar o ingresso mais caro, que dá direito a não enfrentar filas. Se tiver que optar entre ele e o Corcovado, vá ao Pão de Açúcar e não vai se arrepender.","companhia":"Não informado","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-04-23","dataVisitacao":"2026-04-01","comentario":"Isso foi legal , as crianças realmente liliam a experiência .","companhia":"Família","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-04-23","dataVisitacao":"2026-04-01","comentario":"Era um lugar maravilhoso, agora está tomado de barracas de vendas de tudo, parece feira. Atrapalha os visitantes que precisam se expremer para ver a vista","companhia":"Não informado","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-04-26","dataVisitacao":"2026-04-01","comentario":"As opiniões são excepcionais. A espera é longa mesmo com a reserva antecipada via on-line porque há muitas pessoas algumas até mesmo comprando os bilhetes lá. É organizado, mas se move lentamente. Uma vez que você chegar à primeira parada você deve caminhar até 5 minutos para obter o outro teleférico onde você espera novamente. Tenha muita paciência e água. Se você quiser ver o pôr do sol lá, reserve seu bilhete para as 15h para estar no topo até às 17h. Esteja preparado para noites de vento se você estiver lá depois das 19h. Não é o melhor para carrinhos, uma vez que alguns caminhos são estreitos. O pessoal foi amigável e comunicou claramente.","companhia":"Não informado","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-04-28","dataVisitacao":"2026-04-01","comentario":"Há muitos anos que não ia ao Pão de Açúcar e foi uma grata supresa! O ingresso, que terá que apresentar várias vezes, dá direito a várias atrações. Tudo muito organizado. Vistas maravilhosas 👏🏽!No entanto, no quesito acessibilidade o parque precisa melhorar: elevadores não funcionaram no dia do passeio e várias escadas sem a sinalização definida por lei. Sou deficiente visual (visão monocular) e tive dificuldade em vários momentos. Atenção, Gestão do Pão de Açúcar cumpra a Lei","companhia":"Não informado","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-04-29","dataVisitacao":"2025-06-01","comentario":"Fui ao Bondinho do Pão de Açúcar no e achei a experiência incrível! A paisagem é simplesmente maravilhosa, deslumbrante mesmo, uma vista que parece até irreal de tão bonita. Fui durante a semana e estava bem tranquilo, com pouca fila.\nComo ponto de melhoria, achei a entrada um pouco confusa, com aquele “vai pra lá, vem pra cá”, mesmo com pouca gente. Além disso, tomei café da manhã lá em cima e o restaurante estava com poucas opções (por conta de um evento na noite anterior), faltando itens básicos como ovo. Banheiros muito limpos e tudo bem organizado.\nMesmo tendo medo de altura, me senti segura no bondinho.\nNo geral, é um passeio lindo, que vale muito a pena. Eu amei a experiência!","companhia":"Não informado","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-05-08","dataVisitacao":"2026-05-01","comentario":"Excelente experiência. Devido à época do ano o tempo não era quente e a multidão baixa. Tive bastante tempo para relaxar e tirar algumas fotos maravilhosas.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-05-12","dataVisitacao":"2026-05-01","comentario":"Grandes pontos turísticos e passagem rápida permite que você passe a linha. Você deve imprimir o voucher e trazê-lo para a recepção. A recepção irá fornecê-lo com uma faixa laranja, em seguida, você continuará para cima, onde eles fornecem água e ele contorna todas as multidões. Nota: a cultura respeita os idosos e a comunidade envelhecida. Dito isto, os idosos e os deficientes são sempre prioritários. No geral uma grande experiência altamente recomendo.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-05-17","dataVisitacao":"2026-05-01","comentario":"Nós reservamos nossos bilhetes no site oficial. Eu recomendo reservar um slot 1. 5 horas antes do pôr do sol, já que esse é o melhor momento para visitar. Eu também recomendo reservar um passe rápido, é um pouco mais caro, mas pode fazer uma enorme diferença indo para cima e especialmente para baixo após o pôr do sol. Na primeira parada às vezes há um DJ em torno do pôr do sol, mas a melhor vista é da parte superior.","companhia":"Amigos","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-05-24","dataVisitacao":"2026-05-01","comentario":"A vista é impecável, principalmente pq peguei a volta bem no pôr do sol, mas a fila é gigantesca mesmo, se prepare pra ficar talvez 40 minutos pra só um dos bondinhos (são 4 deles)","companhia":"Não informado","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-06-06","dataVisitacao":"2026-06-01","comentario":"Definitivamente vale a pena ter a fila como é super ocupado, você não precisa imprimir seu bilhete apenas tê-lo em seu telefone ir para a faixa de prioridade e o scan o código de barras no quiosque.","companhia":"Não informado","pontuacao":4},{"atracao":"Bondinho","dataPublicacao":"2026-06-15","dataVisitacao":"2026-06-01","comentario":"Que experiência incrível, super recomendo.","companhia":"Casal","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-06-19","dataVisitacao":"2026-06-01","comentario":"A minha experiência foi muito boa avaliação que eu dou para vocês é sem palavras foi muito bom maravilhoso vocês estão de parabéns equipe pelo passeio adorei voltarei mais vezes","companhia":"Solo","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-06-28","dataVisitacao":"2026-06-01","comentario":"Tendo participado recentemente de um casamento no Sugar Loaf Barn, posso dizer com confiança que é um dos melhores locais que já experimentei como hóspede. O charme rústico cria um ambiente instantaneamente quente e romântico, perfeitamente complementado pela paisagem circundante espetacular. Além do belo layout, o staff realmente roubou o show. Eles foram excepcionalmente educados, incansáveis e atentos, fazendo com que todos os hóspedes se sintam genuinamente cuidadosos durante toda a noite. Foi uma celebração impecável, e eu não posso recomendar este local altamente o suficiente.","companhia":"Amigos","pontuacao":5},{"atracao":"Bondinho","dataPublicacao":"2026-07-20","dataVisitacao":"2026-04-01","comentario":"Adorei a experiência de conhecer o Bondinho do Pão de Açúcar. A vista é espetacular e o passeio proporciona uma das paisagens mais bonitas do Rio de Janeiro. Fui no mês de abril e as filas estavam bem longas, por isso recomendo se programar com antecedência, principalmente se quiser aproveitar o pôr do sol, que deixa o visual ainda mais incrível.","companhia":"Solo","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-07-22","dataVisitacao":"2026-07-01","comentario":"Asistí un miércoles. Fuimos de los primeros en subir. Contrate un guía turístico y logramos unas fotos increíbles sin gente que opacara las mismas!!\nSi eres turista te recomendaría esta opción por !","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-07-19","dataVisitacao":"2026-07-01","comentario":"Tour to take pictures and take a breath, very well organized, but a place crowded with visitors almost no space to take pictures. \nThere is no half entry for teachers from other states, nor with the national teaching portfolio.\nWhole R$ 87 \nHalf R$ 60\nFor Brazilians.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-07-19","dataVisitacao":"2026-05-01","comentario":"Christ the Redeemer - a wonder of the world!\nImpressive, iconic, beloved!\nThe Holy Guardian of Rio and all of us!","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-07-16","dataVisitacao":"2026-07-01","comentario":"So sorry to say this experience  was very disappointing.  The statues its self is beautiful  and majestic, city views magnificent.  But the amount of people pushing to get their shot, aggressively telling people to get out of their shot, made it a rather sad experience. \nTrain ride down was great","companhia":"FRIENDS","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2026-07-15","dataVisitacao":"2026-07-01","comentario":"Amazing experience. Sensational views of the city. You can take a van or train. The train is more tourist and is already a walk. Ideally, try going on a clear day to get better photos. In winter, it usually winds a lot. Reserve before, as it gets quite full.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-07-13","dataVisitacao":"2026-07-01","comentario":"I went with a family and they loved the view! The best experience is to take the train leaving Cosme Velho.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-07-12","dataVisitacao":"2026-07-01","comentario":"It has its beauty through the challenges and the architecture of Jesus. A work of 1931, idealized since 1859 with commencement of execution in 1922. However, no organization to get to the monument and no proper infrastructure","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-07-10","dataVisitacao":"2026-04-01","comentario":"I loved meeting Christ the Redeemer. In addition to the monument's imposition, the view from above is simply spectacular, with one of the most beautiful landscapes in Rio de Janeiro. I visited the venue in April and it was quite crowded, which is expected for one of the Seven Wonders of the Modern World. Even with the big movement, the experience is very worth it and is an unforgettable tour for those who visit the city.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-07-05","dataVisitacao":"2026-07-01","comentario":"One of the 7 new wonders of the world. If you come to Rio you have to visit it","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-07-05","dataVisitacao":"2026-04-01","comentario":"We had a very ugly day. But the experience was fantastic. It is indescribable","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-07-04","dataVisitacao":"2026-07-01","comentario":"Nice but crowded, impossible to take a nice photo because people are pushing each other..","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2026-06-28","dataVisitacao":"2026-06-01","comentario":"Major attraction in Rio. Must see a sculptor on a tall hill. Access is through a tram nearby.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-06-28","dataVisitacao":"2026-02-01","comentario":"An essential unique experience on a trip to Rio de Janeiro","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-06-27","dataVisitacao":"2026-06-01","comentario":"Perfect place! too worth the visit","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-06-27","dataVisitacao":"2026-02-01","comentario":"The Christ the Redeemer Sanctuary, a UNESCO World Heritage Site. The monument, located 710 meters above sea level atop Corcovado Mountain in Rio de Janeiro, offers breathtaking views of the marvelous city. More than just a tourist attraction, Christ the Redeemer, always with open arms, is a space of faith, culture, and solidarity.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-06-25","dataVisitacao":"2026-06-01","comentario":"The best part was that we had a great time; we had a bad day, but we managed to take some photos. We bought the Christ package from an agency called Tours RJ, and the guide Simone was fantastic.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-06-19","dataVisitacao":"2026-06-01","comentario":"One of the worst experiences of my life, and I have had quite a few.\nA sea of people, chaos in the line for the train, no one speaks a language other than Portuguese (at least in these places, there should be a minimum of linguistic support).\nI would not do this again even if they paid me; I do not understand all these positive reviews.","companhia":"SOLO","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2026-06-11","dataVisitacao":"2026-04-01","comentario":"Must-see site in Rio, with a breathtaking view of the bay, but it is incredibly crowded even in the morning at opening! The site is worth seeing. Be careful of the fake touts that can be found on the way up.","companhia":"FRIENDS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2026-06-10","dataVisitacao":"2026-05-01","comentario":"This company that sells the rickets to Christ is not serious at all. Bought on line , was there on time but there was a technical issue and could not do the visit. Then to reimburse they ask for 10 working days , more than this passed and no reimburse. They ask to resend email, what I already did 3 times , and so far no reimbursement . Be careful with these guys , they are not serious","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2026-05-31","dataVisitacao":"2026-05-01","comentario":"100% worth going. We were lucky there were no queues, we went straight to the top, took photos and were back out within 40 mins. We were on a tight schedule and this was perfect amount of time to walk around and see the views. 4pm on a Wednesday. Bit cloudy but still worth it.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-05-31","dataVisitacao":"2025-12-01","comentario":"A unique experience, I went for the second time.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-05-28","dataVisitacao":"2026-05-01","comentario":"Wonderful place, even crowded you are admired and complement immersed in the beauty of the place, from the view, to the impeccable monument, of course... wonderful.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-05-24","dataVisitacao":"2026-05-01","comentario":"Very time-consuming and disorganized. Funcionarios are not to blame.\nWhoever coordinates or commands should ask for demission. I don't know why there's a scheduled time when buying tickets if it's a lot of people. So check the entrance. I don't know what the mystery is. Three hours in a row takes the beauty of any monument. Brazil being Brazil. Bad demonstration of who we are to the gringos.","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2026-05-23","dataVisitacao":"2026-05-01","comentario":"Una de las 7 maravillas del mundo que sí o sí hay que visitar.\n100% recomendable ir con los boletos listos, para evitar filas.\nRecomiendo comprarlos con anticipación.\nHay mucha gente arriba, solo tener paciencia.\n\n————\n\nOne of the 7 Wonders of the World that you absolutely have to visit.\n100% recommended to arrive with your tickets already purchased to avoid the lines.\nI recommend buying them in advance.\nThere are a lot of people at the top, so just be patient.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-05-23","dataVisitacao":"2026-05-01","comentario":"The Corcovado train through the Tijuca forest is already an experience in itself, but reaching the top and finding that statue — with Rio at your feet and the sky around you — leaves you speechless. Go as early as possible in the morning and book the train online in advance. One of the most exciting places I have ever visited.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-05-18","dataVisitacao":"2026-05-01","comentario":"You can't visit Rio and not visit the Cristo Redentor. Although it is very popular and can get very busy you can still enjoy it. I would highly recommend booking the train ticket online and aim for the early slots (8:00). That way you can enjoy it before it gets too crowded and you don't have to wait too long in line for the train. Also try to go on a clear day to enjoy the views all the way to the Sugarloaf mountain.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-05-14","dataVisitacao":"2026-05-01","comentario":"Impossible place. Wonderful view, amazing! Below the Christ there is a chapel in which it is possible to stay silent and escape the crowd of tourists. Extremely kind and attentive staff, we were with a chair. The rating is not the maximum because they allow exchangers, who say they are official and authorized, to approach invasively trying to sell a value much above the box office. Another point is the question of parking that should also have on site, or nearby, even if charged. In my understanding, such a special place, which is among the 7 wonders of the world could not have these kinds of problems.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-05-13","dataVisitacao":"2026-05-01","comentario":"Very, very poorly organized for taking the train. They give you a time slot for the train and the result is a 2.5-hour delay…\nI have never seen such an ineffective organization…!!!","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2026-05-10","dataVisitacao":"2026-05-01","comentario":"Beautiful panoramic view of Rio! Unfailing ience itself is much less pleasant. If you go by train, there is no quick access even with older adults, the line to take it is endless, it takes almost 2 hours to take the train even though we buy the ticket the day before for a schedule (they do not respect the purchased schedule). That we were on a Wednesday of the offseason, I imagine a day with more influx, terrible.\nUpstairs spaces are tight for the number of people there are and there are not as many services when compared to Sugar Loaf. \nDisappointing.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2026-04-16","dataVisitacao":"2026-04-01","comentario":"Amazing views. Great service with the bus ride and entry ticket. \nObviously, very touristic, but worth it.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-04-12","dataVisitacao":"2026-01-01","comentario":"The Christ the Redeemer is one of the most breathtaking landmarks I’ve ever seen. Standing high on top of Corcovado Mountain, it seems to embrace the entire city with its outstretched arms, creating a powerful sense of peace and grandeur.\n\nThe statue itself is truly impressive in scale and presence. Visible from almost anywhere in Rio de Janeiro, it has become a true symbol of Brazil. Once you reach the top, you’re rewarded with a stunning panoramic view of the city, the ocean, and the famous beaches — the scenery is absolutely unforgettable.\n\nWhat makes the experience even more special is the deeper meaning behind the monument. It represents faith, protection, and unity, and you can genuinely feel a unique atmosphere when standing there. Despite the number of visitors, there’s a surprising sense of calm.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-04-09","dataVisitacao":"2026-04-01","comentario":"Seeing the Redeemer Christ from close was exciting. Feel that wind and see all of Rio de Janeiro from above. What a city!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-04-06","dataVisitacao":"2026-04-01","comentario":"As it was a holiday fds we went at 7am and was already quite full but not crowded. Organization of the place amazing, staff speak Portuguese, English and Spanish, bathroom at the station where takes the train p the Corcovado was very clean, has\nSome souvenir shops.  Just\nFoot of Christ a lot of people but could take pictures peacefully. There is a small snack bar where the nail monkeys are waiting for unsightly tourists to steal food left on the table or in careless hands.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-04-04","dataVisitacao":"2026-04-01","comentario":"My pilgrimage to Christ the Redeemer began with a spiritual test: an interminable queue, punctuated by vendors offering miniature concrete Jesuses at prices that required their own act of faith. The bus ride up — if you could call it a ride rather than a controlled crash with scenic detours — left my stomach somewhere around hairpin four. Once at the summit, I discovered the crowd was less interested in the Son of God than in achieving the perfect outstretched-arms photo in front of him. Whether this counts as worship is a theological question I leave to others. The statue itself is, admittedly, very large. But so was the queue, and nobody's building a Wonder of the World about that.","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2026-04-01","dataVisitacao":"2026-03-01","comentario":"I'm really bad with heights but knowing I was going to Rio I really didn't want to miss out on visiting Christ The Redeemer (or Sugarloaf Mountain). I visited this review page several times putting \"heights\" in as a search hoping to get some comfort from others with the same problem but the results were mixed.\nMy experience was that the train ride itself wasn't a problem, I just had a slight wobble getting from the train to the main platform. I managed it by just putting my head down, looking at the path and steps and following the crowd.\nOnce on the platform it wasn't a problem due to the amount of people around. Even at the edges, which is usually the worse, there is not a sheer drop so, again, no problem.\nAfter a short time I felt relaxed and got quite a few great photos though not by going as far back as I could like the rest of the crowd but by standing right under the statue.\nOn the return to the train I didn't feel as bad though still kept my head down and followed the crowd as before.\nBelieve me, If I can do it then you can too.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-03-30","dataVisitacao":"2026-03-01","comentario":"Imposing, although the number of people there made it very difficult to enjoy. Access for older people and 12 years is R 87.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2026-03-28","dataVisitacao":"2026-03-01","comentario":"Due to the uncontrolled number of people on site, the experience can be a nightmare. Everything is beautiful, but you need courtesy and patience.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-03-26","dataVisitacao":"2026-03-01","comentario":"Despite the organisation being quite poor with getting people up to the statue this is obviously a must do in Rio. The queues were crazy but i remained patient as this was a bucket list thing i had to do. Yes it's busy but are you really expecting it not to be?","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-03-24","dataVisitacao":"2026-03-01","comentario":"The statue and the view from the top is amazing - definitely worth 5 stars. Unfortunately there is construction happening at the moment and it appears the company responsible for the statue and these works doesn’t value their staff enough to provide proper protective equipment for them, even when doing jack hammering. I think this is unacceptable in this day and age.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-03-22","dataVisitacao":"2026-03-01","comentario":"Beautiful! Don't forget to get your tickets at least the day before! It was cloudy when we were there, but wait for a little bit and it will clear. Don't forget to peek at the church in the base. The train is pretty fast.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-03-19","dataVisitacao":"2026-03-01","comentario":"Christ the Redeemer is located on Corcovado mountain and accessible via train or bus.  I checked the live footage on YouTube before arriving to make sure the visibility would be clear.  It looked promising at the time, so I decided to go.  I took an Uber to the location, which cost around £3, and arrived at approximately 3pm.\n\nOutside the entrance, there were a few bus drivers telling people that the train would not arrive for two hours and offering bus rides instead.  This seemed like a straight up hustle, so I ignored it and went straight  inside to buy a ticket. The ticket cost around £20 return. The train actually runs every 20 minutes and carries about 134 people, so there was no need to take an alternative.\n\nThe train journey took about 15 minutes and goes up around 3800 metres, with a few short stops to allow other trains to pass. As you go up, it gets cooler, and when you look down, visibility can already be quite misty.\n\nNB No issues with taking the train. I had an effortless entrance once inside the designated area. No tour was used and travelled solo. I used the self-service ticket machine and got the train immediately.  Totally time from entering to arriving at the top was 20 minutes.\n\nWhen I arrived near at the top, there were some works going on, possibly repairs or new facilities, so there was quite a bit of dust around in certain areas.  No protective covering around the area of works. \n\nAlso, there are escalators and lifts available, so make sure you do not take the stairs unnecessarily.\n\nOne important tip is to check the live camera before you go.  Even if the weather forecast says clear skies, conditions change quickly.  While I was there, the view kept going in and out due to mist and fog. You would get a clear view for maybe 10 seconds at a time before it disappeared again.\n\nBe prepared when you reach the main platform for the 100s of people attempting to take the perfect picture.\n\nThere are places to eat and drink at the top, with drinks costing around £3 - £5 and meals around £7.  There were also a few gift shops and an option to have photos taken by professional photographers.  The toilets were clean and a small chapel (or something similar)\n before you reach the main platform.\n\nI stayed for about three hours in total, and it does get quite cold later in the afternoon, so I would recommend bringing a light covering if you plan to stay into the early evening.\n\nI left at around 6pm. The journey down felt longer than going up, but I never queued for very long. There’ was one stop for a visitors centre.\n\nOverall, the experience was okay, but the visibility was very disappointing. The mist kept coming in and out constantly, and there were only brief seconds where you could see anything clearly. I never got a proper full view, just quick glimpses for a second or two. If you are hoping for a clear panoramic view, make sure conditions are truly stable before going.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-03-13","dataVisitacao":"2026-03-01","comentario":"We arrived at 7am and already a lot of people. the view is very beautiful and taking pictures is difficult considering the world","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-03-12","dataVisitacao":"2026-02-01","comentario":"Considering it was a dream to see one of the 7 wonders of the world, I confess that the disorganization left me disappointed. The place was extremely crowded and out  - it was almost impassable with thousands of people around.\nWe finished our visit around 10 AM and when descending that huge waiting line snake was packed with people stretching out on the street.\nSo, to do yourself a favor get up early and be there at 7 AM.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-03-05","dataVisitacao":"2026-03-01","comentario":"We chose to get the train to the top. We were not on a tour so had to cue for a long time. The ride was good and safe. The crowds at the top were huge and we came away after about 20 mins. The views were great but we had cloud and wind and rain too. The cue to get down was less of a problem. We ended up taking the whole day in getting there and back to Copacabana. If there is a next time I will take a tour.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-03-05","dataVisitacao":"2026-03-01","comentario":"Amazing view, more infrastructure leaves to be desired, 3 small elevators and only one works, and lack of technology use printed tickets yet, deserves an investment in improvements.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2026-02-27","dataVisitacao":"2026-02-01","comentario":"Be careful when visiting Cristo Redentor. There are scammers around the area trying to overcharge tourists for tickets and transportation. Some people approached us offering “official tickets,” but the prices were much higher than normal. Management should improve security and protect visitors from this situation.","companhia":"SOLO","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2026-02-24","dataVisitacao":"2026-02-01","comentario":"It was already pretty crowded at 07:20. The first pedestals with the stairs are still ok, but directly at the Christ statue only Poser. The men lie flat on the floor for the best shot, the women posing. You walk into someone's picture all the time. The whole thing is embarrassing and ridiculous at the same Sugarloaf Mountain, and the vibrant neighborhoods that make the city so iconic. It’s a place where nature and culture blend seamlessly, making it feel less like a tourist stop and more like a moment of connection with the city itself.\n\nWhat makes Christ the Redeemer especially meaningful on an international level is its symbolism. Recognized as one of the New Seven Wonders of the World, it represents faith, openness, and unity—values that transcend nationality. Visitors from all over the globe gather here, creating a shared experience that reflects Brazil’s warmth and hospitality.\n\nTips for visiting:\nGo early in the morning or near sunset to avoid crowds and enjoy softer light.\n\nCheck the weather—clear skies make a huge difference for the views.\nTake time to walk around the platform; each angle offers a different perspective of Rio.\n\nOverall, Christ the Redeemer is more than a landmark—it’s a powerful cultural and emotional experience that captures the spirit of Brazil while holding universal significance.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-02-21","dataVisitacao":"2026-02-01","comentario":"Visiting Christ the Redeemer was truly an amazing experience. Even during peak hours, everything was very well organized and efficient — we didn’t have to wait long to go up or come back down, which made the visit smooth and enjoyable.\n\nAnd the views? Simply breathtaking. The panoramic sights over Rio are next level — ocean, mountains, and city all in one spectacular frame.\n\nThis is a must-visit landmark. Iconic, beautiful, and unforgettable. Highly recommend!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-02-20","dataVisitacao":"2025-03-01","comentario":"The iconic statue of Jesus the Redeemer in Rio de Janeiro. Located on a hill in the outskirts of Rio. \nTo get there, take a bus from below to the sculpture area.\nWe went there in the evening, it was so hot. There's a lot of tourists there, in a relatively small area that's so crowded. It's hard to take a good photo because there's a lot of visitors. Maybe once in the morning or when the city wants to close, there are not many visitors. \nThe statue itself may have been spectacular in its time, but now there are many similar statues in other cities around the world of almost the same size. \nThe view from the sculpture area is not as good as the sugarloaf mountain. But it feels less afdol to be in Rio de Janeiro not to this place.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-02-19","dataVisitacao":"2026-01-01","comentario":"Unmissable place when you visit Rio, it is certainly an ironic place that you should visit when you are in Rio, but you should remember to go comfortable and that good hydration, you should be patient because you have to do several lines to reach the Christ. \n\nOnce you are up in the Christ take advantage and get some good ones with patience since many people go up, I recommend you leave early and with time.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-02-12","dataVisitacao":"2026-02-01","comentario":"Visiting Christ the Redeemer is undoubtedly a beautiful and unforgettable experience. The view is impressive, the monument is exciting and very well represents the grandiosity of Rio de Janeiro.\n\nHowever, something that greatly damaged the experience was the large amount of people approaching visitors freely to offer services or “facilities”, often charging values far above the fair. As a Brazilian, I was able to identify the situation and avoid this type of approach, but it became clear that many foreigners end up being easy targets for not knowing the prices or the dynamics of the place.\n\nI believe there should be a more rigorous monitoring and better organization of these activities to protect visitors and ensure that everyone can enjoy the tour with peace of mind, without worrying about possible abusive practices. One of the most important postcards in the country deserves a structure at the level of the experience it provides.","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2026-02-12","dataVisitacao":"2025-12-01","comentario":"access to the bondinho is time-consuming, it needs to improve even in receptivity to tourists and cariocas who attend it. There up there people are left with little guidance and the price is an asslate of everything that is sold there.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-02-04","dataVisitacao":"2026-02-01","comentario":"Must-see places. Not to be missed views of the bay. As always, too many people. I recommend buying your train ticket online in order to simplify everything.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-31","dataVisitacao":"2026-01-01","comentario":"The scammers ruined the experience. We arrived in an Uber and two people told us they were official agents. They asked us for 620 reais to enter. They also swindled a family. They're in plot with the people at the entrance. We were able to recover 400 reais thanks to someone who intervened. To get down was also a problem xq asked us 150 reais. They told us that Uber doesn't go up there and it got dark and we wouldn't be able to get down. The wifi signal goes out and they wouldn't give us the signal from them. Apparently all organized so you're disconnected. It was a horror experience. The authorities are doing nothing to prevent this.","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2026-01-30","dataVisitacao":"2026-01-01","comentario":"This was my last wonder of the world. I needed to check off the list and its simply average. How can you compare this to the great wall of china or Petra or even the Taj??  It was crazy busy, hot and mad people being fools. Nah, I wouldn't recommend this at all. Lol I wasn't even going to try to get a picture myself, just took one of christ.","companhia":"FRIENDS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2026-01-28","dataVisitacao":"2026-01-01","comentario":"This visiting Rio, the Christ cannot be missed in the script.  I recommend going at the first hour.  The photos look great.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-26","dataVisitacao":"2026-01-01","comentario":"A must see stop when in Brazil, however extremely confusing to get to if you’re traveling outside of a tour group, and don’t speak Portuguese. I speak Portuguese, and it was still a tricky and unorganized process \n\nYou can get up by purchasing van tickets, or the train ticket.\n\nRe van:\nAlthough there are many “official” van companies selling tickets from the bottom, they can charge any cost they like. They will charge tourists more - so just remember you can barter to a more reasonable price. Make sure you check whether the ticket you buy is the ONLY ticket you need, and guarantee you don’t need to pay again to come down \nYou need to change vans half way, and there are people there telling you you need to buy another ticket for the next van - you do not need to!!!! Ignore them and make your way inside the building for support to get to the next van","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2026-01-23","dataVisitacao":"2026-01-01","comentario":"Amazing trip despite heavy rain on Christ the Redeemer\nBy the time we reached Sugar loaf mountain weather cleared\nPeter the guide was brilliant and made our trip\nHumour and knowledge very good; would not hesitate to recomend to others\nPaul the driver also very good\nWell done allround\nDenis &  Sue","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-22","dataVisitacao":"2026-01-01","comentario":"It is, indeed, a miracle, but you have to have the patience and energy of a tourist. \n\nExpensive, queues, difficult access and extremely crowded. \n\nTip: never, I said JAMAIS, buy a combo ticket with AquaRio (Group Cataract). They sell van tickets, but do not inform that the exit is in the middle of the mountain, where it is almost impossible to access (Vans charge 80 per person and apps ask for value outside to climb half the mountain). \n\nBuy directly on the Corcovado train that still has the train ride or make sure your van departs from some point in the city of EMBAIXO and not from the “visitor center”\n\nPlus, a pride.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-21","dataVisitacao":"2026-01-01","comentario":"Really disappointing experience. Despite going early to avoid crowds, it was still VERY crowded. \n\nIt was an absolute circus of people crammed onto a small plaza, all trying to get the best shots for their social media, posing for ages, most of them oblivious to the pushing and shoving of people just trying to navigate the area.  Very unenjoyable.\n\nYes, the views were great, but they were as good - if not better from Sugarloaf Mountain.\n\nThe actual statue is far more impressive when viewed from a distance and to see how impressive it looks on top of the hill. Close up, it was rather ordinary - other than the size. But I've seen many, many great sculptures in my life.","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2026-01-18","dataVisitacao":"2026-01-01","comentario":"Nothing quite prepares you for the size of the statue, the views, nor the crowds! We went in the afternoon - about 4.30pm - when (apparently) the crowds had gone. To be fair, the wait for the bus ride to the top of the hill was very short. At the top, the crowds were vaguely ok. Everyone wants the same picture of course! The views are amazing. It was real “lump in the throat” stuff. Just tremendous to see it close up for real. We stopped for a beer (10 min queue) and for a sit-down. The wait for the bus down was 15/20 minutes. All in all, a special place to visit and see. Quite unmissable.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-14","dataVisitacao":"2026-01-01","comentario":"Fantastic. Booked tickets online for 8am. Arrived before 7.30am. Short line to exchange voucher for tickets. Short wait for train. Very helpful staff. Journey by train added to the experience rather than driving up in a van. Views at top are fabulous. In every direction. Monument outstanding- quite emotional actually! Saw a christening happening in the small chapel in the base of the statue which was a bonus. It got very busy after an hour or so but able to move around easily. Most people are respectful of others trying to take pics but there is always one or two who need the perfect insta post and are annoying. Professional photographers available at the top. Small cafe for drinks. Definitely worth getting up early missing breakfast and arriving ahead of the crowds. Just amazing.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-13","dataVisitacao":"2026-01-01","comentario":"The most beautiful tour of Rio de Janeiro. From the climb to the appreciation of the views of the neighborhoods and places of Rio de Janeiro and, finally, to contemplate the immense statue of Christ. Really a tour that is worth seeing and going back, as I did.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-12","dataVisitacao":"2026-01-01","comentario":"Christ the Redeemer in Rio de Janeiro is an experience that leaves you speechless: as soon as you get to the top of Corcovado, the view of the city, beaches and bay takes your breath away. The statue is imposing, majestic, and conveys a feeling of peace and grandeur that is difficult to describe. It is one of those places that must be seen at least once in a lifetime, not only for its symbolic importance, but also for the unique energy you breathe up there.\n\nA key tip: climb early in the morning or at sunset. These are the best times both for spectacular light and to avoid the very long lines, which during the rest of the day can become exhausting. Keep in mind that the train to get to the top is always super crowded and booking times are mandatory: if you arrive late you risk losing your shift. Plan ahead, stick to schedule and enjoy one of the most iconic and exciting views in the world.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-12","dataVisitacao":"2026-01-01","comentario":"We git a taxi and then got the bus up which cost 100rs . When we got off the bus we were told to go up a small hill to get pur tickets. We and others were approached by some guys stating its anther 70rs to go up by bus or 156rs by train. This is not true and you have paid to get on the second bus when you purchased your ticket\n This is a scam to get more money out of you. We paid it 280rs and when we got our tickets to go up was told to get on the free bus. I went back to the robbing guys and got our money back so dont be fooled.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2026-01-01","dataVisitacao":"2025-02-01","comentario":"The view is simply stunning, with an amazing panorama of the city, the beaches and the mountains. The structure for visitation is organized and the access works well, even with a large flow of tourists. It is a place that conveys peace, emotion and greatness, in addition to having a huge historical and cultural value. Worth every minute of the visit.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-12-30","dataVisitacao":"2025-01-01","comentario":"A classic carioca! Despite the large number of people and difficulty in getting to Christ, it is very worth it and the photos are amazing on the spot.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-12-29","dataVisitacao":"2025-12-01","comentario":"Wonderful Christ overlooking Rio De Janeiro l! The only flaw 50 :5},{"atracao":"Cristo","dataPublicacao":"2025-11-01","dataVisitacao":"2025-11-01","comentario":"We bought the ticket online and we didn’t need to do the line where everyone bought to revalidate it, for more than half an hour. We lost another tour because of them.","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2025-10-31","dataVisitacao":"2025-09-01","comentario":"To get to Christ the Redeemer most people take the small train. Get to the station early as possible as the queues are very busy. We arrived at 8:45 and it still took 45 minutes waiting before we got a train. Once at the top the crowds were horrendous with people pushing a shoving trying to get the best angle for their pictures. The views are amazing and it’s one of the new 7 wonders of the world ticked off the list.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-10-30","dataVisitacao":"2025-10-01","comentario":"is the most touristic and attractive place I saw, it is amazing, impressive, amazing views, I would come back a thousand times!","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-10-22","dataVisitacao":"2024-11-01","comentario":"Of my favorite wonders of the world. It was a very beautiful moment to be in that place. The view of the city and the small chapel they have under the Christ is everything. I had the moment to pray and thank God for everything. I arrived by Uber to the Cosme Velho train station. From there I hired a car so that he could take me and bring me to the entrance of Corcovado, which was where I bought my entrance ticket to see the Christ. Everything is excellent.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-10-20","dataVisitacao":"2025-07-01","comentario":"It's a place you should know if or if. We arrived and bought direct tickets. You climb a cable car upstairs it's awesome everything","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublica in the week) and walked the way to Christ. This is possible, even if many people think you have to stick to the \"exploiters\", because firstly the vel are too expensive, and secondly you can see the real life of the people on the hike there.\n\nOf course, it's also a tourist trap, but where doesn't it exist? You can skilfully get around it by not buying every crap or leaving everything to the others, because they just want your money. \n\nWe were there around 11 o'clock and didn't really have a big line in front of us. Since we paid in cash, which you should do, so you save yourself the online crap, where you only look in the tube on site anyway, because you just have to wait with the others, we could also take the next train up.\n\nSomething urgently needs to be done about the track, otherwise soon nothing will work, because the track systems are very ailing and there is much, much rust to be seen in the systems. We had the impression it was just being run down, but maintenance, it's not being run there.\n\nOnce at the top, you can either take the lift up, or use the stairs. I would like to see the number of people up there limited, because the mass of people, for the small space, is not really sufficient. Worst of all are the self-proclaimed \"influencers\" who get in the way all the time just to get the most optimal photo. That should be banned.\n\nWe were lucky and there was bright sunshine that day, so the view, and also the stature, could be photographed very well. Otherwise, there is not much to see up there, except Komerz of course, but who likes it.\n\nThe mass of people has put us off. The price with 128 real, was ok, and of course we also walked back to the hotel, because there are also nice routes which you can walk. Overall, a good conclusion, you have to take with you, but if you don't like crowds, you should try to avoid it.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-10-09","dataVisitacao":"2025-10-01","comentario":"Nothing against the staff, they are friendly, patient and explain very well. Waiting time is short and reasonable considering the large number of visitors. However, the heat inside the enclosure becomes unbearable, so it would be important to install air conditioning or at least fans to improve air circulation. The Christ the Redeemer is in excellent condition, with visible and careful maintenance. My only criticism is the lack of control over the number of people entering the viewpoint, as the tight space makes it difficult to walk, observe and take pictures quietly. Still, the view is wonderful and the experience is certainly worth it","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-10-07","dataVisitacao":"2025-09-01","comentario":"You see it from many angles from the city, everywhere, you have seen it in reports, movies, photos....but when you go up and you have it in front of you for the first time all the expectations you brought will be exceeded long and not only him, from there you can contemplate one of the best views you have ever seen in your life, strongly recommend visiting wonderful city with at least a week of margin and let yourself go by possibly one of the most beautiful cities in the world.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-10-06","dataVisitacao":"2025-08-01","comentario":"A must-do while in Rio, even battling the crowds at the top to get a picture in front of CTR and all of the tour guides trying to sit and get pics of all of their clients.  View from the top was good before it got cloudy, then it was minimal views as clouds passed.  But with the clouds the statue was still visible at the top and pics obtainable with a few tries.  Happy went, not being religious so we can check that off the bucket list.\n\nNice trip on the cog train to get to the top.  Don't Pay for the express ticket, it won't really benefit you much, and we made it through just as fast as those who
