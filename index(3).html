o","dataPublicacao":"2025-09-12","dataVisitacao":"2025-09-01","comentario":"The Christ without comments, the beauty of Rio unmatched. However, I bring ALERT, DO NOT buy the combination of Cristo and Acqua Rio. Shit, absurd, don't explain anything. The Uber takes you to the entrance of the park, the Van finishes the route to the foot of Christ. But, on the return or you submit to the scheme of the owners there, pay 20.00 per Cover to go down to the Cosme Velho or you pay for hours there, since the app taxi does not come up to pick you up, pq there is the owner. Abstract: Just go to Christ by train and get off by train. But those who buy the combo don't have that possibility. You have to pay outside.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-09-11","dataVisitacao":"2025-09-01","comentario":"Firstly I bought the tickets beforehand on TripAdvisor (skip the line ones). We planned to be there at 8 but due to sickness arrived 10:15am. Get an Uber (make sure you set app to Applepay beforehand -£5gbp) to Trem De Corcovado (entrance at the bottom). Plenty of friendly staff outside to direct you inside. As soon as staff see you have TripAdvisor skip line tickets you are taken straight to the front to get tickets exchanged for the voucher with the barcode. You are given wristbands to wear. Then you join a waiting area with others for the steep funicular train. Wait was 15-20 mins then you board, take a seat and up you go. At the top you can climb some stairs or take a lift if you have mobility problems. Not too many stairs. Yes there are toilets up there and places to eat/drink. Catch a glimpse of the monkeys. They seemed friendly and I saw someone feeding them. Then you get to the terrace and join everyone trying to get the perfect picture. Maybe 8am would have been better but we had no choice. Very crowded but amazing views all around. Be creative, get the perfect snap. There are officials there stopping people doing anything they shouldn’t. Take panoramic photos, selfies etc. don’t forget to soak it all in. Go around the back of the statue and you’ll see there is a small shrine inside with seat if you wish to pray. We spent 1.5hrs at the top before heading down again. 15-20 mins for training back down. Lots of people outside selling everything and you can use contactless everywhere. We bought a 2lt water bottle for $10BRL. Hope this review helps others.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-09-11","dataVisitacao":"2025-09-01","comentario":"It's splendid. It's seen almost anywhere in the age you're in. At night, they light it up.  Although there are days when it dawns cloudy and is covered with clouds, confirm warms the day, clears the view. I went twice: 1 time I got in a van and again I did it by train. Either one is worth the sights. There are souvenir shops that, contrary to what everyone would think, are not so expensive. It has bathrooms, escalators and elevator, so q people with difficulty moving can visit it. The views from above are breathtaking. Visit the chapel at the foot of the Christ and down the stairs there is another larger one. I went in September, if you visit after noon, the sun does not relent and sets behind the Christ, which makes it difficult to take photos because they come out in backlight, so at this time it is best to visit x the morning, when the sun gives you front. I am speechless before a Christ who welcomes with open arms his visitors and from on high protects his City ❤️","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-09-11","dataVisitacao":"2025-09-01","comentario":"This is an amazing monument, one of the seven wonders of the New World. \n\nI don’t know what is more impressive, the monument itself or the views of Rio de Janeiro from the monument  \n\nThe train ride up to the monument goes through a beautiful and lush rainforest  \n\nAbout 15-20 minutes to go up or down\n\nIt can get very busy up top by the monument\n\nIt’s recommended to avoid going on weekends or holidays if possible\n\nYou don’t need a tour guide for this and you can buy your tickets online before you go to make sure you get the time you want\n\nYou can also buy your tickets at the train station\n\nIt’s a quick Uber ride to the train station from any of the main beaches in Rio","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-09-10","dataVisitacao":"2025-08-01","comentario":"I'm not a believer, but this site has a few magical things! Okay, there are a lot of people, but go to Rio and don't go upstairs, it's like go to Paris and don't go see the Eiffel Tower!","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-09-09","dataVisitacao":"2025-08-01","comentario":"We went on a day with some clouds, which did not hinder our walk. We got up from Van, the place is very full of people fighting for a place to take the best photo. A tower of Babel with people speaking multiple languages, an experience! It has snack bars and gift shops. People who take your photo and then offer for a very high price!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-09-07","dataVisitacao":"2025-08-01","comentario":"The ride on the cog railway is well organized and makes the ascent pleasant. Once you get to the top, of course, there’s a lot of activity – the platform is full of people, and you have to fight for the space for photos a little. Nevertheless: The moment to stand there and enjoy the view over Rio is unique. Clearly a “don’t miss” for us.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-09-06","dataVisitacao":"2025-09-01","comentario":"One of the indispensable places to visit in Rio, my only consideration is the question of the photos they sell, I've been twice and I see that they always try to take advantage of the issue of buying the printed photos, they play a ridiculous price up t ces but this exceeded the expectations!!!!","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-07-07","dataVisitacao":"2025-07-01","comentario":"Being at the foot of Christ and contemplating His imposition is of great emotion.  Then enjoy the unparalleled view of the city.  Getting there by train, though more expensive, is unparalleled. Van transportation is another option, though without the same view and charm.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-07-02","dataVisitacao":"2025-07-01","comentario":"Look, the monument is interesting, but nothing special. The experience of getting on the train was good, and the view from the Christ towards the city is beautiful (better than seeing the Christ). The recommendation I would make is to go up early to avoid the crowds that don't even let you take a decent photo.\nIn conclusion, for me it is something worth seeing in Rio, since it is supposedly a wonder of the modern world, but it is nowhere near comparable to other wonders like Machu Picchu or the Roman Colosseum, which leave one pleasantly surprised. \nDon't forget what to wear on top of Corcovado, it's very windy.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-06-28","dataVisitacao":"2025-05-01","comentario":"The most amazing thing to do in Rio de janeiro.We bought our tickets before to avoid the  big line.Felt very blessed after the tour.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-06-24","dataVisitacao":"2025-06-01","comentario":"Going to Christ the Redeemer is feeling blessed by Him. Purchased the ticket before the site to not catch a queue and we went straight. Even outside our schedule we were able to enter and we waited in the queue, which went fast. The road climbs around 15 minutes through the Tijuca forest and when you get to the top, you can go by staircase or elevator. The view is beautiful, but there is a lot of people in included cost us 97.00 for 3 of us. Amazing experience would not miss but go early we got there at 9am and by 11 it was chocca block.  Do Not this experience","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-06-05","dataVisitacao":"2025-06-01","comentario":"Great place to visit with family and friends, perfect place to enjoy the sunset, and tbm to take great photos.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-06-01","dataVisitacao":"2025-06-01","comentario":"Nice view.\nBe careful with the puppets. They're turns.\nRise of a very fixed bond.\nVisit veryinteresting advice the visit and the park","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-06-01","dataVisitacao":"2025-06-01","comentario":"Going to Corcovado and visiting Christ the Redeemer is a must-see activity in Rio.\nIt is a very well maintained place, has access by vehicle to the entrance.\nThen it is possible to climb up to Christ either by walking as in elevators.\nThe picture is majestic and the place has a view of all of Rio de Janeiro.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-31","dataVisitacao":"2024-09-01","comentario":"Beautiful or a nice place rio de janeiro only a little careful with the guys over there are looking at you if you see them in a group because on the 1st day we were better scared to go out in a group","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-29","dataVisitacao":"2025-02-01","comentario":"This must-see is always very busy, it is not possible to photograph alone. Leaving aside the excess of visitors, the place is beautiful, you can climb by Van or Train, we choose the train, the 20 minute drive leaves you at the foot of Christ, there is a kind of terrace with beautiful views of the city, and the monument is imposing. As we descend we get off at the intermediate station to visit the exhibition or small nature museum, and souvenir shop.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-05-28","dataVisitacao":"2025-05-01","comentario":"Queuing up is never a favourite thing but forced queuing up, before the actual queue for the train to see Christ the Redeemer, so one's photograph can be commercially snapped in front of a photo of the statue, is crass to say the least!  The bossy, rude helpers of the photographer stood with arms out, preventing you from walking further, before you were coerced into submission.\nRio, you can do better than this, surely!?","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-05-28","dataVisitacao":"2025-05-01","comentario":"My experience. Payment by light and fast window was about 3:30pm and then immediate boarding by train too, Expedito without delay, reaching the top a spectacular and majestic view of the city of Rio de Janeiro in 360 degrees, it is worth it. A splendid viewpoint where urbanism and nature are appreciated on the other hand “Christ the Redeemer”; imposing reminding us of The Church, through this doctrine that legitimized the conquest of lands and the evangelization of indigenous peoples, justifying the occupation and imposition of Catholicism , in addition to mentioning in the world there are many representation. From Christ of different size the difference is the view here in the serro corcovado. It is privileged and therefore attractive to domestic and international tourism \nIt's worth vitiating.","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-05-27","dataVisitacao":"2025-05-01","comentario":"The surrounding views are amazing and rhe statue it self is out of this world, a bit busy, the train journey up the statue is fun aswell","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-24","dataVisitacao":"2025-05-01","comentario":"The views are enchanting and very easily accessible by a special train. Further elevators and escalators make it a super easy climb\nIt was great to reach early and see the huge statue.\nA small chapel sirsvundervthe statue..also we were happy to see a communion service  privately held in the chapel. \nA must visit attraction in Rio.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-23","dataVisitacao":"2025-05-01","comentario":"Loved the train ride up Corcovado, and of course photos were beautiful! Our group enjoyed the chapel at the base of the statue’s feet, make sure to check it out. :)","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-22","dataVisitacao":"2024-06-01","comentario":"Visit on 30/04/2023\nThe Redeemer Christ dismisses comments. The main postcard of Brazil, one of the seven wonders of the world. Sorry that on the day of my visit it was very foggy and I couldn't take good photos. I'll have to go again :)","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-20","dataVisitacao":"2025-05-01","comentario":"Yesterday I visited type 17:40 the Christ and we boarded the train and we were treated lousy as they had rented the place for photo shoots and demanded to get off soon after we had climbed. The employees' treatment of the worst place practically pushed us to get down quickly and let the boyfriend couple take their pictures. My question is why do they make people spend money if they won't let her enjoy herself? I paid to be there, nothing went free. I'll never go back and try to recommend that they do other excursions and not the one that throws away the silver to be treated lousy and especially the guy with very short hair who had a tattoo on his neck\n. They should give us the money back because they're scoundrels.\nIf you rent the place do not waste time and money people who also go with the illusion of taking photos and touring the place quietly. They should train their employees and teach them to communicate in Spanish as it is a touristic place.","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2025-05-16","dataVisitacao":"2025-05-01","comentario":"This is perhaps the most iconic tourist attraction in all of Brazil. If you are in Rio de Janeiro, visiting the world-famous statue of Christ the Redeemer atop the Corcovado Mountain is almost mandatory. The most popular—and perhaps the best—way to reach the summit is by taking the Corcovado Train, often referred to as a tram, which ascends the mountain through the lush and scenic Tijuca National Forest, the largest urban rainforest in the world.\n\nFor those looking for an alternative, a forest safari van also operates through the park, and for a more luxurious experience, helicopter tours offer an aerial view of the statue and the city below.\n\nWherever you are staying in Rio, getting to the tram boarding point at Corcovado Station is relatively easy. Tickets can be bought on-site, or you can skip the counter if purchased online—just show them and join the boarding queue. Be prepared for a wait of at least 30 minutes, as the lines are usually long.\n\nOnce at the top, the panoramic view is breathtaking—you’ll get a bird’s-eye view of the entire city of Rio de Janeiro, including Sugarloaf Mountain, Copacabana Beach, and the sprawling urban landscape.\n\nWhile the return journey also involves standing in line for about 30 minutes, the overall experience, though a bit tiring, is unforgettable. Visiting Christ the Redeemer is truly a must-do if you're in Rio.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-05-15","dataVisitacao":"2025-05-01","comentario":"Mandatory point for tourists from all over the world.\nEvery Brazilian should know.\nTake binoculars ...the view is beautiful and looking at the texture of the statue with binoculars is much better....","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-13","dataVisitacao":"2025-05-01","comentario":"Fantastic, the natural beauty of Rio de Janeiro is incredible and to be able to admire there from above at the feet of the Christ is a monumental experience, while contemplating the landscape has also its moment of faith and feeling closer to God, which marvels! It is all very organized, you can buy online and pick up the van that leaves from 3 points in the city, I picked up at Plaza Lido in Copacabana because it was closer to where I was staying, the only negative point was that it took an hour to leave and to get there about another 35 minutes but nothing that spoiled the visit. Everything there is well organized, there is a coffee shop with views and a super structured store right at the entrance, prices above as every tourist place but all of great quality, at the entrance take a photo of you and you can purchase at the end of the tour, negotiate the value to not pay so expensive. Go early because it's too crowded, you'll have more chances of taking a photo with more space and without so much people.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-11","dataVisitacao":"2025-04-01","comentario":"The view is beautiful very well worth it, the place is small it becomes difficult to take pictures the day I went was not crowded so was more quiet there is a very beautiful chapel inside, I believe that in very crowded days it is very uncomfortable I went in April","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-10","dataVisitacao":"2025-05-01","comentario":"We only had our tickets, but there are ATMs to the left of the ATMs that only take cash.\nGood organization, train frequency is correct\nPrefer the right side up to get 'view of Rio\nUpstairs a lot of people but the place is amazing","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-09","dataVisitacao":"2025-05-01","comentario":"We bought the tickets online and went in the morning, during the week, there was not much movement and we managed to enjoy well, saved in memory","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-06","dataVisitacao":"2025-01-01","comentario":"Speaking of sightseeing in Rio de Janeiro, take the mountain train to the top of Corcovado Hill at an altitude of 710 m and look up at the giant statue of Christ, 8 m high on a pedestal and 30 m high with its arms outstretched\nThis statue of Christ has been chosen as one of the New Seven Wonders of the World, and from the top you will be able to see the city of Rio de Janeiro from the top, as well as the beautiful views of Rio Niterói Bridge and Pont de Azúcar","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-05-04","dataVisitacao":"2025-04-01","comentario":"A must-see for those who go to Rio de Janeiro. In addition to being an icon of the city, the Christ Redemptor offers spectacular views from different points of Rio, allowing you to better understand the dynamics of the city. I recommend visitors to arrive well early. The spaces are crowded and good photos are difficult.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-29","dataVisitacao":"2024-05-01","comentario":"The train ride was one of the most pleasant parts of the tour — beautiful landscapes and quiet climate. But coming up there, the Christ was extremely crowded, which ended up damaging the experience considerably. I couldn't take any good photos of myself, and I ended up regretting not having hired a photographer (even though I found the value very high at first, then I saw that maybe it was worth it). The view is beautiful, yes, but that's all... a lot of heat depending on the season and always a lot of people. It was nice to meet, but it wasn't my favorite ride in Rio.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-04-28","dataVisitacao":"2024-06-01","comentario":"This place is perfect. It is a tour that one cannot fail to do by visiting Rio. We went well and it wasn't so full. We got a little fog, but in a few minutes the sky has cleared (so be patient). The view tbm is perfect","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-28","dataVisitacao":"2025-04-01","comentario":"I'm visiting for the second time this year. It is really imposing the monument and you can see all of Rio from up there.\nLuckily this time I have a nice clear day so I could enjoy the views of the city, so choose well the time of day in which to climb.\nThe best way to climb is through train, it is a nice walk and also during the journey you have very good views.\nArm yourself well with patience as it is always full of people! especially in high season.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-27","dataVisitacao":"2025-04-01","comentario":"This is how corruption affects day to day people.\n\nI got to Christ The Redeemer without a ticket,hoping to buy one at the Ticket office.\nHere's where the problems started.\nNow you can't tell who is official and who is working for a private firm.\nThey charged me 100 Brazilian Real to take me to the middle stage,where you buy tickets for Christ the Redeemer. He initially asked for 120 \nTip.....Just tell your Uber to take you there direct from your location,it's much cheaper and avoids paying these thieves who are taking advantage of people.\nOr just wait for the train to take you up.\nThey scare you by saying it's going to take 2 hours......Rubbish,all lies. Just wait for the train or Uber it.\n\nWhen I got to the 2nd stage where the ticket office was I was met by another thief who said that the Queues are 4 hours long and that he will take me up there with a van including entrance for 585 Real.\nUnbelievable.\n\nI Queued up for a ticket including the van for 85 Reals.\nIt is a headache,you can't fathom what's going on and everything seems to be pretty disorganised. Oh yeah,not many people speak decent English.\n\nHere's the corruption bit,some high up official is on the take from these thieves masquerading as official agents or private companies. They can quite easily get rid of them but they're wandering around as if they own the place.\nSecond part. You're at one of the most iconic tourist sites in the world dealing with people of all Nationalities and nobody speaks English....or very basic English.\nWho did they pay to get these jobs or who do they know. ???\n\nAnyway.....Rant over.\nKeep your wits about you. Go through official channels. Don't be scared off by the Thieves saying its going to be a 2 of 4 hour wait.\n\nYou will have a fantastic time.\nChrist The Redeemer is worth the wait and inconvenience","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-24","dataVisitacao":"2025-04-01","comentario":"It is one of those things that you have to do if you have a chance. That is probably one of the top 10 views in the world. Remeber to bring your patience because the line to go up, whether y ou take a van or the train, will be long and, sometimes, a little confusing but the view and photos you'll get are tottaly worth it.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-04-24","dataVisitacao":"2025-04-01","comentario":"Amazing! It is breath taking and the views of rio are just wonderful. It’s quite crowded, but the place is organized. We went on the train at it was beautiful, although a recommendation is to stay at the right side, so you can see the views","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-22","dataVisitacao":"2025-04-01","comentario":"Beautiful the Christ, Beautiful the view, everything is cute. A lot of people, you have to choose the time. Impossible to take the perfect photo. Wear light footwear as some stairs will have to go up.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-21","dataVisitacao":"2025-04-01","comentario":"I had a very frustrating experience visiting Christ last Saturday, so I want to leave a few tips on what I learned from the stressful experience. Being in Christ itself, is a fantastic experience, beautiful place that is worth visiting, as long as you are lucky to catch a beautiful and clear day. Otherwise, it would have been a waste of money and time as well. Now be aware of the purchase of the ticket!! The best way to get there is by train from Corcovado, where you take the train in the visitor centre and calmly climb to the Christ. This is also the safest and most economical way. Very careful because when looking for tickets on the site of Christ, because the site will direct you to purchase the ticket with the vans and not with the train. Here's the stick. You will buy the ticket and from there, you have to pay separately for the vans!! In my case I was forced to pay more 80 Reais per person to be able to get up from the Van, that is, my ticket cost 164,00 Reais, much more expensive than the train and still having to stop at a point where you have to pick up another huge queue to then pick up another official Van of the Christ and continue to climb. With the train you go straight from beginning to end. In fact, when I bought the ticket through the website of Paineras Corcovado, I understood that the boarding was at the ticket address, so I went with my car there. When I got there I didn't have where to leave the car, so I understood that there are two options for the van, if you want to try. The first is that there are a few people there who offer you parking for 100 Reais, hence they say that you need to go put the car on the way down and that they bring you back in the hook of a motorcycle and that then you are also taken by motorcycle to pick up the car. If you don't mind riding the motorcycle, then this is a Van option. There are also cab drivers who make the rise and descent to that boarding place. Depending on the time there is an absurd traffic on this go and go with these means of transportation, because the road is all in works and has all the local traffic too. This is another advantage of taking a train. So be careful to buy on the correct website if you want to get on the train and not be fooled. This doesn’t have to be a stressful and frustrating experience.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-04-15","dataVisitacao":"2025-04-01","comentario":"It is a must! One of the wonders of the world with incredible views of Rio dJ. Be prepared for crowds but it's well organised and the tropical vibes make it a dream. Be careful with the monkeys! They like your snacks! Em total, incrível!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-14","dataVisitacao":"2025-04-01","comentario":"The landscape and presence there in the mirage of the Christ the Redeemer are must-see things for anyone who visits Rio. It's beautiful, it's striking and all positive adjectives. However, financial exploitation is something unfortunate, quite expensive from Brazil. The climb is long for those who go by car (like me and my family), and you have two options: or go up to a certain place and pay R$100 for a van lebar you. Or go to the venue and pay R$150.00 for parking. Another detail: do not buy any souvenirs in the store or local kiosks, as a replica of Christ, for example, comes for R$500. If you go to the center of Rio, in the so-called Sahara, you will find the same products for R$50,00. Be smart!","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-04-12","dataVisitacao":"2025-04-01","comentario":"The place is iconic, and it is not possible not to go. The view is beautiful. Access by the trenzinho has no attractions, only the train itself.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-04-10","dataVisitacao":"2024-12-01","comentario":"Visiting Christ the Redeemer was honestly one of the highlights of my trip to Rio. I think everyone should see it at least once in their life. I went early in the morning to avoid the crowd, and I’m really glad I did—it felt so peaceful up there. The view of the city is absolutely unreal, and standing next to the statue gave me goosebumps. I took the train up, which was a fun little ride through the forest. The weather was perfect that day, but I’d recommend checking the forecast because clouds can really block the view. I brought water, wore comfy shoes, and just soaked it all in. I think even if you're not religious, it's still a powerful and beautiful place to experience.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-08","dataVisitacao":"2025-03-01","comentario":"I've been here before, but they have really tightened things up to get there. You used to be able to get a cab to take you right to the top. Now it drops you 4KM from the top where they have a newer tourist center. It meant line after line. Took 1.5 hours to get there once we got to the tourist center. Ended up taking the bondinho back down from the top because we were exhausted.\n\nWe were there on \"cruise day\" so the addition of 15,000 tourists to Rio made it tougher. It's always been crowded, but for something that just has a few viewpoints, it's not what it once was.\n\nAfter the Olympics and the World Cup, FIFA and the IOC had clearly shown the city how to make a buck, and now this, like all the other famous spots, has some money grabs in place. \n\nThis is the only tourist spot I felt really was brought down a level. Sugar Loaf is much better than it used to be.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-04-06","dataVisitacao":"2025-04-01","comentario":"A little tourist trap. Pretty expensive. Beautiful view of the city. Open your eyes because there are wild animals (I saw a monkey).","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-04-05","dataVisitacao":"2024-11-01","comentario":"Visiting Christ the Redeemer on Corcovado Mountain is truly a once-in-a-lifetime experience. The statue itself is awe-inspiring, but the panoramic views of Rio de Janeiro from the top are absolutely breathtaking — from Sugarloaf Mountain to Copacabana Beach. The journey up through the lush Tijuca Forest adds to the magic. It’s not just a monument; it’s a spiritual and cultural symbol of Brazil. A must-see for anyone visiting Rio!","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-04-03","dataVisitacao":"2025-03-01","comentario":"Let's be honest. It was hot, miserable, and there were long lines. Keep your ticket because it had to be scanned when entering and again when exiting. There's nearly no shade or opportunity to purchase water, so if you want some, buy it at the bottom of the hill where you line up to wait for the shuttle van. You can see the statue from other points in the city, including the botanical gardens, or just on the street for free.","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-04-01","dataVisitacao":"2025-04-01","comentario":"My advice is to skip the morning and afternoon. We went on a Monday with a tour group and it was awful people absolutely everywhere and all of them wanting to kneel down and pose like the statue. Our first private guide for sugarloaf the previous day said late afternoon or closer to close is by far the best time and he is a local tour guide that goes there often. \nIt is worth seeing beautiful sights and we had clear weather so still very good, but they need better control of how many people are allowed at once. Almost everyone I talked to in rio said just wait for a day with clear skies since it can change rapidly and go there after the rush. May the odds be in your favor.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-03-28","dataVisitacao":"2025-03-01","comentario":"We're going by the corcovado train up 30 minutes. To do once in a lifetime, the view is beautiful and breathtaking on the city of rio te plage de copacabana Especially book tickets in advance.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-24","dataVisitacao":"2025-03-01","comentario":"We made the Christ the Redeemer excursion on our cruise stop in Rio. We'd been there 18 years before and I didn't remember that well, so I decided to go back.\nThe monument itself of the Christ and the views are beautiful but I could not really enjoy it because of the stress of being so long lining up to take the train. It is very tiresome to wait so long, and when we arrived we only had 40 minutes to go upstairs, take pictures, admire the landscape and go back downstairs. There are so many people that it is difficult to find a place to take a good picture, and there is no time to stay for a while looking at the landscape.\nYou can climb by staircase (more than 200 steps) or elevator and then escalator. We climbed by elevator for which we also had to queue.\nIt is an interesting visit to make once to meet. If I go back to Rio on another cruise I will spend a few hours at the beach directly.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-03-23","dataVisitacao":"2025-03-01","comentario":"This was another bucket list experience for me that I have waited many years for and it did not disappoint. I must advise that it will be crowded and it will be busy. I went first thing in the morning when it opened at 08:00 and it was busy. I took a helicopter tour around the statue in the early afternoon and could see from the chopper… it was busy. I also went in the evening before closing and you guessed… it was still just as busy and packed. This is an incredible marvel to see in person and still worth it with the crowds. It also offers some incredible view points out across Rio De Janeiro which is not to be missed.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-22","dataVisitacao":"2024-11-01","comentario":"Great experience! We came from a cruise ship luckily outside the cruise terminal there is a taxi on standby. There is a police also standing outside so we feel safe that the taxi driver will not bring us anywhere. He don’t speak english well but with the help of smart phone and google translator we understood each other. So he brought us to Christ the redeemer he asked what time we need to be back the ship so that he can plan the time for us to comeback at the cruise terminal. He was very friendly despite of the language barrier. But google translate helped us. If you have a lot of time it’s nice to take the train going up but for us who is having a tight schedule better take a taxi. And always make sure you have internet connection. When we arrived at the christ the redeemer the feeling is very different to see it in real  after only seeing it in photos. Nice souvenir shop!z","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-03-21","dataVisitacao":"2025-03-01","comentario":"I'm sure it would be impressive if no one else showed up.  Endless queues to get the top and when you get there it is impossible to get a good look or shot of the Statue because you're packed in like sardines.\n\nFor many  this is a spiritual/religious experience which explains its popularity with the catholic South Americans.\n\nThe views of the city are spectacular but not as good as from Sugarloaf.\n\nTo make matters worse the weather has been cloudy for several days so the Status was only visible for about 5 minutes when we reached the top - and even  the views were  terminated as the clouds rolled in.","companhia":"FRIENDS","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2025-03-18","dataVisitacao":"2025-03-01","comentario":"The view from the Christ is just wonderful is something I would do again and go with family and is super recommended","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-17","dataVisitacao":"2025-01-01","comentario":"Simply fantastic. ! When you get up there and you see that huge statue of the christ, it puts you in perspective of who you are","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-16","dataVisitacao":"2025-03-01","comentario":"Through my hotel, I joined a day tour of Rio that includes this attraction. The other attractions included in the tour did not interest me such as Football stadium. \n\nWe had to transfer to another van once we reached the mountain. The road was very short and curvy, with the driver making sharp turns, I felt sick.  At the parking lot, we used the elevator and escalators to reach the statue.\n\nThe clouds cleared out as we reached the statue. There are so many people taking pictures, difficult to take one’s selfie photos. There is a small chapel here where one can pray. Views of the neighborhoods below are beautiful.\n\nThe clouds and mist came back as we were leaving the statue. Nothing to see at this point. Felt thankful that I was able to see this statue and take some pictures here.\n\nSuggestion: Doable by yourself. Go there when they open at 7:30 am to avoid the crowd and take good pictures.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-03-13","dataVisitacao":"2025-02-01","comentario":"Meeting the corcovado redeemer one of the wonders of the world was a unique experience and exceeded my expectations. Thanks to the juanotour guide with its semi-private tour.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-13","dataVisitacao":"2025-02-01","comentario":"Visited in the morning and stood in long line in the blazing heat  for the tickets, approximately 2.5hours. And then waited in line to board cable car. Should have bought tickets online or booked an excursion with tour agency. Most tourists came in groups n skipped all the queues. As foreigners we pay higher entrance fees anyway. \n\nThe statue is beautiful. And so is the little chapel. The hoards of people taking pics making it difficult to walk about.\nViews from \nthe top were stunning.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-03-13","dataVisitacao":"2025-03-01","comentario":"Everything very organized, a breathtaking view. Arrive early to be able to make the walk more peacefully.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-12","dataVisitacao":"2025-02-01","comentario":"My goodness, what a tourist trap! Used to be so simple to visit the statue.  Now you buy  tickets for everything. Pay for  the Cab ride to the base of the street where you pay for a  van ticket to the semi top area, Then you buy the ticket to the statue, which includes another van ride. All controlled by the park now.   Walking and walking to get these tickets. Nothing in the same spot. Plus you wait for vans to take you back down, so you waste time, waiting and waiting.","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2025-03-10","dataVisitacao":"2025-02-01","comentario":"Great view. The exit to make. Tail a little long. Buy the tickets before online. Really a wonderful view of the bay. Funny little train ride. We can walk there: Two hours of climbing. Departure from Lage Park","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-10","dataVisitacao":"2025-03-01","comentario":"A very good place. We were on a business trip and all our friends enjoyed it very well.  Very good place and food. We strongly recommend it","companhia":"BUSINESS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-03-09","dataVisitacao":"2025-03-01","comentario":"Worth the hike! You get great views near the top of Rio and it feels great knowing you earned it! Very safe and easy marked trail. I made it up in 1 hour 20 mins. I took the $5 train down and regret it. The wait for the train was long and you end up in another town. However if you do take the train down definitely recommend Rio Coffee House. Excellent Brazilian coffee.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-08","dataVisitacao":"2025-03-01","comentario":"Great tour guide- Fabio.  We booked a private tour through TripAdvisor with Fabio. Although Christ, the redeemer was extremely crowded, with Fabio‘s expertise, we were able to circumvent many of the crowds and truly enjoy the experience.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-05","dataVisitacao":"2025-02-01","comentario":"The presence of God in full a great energy, that blessed hands of this sculptor, certainly more than a photo, a selfie is to feel there near the top and the majestic\n\nFun fact: don’t let them bottle up with the people who take you in the vans to Christ, just get off the Uber (they are alive) go straight to the train cheaper and faster. (Very lively, I had to pay more but well the illusion of going to Christ was priceless).\nI went at 10am certainly a lot of crowded people, bring water, food or something, because some prices are high for being a tourist attraction, my traveler advice.\nWhether you are of religion or not, don’t miss this wonder of the world.\nThank you so much Deus \n\nSecond known wonder subtract 5","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-05","dataVisitacao":"2025-01-01","comentario":"Amazing view of Corcovado. Very recommendable place to see the Christ, at the same time the fabulous view over the Rio de Janeiro","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-03-05","dataVisitacao":"2025-03-01","comentario":"My second visit this time with friends, arrived around 9am with skip the line tickets, worked going up on the train.\n\nOnce there very busy far too many people to make it an enjoyable experience you have to be lucky to get a good photo with the statue in the background.\n\nComing down was awful skip the line tickets were irrelevant only one queue to get on a very busy train.\n\nNeeds better human traffic management throughout the attraction","companhia":"FRIENDS","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2025-02-25","dataVisitacao":"2025-02-01","comentario":"We visited by train …. We were with a tour guide, and actually this is the only way to visit this place …. They know how to avoid the big and crowded lines of people and more people around in the very hot and warm weather of Rio ….\n\nThere are way too many people around to do this by yourself with small kids !\n\nThe views are amazing and it’s worth it !","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-20","dataVisitacao":"2024-03-01","comentario":"The Christ is truly beautiful and a must stop for every Brazilian to know. We took the train from Corcovado. Everything very clean, organized and punctual. There's TVs for you to see how visible the Christ is, which I found pretty cool. We bought the ticket online without problems. The train is well preserved and the walk is very nice. The Christ Mirante is also clean, has coffee, shops and elevators. We went in the morning on a Tuesday and was well crowded but worth a lot, the view is wonderful.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-20","dataVisitacao":"2025-02-01","comentario":"We visited Christ the Redeemer in the afternoon, and while the views were breathtaking, the experience was quite crowded and very hot. Fortunately, there were some shady spots and a nice breeze where we could find reprieve. I’d highly recommend bringing a hat, plenty of water, and perhaps a hand fan to stay comfortable. The panoramic views of the city are truly stunning and well worth seeing, but I can understand why going early in the morning is a popular suggestion. Overall, we spent no more than 45 minutes there. If you go, plan ahead and try to beat the heat and the crowds if you can.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-02-19","dataVisitacao":"2025-02-01","comentario":"Beautiful place and very worth a visit! We climbed the corcovado train in a landscape of Atlantic forest and where we have the most beautiful view of the city. Despite being crowded and having been on a day of 40 degrees, I found it well organized. Don't miss out if you come to Rio!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-18","dataVisitacao":"2025-02-01","comentario":"How to go to Rio without visiting Corcovado the Christ the Redeemer! Impossible or your trip will be incomplete! \nIt's like visiting Paris and not seeing the Eiffel Tower! \nBe careful it is important to make this discovery on a sunny day to avoid fog and find yourself in the clouds . . \nThe view is impressive at 360°. \nA large souvenir shop awaits you when purchasing tickets. Waiting can be important depending on the time. Go early if possible. \nI recommend you avoid if possible on weekends as there is a higher attendance on Saturday and Sunday. Summer as winter. \nIt takes about 90 reais per person. Provide drinks and and a helmet or hat especially in summer. Do not forget your phone device to freeze these unique moments. At the back at the base of Christ a small chapel is accessible for the most religious. \nWhen you come down you are not so far from the sugar loaf. Both are doable in the same day. Enjoy your stay in Rio","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-17","dataVisitacao":"2025-02-01","comentario":"The ride up with our tour group was horrendous, because of poor roads. Took us one and a half hour to get up because of road work. The organization at the place where you have ti get if your bus and board the train was terrible. Very disorganized. And other 1-1 1/2  hours wait in line (and we already had tickets). Same line going down at the end. Extremely crowded. Beautiful view though once you get there","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2025-02-15","dataVisitacao":"2025-02-01","comentario":"This was my 5th time to visit and it will be my last. Overtourism has ruined the experience. Taking the train was tortuous. After waiting to purchase a ticket, the line to enter the train took two hours, much of it in the sun. The concessionaire operating this train has failed to adapt and it affects the mood of the guests. I can no longer recommend this site, unfortunately. I’m just glad I got there years ago before Instagram messed things up for all of us.","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2025-02-14","dataVisitacao":"2025-02-01","comentario":"The place is beautiful and very organized. There are many tourists, but you can enjoy the Christ and the view there from above, with peace. It's very exciting.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-13","dataVisitacao":"2025-01-01","comentario":"Very busy but worth it. Specially designated buses take you there. Long cue,s everywhere including the cafe’s. Lovely views from the to","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-02-13","dataVisitacao":"2025-01-01","comentario":"Christ the Redeemer\nThis was my 3rd world wonder to visit and one of the crowded ones. I went and visited as early as I could but there’s a lot of ways to go to Christ the Redeemer and I took the tram (there’s also a bus/van route which is nearby the Redeemer itself).\n\nIt was so hard to take a great photo with Christ, either you wait or burn yourself in the heat of the sun. There’s also different sections to get the view of Rio which is amazing!\n\nI think it’s best to visit before it closes, I would not suggest going early in the morning next time.\n\nThere are also shops and stores upstairs.","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-02-10","dataVisitacao":"2025-02-01","comentario":"It's a wonder of the world, so you can't add much more. It has spectacular views. I'm down one point because it's too many people upstairs and we went first thing, which is milder congestion.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-02-10","dataVisitacao":"2025-02-01","comentario":"20 years ago I visited Rio and was unable to see the statue from 10 metres away due to some incredibly heavy fog but now.....a clear blue sky and a statue that presented itself in all its might. \nJust go there","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-08","dataVisitacao":"2024-12-01","comentario":"A mystical experience, which was one of the highlights of the South American tour despite the occasional fog. Also a magnificent viewpoint.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-08","dataVisitacao":"2025-01-01","comentario":"Fulfilled a childhood dream to visit in person.  It was awe inspiring.  Although there were hundreds of other people there, it was well organised and easy to move around.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-08","dataVisitacao":"2025-02-01","comentario":"Kid's dream come true. Really impressive and panoramic views of Rio. I strongly advise however I don’t know how but if you can go on less crowded days go there because there are a lot of people and it is sometimes difficult to take good photos ...","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-03","dataVisitacao":"2025-01-01","comentario":"Cristo Redentor – The most famous attraction in this city. We visited her the very next morning. Nevertheless, many people were already on site. From the hill you had a beautiful view. The sculpture was impressive. You had two options to get up the hill, either on foot or, like us, by cable car.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-02-01","dataVisitacao":"2024-11-01","comentario":"Of the most beautiful visits of Rio!!! I recommend boarding the Train and you can buy the tickets at the same Christ ticket store.  It is not necessary to buy package tours.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-31","dataVisitacao":"2025-01-01","comentario":"The view was amazing \nTop of the World experience \nBreathtaking view from helicopter \nTruly wonder of the world \nFelt great","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-30","dataVisitacao":"2024-10-01","comentario":"To get to this place, you need to have a ticket bought by some of the official service providers. My friends and I ended up going up to the hill by a van that picked us up at predefined place. \nThe ticket prices are expensive, but I believe that once you are in Rio, you want to have Chris de Redeemer experience, so you will go for it anyway. \nWe were very unlucky with weather on the visit day, as there was fog the whole time. We were warned about that on multiple places om the spot, so it's surely something we had known in advance and we decided to go for it anyway. We were also told that once we get in, we can stay as long as we want. I think that that fog created very nice pictures, but we missed all the views. \nBe aware that the place is insanely full of tourists. Despite what you see on internet, it's not possible to avoid pictures without other people at them. \nItems in souvenir shops are also not the cheapest, but you find there so many interesting things that you as a tourist want to buy, that you will definitely end up buying something.","companhia":"FRIENDS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-01-27","dataVisitacao":"2025-01-01","comentario":"First off, let’s be clear…the Christ the Redeemer statue at the top of Corcovado is amazing!  It may be a tourist must-see, but well worth the effort.  \n\nThe journey up in the tram is a unique experience, not just because most of the journey is at a 55 degree angle but also because you are travelling through a lush forest that is being restored in the Tijuca National Park.  Once at the top, you need to climb up quite a few stairs before you come to the base of the statue itself.  Simply stunning!  \n\nThe only real drawback to the experience is that access up and down the mountain is very controlled, with only the tram being an option in each direction.  That means that at peak season, and at peak time each day during the high season, the wait in the line to go up or down can be almost 90 minutes!  Best to try and go first thing in the morning when Corcovado first opens around 7:30 AM to avoid the rush, but you’ll also get to see an amazing sunrise!","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-01-27","dataVisitacao":"2025-01-01","comentario":"They should be better reported, it is not the highest monument in America, it is located in Venezuela Monument to the Virgin of Peace in Trujillo.","companhia":"SOLO","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2025-01-26","dataVisitacao":"2025-01-01","comentario":"Impressive. Monumental. Poignant.\nWorthwhile stay. First by cog railway, then on foot or by elevator.\nWonderful views if fog or clouds allow. Lots, lots of tourists.\nSmall church in the base.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-26","dataVisitacao":"2025-01-01","comentario":"Tour that can be carried out in a single turn, there are several ways to climb. And the tour is just that, see the Christ of Pertinho and the view of Rio de Janeiro from above! \n\nMust visit on a sunny day!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-26","dataVisitacao":"2025-01-01","comentario":"To be one of the wonders of the world all very disorganized and chaotic except that you take a tour. The first attempt to meet him I bought the tickets online but it is no use as you still have to line up for the ticket shop to get the tickets, I was waiting three hours because there was no power and when he arrived it was already 17:20 and closed, they said we could ask for rescheduling or our money online but arriving at the hotel we saw that there is no money back and what to reschedule had an additional cost of 30 percent. The next day we went and see what we could do and they didn't return our money and wanted to charge us again, we asked to go to administration and they changed our tickets after a couple of bad indications from the people who work there, but they made us do the line that was like two blocks, again three hours and in full sun with 36 degrees is inhuman, many people drop out in the attempt, especially with children or senior citizens, downstairs plus two unisex bathrooms for a lot of people, in the end after three hours to board the train we had to desist because we already had tickets for Buzios and it was another few hours to get off. The train that comes on board has no air conditioning and little capacity and worst of all you can be waiting 3 hours but people on cruises and tours are put through earlier. There is the option of cars that for 60 reals offer you to go up but I had already lost patience and silver, I was sunny... terrible organization a better chaos if you go to visit the Christ hire a tour at least in high season","companhia":"FRIENDS","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2025-01-26","dataVisitacao":"2025-01-01","comentario":"Seeing the Christ The Redeemer statue close up and coming into view from afar is worth all of the hassle to be able to do it.\nThe queues seem to be irrelevant to various groups that just seem to be able to mysteriously push their way to the front. You will be stood up in baking heat for long periods of time so bear that in mind and take plenty of water. At the top of the statue it is fairly crowded. Lots of people admiring the views and posing for social media.","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-01-26","dataVisitacao":"2025-01-01","comentario":"A must if you have to visit RIO. Absolutely stunning view as we have never experienced before elsewhere. Remember to buy tickets in advance as the queue is long for those who haven’t.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-26","dataVisitacao":"2025-01-01","comentario":"There are no beautiful, divine, majestic words, divine sights, much logistic. Tidy, clean, nothing missing..memories, food, sandals...good","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-25","dataVisitacao":"2025-01-01","comentario":"Fabulous, incredible, magical, impressive, I miss the qualifiers! On the other hand, an organization to review and watch out for scams to skip-the-line tickets: prefer tour operators, official ticketing.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-23","dataVisitacao":"2025-01-01","comentario":"We ubered to the bottom of the train. Our uber driver told us it was quicker to pay for the Corcovado Vans. So we did that at the park vs waiting in the line for the train ticket/ride. The van took us 1/2 way up the mountain to the park ticketing. Bathroom/shops/vendors were there. We then purchased our ticket and was transported via van to the top. We were dropped off. There were elevators to access the very top and stairs. We took the stairs. Very busy. Lots of photo taking. Incredibly scenic views. The line to van back down was about an hour on a sunny Wednesday at lunch. Great attraction.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-22","dataVisitacao":"2024-12-01","comentario":"There is no question about the iconic statue designed by a French-Polish sculptor named Paul Landowski is a landmark not only for Rio de Janeiro, but a symbol of Brazil.  It is like the Eifel \nTower is to Paris and France. \n\n We decided to visit this famous 1931 Art Deco statue by an Uber.  The advantage of this mode of transportation was the ability to go when we wanted.  If you travel with a tour, more than likely your guide will have the ability to circumvent the long lines. We found this advantage when we took a tour up Sugarloaf Mountain the day before.  Whatever way you chose, you will probably not be alone. \n\nYou have two ways in getting to the peak of the 2300-foot Corcovado Mountain.  One is to take the red narrow-gauge train that departs every 30 or so minutes.  This train takes 20 minutes to get to the base of the complex.  There are ticket machines at the office.  You can choose various languages to select your ticket.  We were guided by a clerk nearby. The cost of the train and admission was about $25 per person. Credit cards are accepted.  If you can sit on the right going up to view more of the countryside.\n\nWe were approached by someone willing to take us to a van that goes up.  There is a van depot near the top where an elevator will take you up close to where the train people are getting off. \n\nAnyone can take another elevator to an escalator the rest of the way.  Most people walk-up the steps. \n\nIf you are strong at climbing, there is always hiking up.  We did see a trail, but no walkers. \n\nThe Christ the Redeemer statue and views are majestic.  The statue stands 98 feet high, and Christ’s arms stretch out 92 feet.  Originally, the statue was supposed to have a globe in his hands. It cost over 4 million dollars to build by 1930 using reinforced concrete and soapstone. \n\nWe found that patience was what is needed to withstand the crowd up and near the statue.  A common photo was to have one’s hand outstretched causing bottlenecks.  If you have that patience, you will get to the outer wall where some of the best pictures are taken. You will definitely hear many different languages.  \n\nNear the base of the statue, is a small chapel constructed in 2006 for the statue’s 75th anniversary.  Many people missed this opportunity if you did not go to the back of the statue. \n\nAt night, the statue is visible from most places in Rio de Janeiro.  That visibility is one of the main reasons why Christ the Redeemer was placed on Corcovado Mountain and not Sugarloaf Mountain. \n\nIf you found this review “helpful” please check the icon “thumbs-up” to let me know.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-21","dataVisitacao":"2025-01-01","comentario":"Lovely space nice train trip, sure a good tip to pull up here and see the sunset,, about 1 hour in train queue but worth it a fantastic view","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-21","dataVisitacao":"2025-01-01","comentario":"The entry to the site is completely corrupt.After buying the tickets the site clearly states that over 60  years old and other priorities like pregrant women should have priority on buses going to see the Christ .There is a line for priority clients where it states who is priority.This  is not respected instead the tour agents with help of the site employées,mostly young girls, let the tour group on taking bribes.I am over 70 and with other elderly people waited over 1 hour to get onto the bus . Tour group after tour group go past with young people and  get on the buses. It is clearly complet corruption.","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2025-01-16","dataVisitacao":"2025-01-01","comentario":"It is the second time I climb Christ this time so that my children know him. Last time I went on tour, this time on our own. We went first thing in the morning, bought train tickets online the day before. All very quick at that time, short and fast lines. Unfortunately this day rained, but our idea was to live the experience by train. The Christ is not a big deal, but the road to arrival is very nice and is a place to visit if you are in Rio. The only bad thing is the number of people who try to take the best picture, it's very funny. What struck me is how poorly maintained the place is (compared to sugar bread), but we still had a good time.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-01-15","dataVisitacao":"2025-01-01","comentario":"Beautiful place. From del Cristo you can see all of Rio de Janeiro and from all of Rio de Janeiro you can see the Christ the Redeemer in the Corcovado. Maravilloso. \nWe were lucky to arrive last minute and saw the sunset. In addition there were few tourists, which allowed us to take spectacular photos and enjoy the view.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-13","dataVisitacao":"2024-08-01","comentario":"A visit to a world-renowned tourist spot. Stunning view of the wonderful city and a unique experience.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-12","dataVisitacao":"2024-12-01","comentario":"Christ the Redeemer is a must-see landmark in Rio de Janeiro. The statue is awe-inspiring, and the views from the top of Corcovado Mountain are spectacular. The journey up the mountain is an adventure in itself, whether you take the train or hike. Once you reach the summit, the sheer size and beauty of the statue, combined with the panoramic views of the city, make it a truly spiritual experience. Don't forget to bring water and sunscreen, as it can get quite hot.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-11","dataVisitacao":"2024-12-01","comentario":"We went twice in the 3 days we were in Rio. \nThe first time was during very heavy rainfall. The train taking tourists to the top had been suspended due to the rain, but the tour company drove us up the mountain in a minibus instead. Great views on the way up. Hardly anyone at the statue when we arrived, which was great as we pretty much had the place to ourselves. Arty photos of glimpses of Rio neighbourhoods peak out from under the cloud cover as we looked down. If it rains heavily, it's still worth considering a visit.\nThe second time was during fine weather. The summit was packed with tourists and difficult to navigate around and take photos, and experience the views and statue. There's a small chapel in the plinth that Christ is standing on. Make sure you find this (entrance at the rear) and pay a visit. \nA must visit when in Rio.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2025-01-10","dataVisitacao":"2025-01-01","comentario":"The ride up on the cog railway is cute but there are stairs from there so be cognizant of that if you have mobility issues. It was absolutely packed when we went and the wait was over 90 minutes just to get up there. The views were good but overall it’s a one time thing and if I come back I won’t waste my time in line for this.","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-01-10","dataVisitacao":"2025-01-01","comentario":"A valuable tip they didn't give me. Go through the elevator and the staircase. The kids complained a lot because we went down the stairs. If it were not for the stunning view, it would not be a good experience.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-09","dataVisitacao":"2024-12-01","comentario":"Hello everyone, if you have the chance to go to Rio de Janeiro, the Chris Redeemer is a must-see stop. Go early in the morning to avoid the crowds. And once the tour is over stop a little further down for a little beer.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2025-01-06","dataVisitacao":"2024-12-01","comentario":"Impressive to say I've been there, but ultimately not as pleasant as hoped for. The viewing platform was extremely packed and we were told it was an empty day. The views down to Rio are impressive but the views of Cristo are more impressive from further away.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-01-06","dataVisitacao":"2025-01-01","comentario":"The police should put the scammers in jail. We arrived by taxi as soon as we got off we boarded a guy in a white T-shirt uniform with the corcovado logo. He told us that for 100 reais he would put us up in a combi. Since I had seen the entrance was at 128 reals I asked him that xq cheaper with them and the guy told me that xq did not offer the train experience that was touristic but to climb direct. We went and we were left in a place that had to buy the ticket to continue higher by 84 reais. A total of 184 reais instead of 128. In addition to this it was already very cloudy and the same people of the Christ offered us official photos where they would Photoshop the Christ to get out, I approached the office above diagonally to the church and they explained that they would do it without problem, we took the photo, we paid and it was the Solution. Mind you, be patient xq. The photos take time.","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2025-01-04","dataVisitacao":"2025-01-01","comentario":"The place is of course beautiful but you should definitely not conclude with the “guides” who inform you at the bottom, before the climb, they asked us 250 reals per person while arriving at the top the entrance is displayed at 89 reals per head. Simply ask to take a taxi to the ticket office and you will pay the right price for your ticket. I went there with my family at 9am and already there were too many people, you should be there for the opening","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-01-03","dataVisitacao":"2025-01-01","comentario":"We went to the ticket office at the Church site. We could have bought tickets online. We decided not to buy tickets online because it required heavy personal information. The ticket place did not feel safe, lots of people and trash. A woman kept following us to ask us to buy her tour. We went to see Christ statue about 10 years ago, so in my opinion it was too much hassle to see it again.  It was very crowded to take pictures 10 years ago then.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2025-01-02","dataVisitacao":"2025-01-01","comentario":"Let's go to the top 10 tips for your way to the Redeemer Christ. Primary tourist point to get to know each other. It is not in vain that belongs to the 7 wonders of the world! First, buy in advance by the site. I remember I paid about 75 reais at the time. In addition to avoiding queues on the day, buying in advance you choose the time you would like to go or if buying on the day, there shows the available hours. Second, take the train that you have available on site. The experience is better than van. Details, transport does not leave there at the feet of Christ, leaves you at the entrance of the stairs. Third, getting there you'll climb 200 steps. Yes, it's 200 but it has the elevator option . Fourth, arriving there in Christ has a photo team that take photos of them and OBLIGATORY, when leaving the place you need to see the photos before leaving. They are high prices but if you are reluctant you can pay more on account. However, if it's a one-time visit where you won't come back so soon, make up for the purchase. Fifth, avoid hours very early 07h to 09h to visit the Christ and be aware of the weather during the day. On very sunny days in the hours mentioned above is the period that is very foggy right in the waist of Christ, so whoever takes a photo below up will not see right the face of the statue. Since time is free while on site, wait a while until the clouds disperse. Sixth, if you want a photo alone with no one around you, forget. The place has a lot of people. I give a tip from pinterest, there are some photo models with the Christ that prevents the crowding of people in the photo.  Seventh, if you want something more particular there are helicopter tours that cost 700 reais per person (see in the day, maybe the value has increased) and lasts around 15 minutes. But don't be fooled, compensate more for the experience of flying in the helicopter than being near Christ. Pq doesn't get that close, logical for security reasons. Eighth, there has infrastructure for feeding and buying sovenirs. The food square is very top. Nono, to adventurers who want to reach Christ through trail has this option too. But then it is necessary to consult one of the local employees (I did not adhere to this modality). Tenth, whoever wants to perform his wedding ceremony in Christ, is possible. There is a parish. And those who want to pay promise climbing the stairs on their knees is also possible, remembering that they are 200 steps wide. They're not narrow. And there's bathrooms. Extremely clean and stay in the underground of the food square.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-12-25","dataVisitacao":"2024-11-01","comentario":"The beautiful day helped a lot to make photographic recordings! The energy is surreal, being close to one of the 7 wonders of the world, the Christ the Redeemer is amazing! I recommend the experience. I didn't buy any photos of the services there, I didn't like it.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-12-19","dataVisitacao":"2024-12-01","comentario":"This is something you must do once in a lifetime, the views are amazing from the top,  it takes about 25 minutes from downtown ,the ride in the tram is just 20 minutes, once you reach the last station you can use the elevator or walk the stairs.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-12-15","dataVisitacao":"2024-12-01","comentario":"The point is to excite... But very full, even difficult to take pictures... But finally, a place to meet, a postcard from Rio.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-12-15","dataVisitacao":"2024-11-01","comentario":"I didn’t have much time in Rio, but this site was a must-see. Unfortunately, the weather wasn’t on my side. On arrival, visibility was poor—virtually non-existent—so heading up wasn’t worth it. I hoped for better conditions the next morning, the day of my return home, but it wasn’t looking promising. However, a glimmer of hope appeared as the clouds started to shift.\n\nDetermined, I made my way to the tram station. Despite being warned by the ticket counter staff (who repeatedly reminded me there were no refunds) that visibility was zero, I decided to take the risk—I was already there, after all. The 20-minute tram ride was not busy at all, unsurprising given the weather, and when I arrived, I chose to take a leisurely stroll up the steps rather than use the escalator.\n\nTo my delight, as I climbed, the statue began to emerge through the mist—a breathtaking sight. My gamble had paid off, and I was thrilled to experience such an iconic view. Even though the weather wasn’t perfect, the atmosphere was magical, and the views, though hazy, were still spectacular. I can only imagine how incredible it must be on a clear, sunny day. I hope to return and see it in all its glory someday.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-12-13","dataVisitacao":"2024-11-01","comentario":"Very touristic.Make sure you come early enough.\nIts worth a visit.\nIts the most visited place.We had a very great experience.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-12-12","dataVisitacao":"2024-12-01","comentario":"A disaster the organization. They didn't modernize at all. Last time I went 12 years ago and it's worse. People piled up waiting in the sun, elderly people, guys, awful and besides when you get upstairs you can't even take a picture or take anything, the toilets are terror. With the number of people who visit you should organize better. Not that you get tickets on schedule. Too bad.","companhia":"COUPLES","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2024-12-11","dataVisitacao":"2024-12-01","comentario":"Disappointing, poorly organized and very full, has no way to walk sometimes. Value to ride by train is high and neither preferential queue had. No ventilation both waiting and inside the train. Getting there, few environments for consumption and shopping. Could be better organized, like in the Sugar Bread Bondinho. I didn’t like to visit the Redemptor Christ, even though it was a symbol of Rio de Janeiro.","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2024-12-10","dataVisitacao":"2024-11-01","comentario":"Place of incredible energy and visual, had gone other times but had not caught a day without clouds yet this time we were lucky and the visual was sensational","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-12-09","dataVisitacao":"2024-12-01","comentario":"\"Cristo Redentor is undoubtedly one of Rio's top tourist attractions, which is why so many tourists go up there every day. But how does it feel to be there? Personally, I'd say it's less than what it's advertised to be. It is more of a commercial than a religious symbol of Rio and that is how it feels up there. \n\nAlthough the view from the monument is impressive, I couldn't enjoy the sight due to the density of people and left rather quickly. For people who want to visit the monument, I recommend to book a private tour that does both sights \"Cristo\" and \"Pão de Açúcar\" in one day, so you can focus the rest of your vacation days on the more relaxing things.\n\nBelow is some information that I find useful in planning your trip:\n\nWhat you should know / How to get there:\n\nBasically, there are four ways to get there:\n    1. With an official tour operator \n    2. By train at Corcovado\n    3. with a private tour operator\n    4. individually\n\n    1.Probably the cheapest option. Shuttle service includes entrance fee. Different options available, such as pick up and return at Cocacabana, Largo do Machado or Corcovado-Pareira. Tickets can be bought online (strangely, you have to open an account first and leave a lot of personal information on the site).\n    2.Corcovado train from Cosme Velho.  Stops right under the Crist monument. You will need additional transportation to the Cosme Velho train station. \n    3.Probably the most time efficient option. Very convenient. With the option of being picked up at your hotel. Takes you directly to the monument. No additional transportation needed. No waiting time. \n    4.I did this and from my experience not recommended as it is very difficult to get a taxi/uber from the sight back to the city. If you arrive individually, you will need to buy a ticket either at the site or online. For the last part from the ticket office to the monument you have to take the official shuttle service which is included in the entrance fee.\n\nPay attention to the local tourist guides => they will tell you that the waiting time is much longer in order to sell you their (overpriced) tours or entrance fees.\n\n-In early December 2024, on a nice day around noon, the waiting time to buy an entrance ticket was about an hour and another 10-15 minutes to get on a shuttle bus.\n\n-The site is very crowded with people => be prepared to be in a crowd of sweating people all \"fighting\" for the best spot to get their selfie. \n\n-It gets very hot on the bus and there is limited space to rest => be aware if you are traveling with children or elderly.\n\n-You may have to wait outside for the shuttle bus with limited protection from the sun and heat.\n\n-In the area phone coverage is very limited to non-existent => if you need internet go to the information desk, they can get you a hotspot.\n\n-It is very difficult to call Uber or Taxi in the area, you might want to organize your transportation beforehand.\n\n-Taxi or Uber may not be willing to pick you up in that area for security reasons.\n\n-Locales offer their unofficial taxi service => overcharging\n\nThe Good:\n-impressive construction\n-Very nice view on a clear day\n-Helpful and patient staff at the information office\n\nThe bad:\n-not well organized\n-Official website of the site offers very limited information\n-Infrastructure not designed for so many visitors\n-overpriced\n-overcrowded on nice days","companhia":"SOLO","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2024-12-07","dataVisitacao":"2024-12-01","comentario":"It's all in the title.\nThe place is obviously unmissable. The view was breathtaking. However to get there you have to queue to buy a ticket then wait quite a while to get on the cable car and once there are so many people that we walk on it. \nAnd to get back down it's the same thing you have to wait a while before you can get on the cable car... \nIt's a shame they should limit the number of people in order to enjoy the place more. \nYou will find many souvenir shops upstairs and something to eat.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2024-12-01","dataVisitacao":"2024-11-01","comentario":"Fantastic. Do good to the soul and faith.  Strengthens the spirit.  A place that everyone should visit.  It's not the fool that is considered one of the wonders of the world","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2024-11-29","dataVisitacao":"2024-10-01","comentario":"The Christ the Redeemer, Rio de Janeiro’s iconic symbol, impresses not only by its majesty, but also by the spectacular panoramic views of the city, from Sugarloaf to Copacabana beaches. However, the experience can be overshadowed by the large number of visitors, making it difficult to enjoy the place with peace of mind. To avoid the crowds, it is advisable to go early in the morning and take adv
