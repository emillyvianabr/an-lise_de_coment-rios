nt if there are people over 60 and children\nThe line moved quickly, I went July 22","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-02","dataVisitacao":"2023-07-01","comentario":"Great experience in an iconic place, with beautiful landscapes. Everything very organized, movements as quick as possible given the distances. No long queues, despite many people in the place.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-01","dataVisitacao":"2023-07-01","comentario":"It is the icon of Rio de Janeiro and cannot be missed. The views of the city are very beautiful and the Christ itself is imposing. Comments and suggestions: 1) it is advisable to go on a sunny day, because at such a height any cloud covers the views. To do this, I recommend checking the weather forecast, which is usually very accurate. 2) the lines are very long, even having bought tickets online. We went on winter vacation and had almost 2 hours of waiting. 3) bring water and a hat if it is sunny","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-01","dataVisitacao":"2023-07-01","comentario":"We went at 5 p.m., we bought the train tickets and got on without waiting. There were a lot of people up there but the view of the city is really fantastic. It is essential that the day be clear.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-08-01","dataVisitacao":"2023-07-01","comentario":"Incredible place to visit.. Buy your ticket in advance to avoid long queues, the train ride up is really cool. The view of almost all of RJ is really cool... If you can go on an empty day it will be an incredible experience. At the foot of Christ there is a chapel.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-31","dataVisitacao":"2023-07-01","comentario":"Excelente servicio!! Cumplieron todo lo dicho por la promotora Sol excelente. Recomiendo el servicio.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-31","dataVisitacao":"2023-07-01","comentario":"Fomos em dia da semana mas na parte bem cedo pela manhã, subimos de táxi que foi o método mais em conta. No dia acabou nublando bastante quando chegamos aos pés do Cristo, mas rendeu algumas fotos. No mais é isso, os suvenir são caríssimos, não vale a pena gastar seu dinheiro ali. A vista é bonita para as praias do rj. Aconselho ir no período da tarde, de manhã cedo todo mundo vai ao pico e é quase intransitável","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-31","dataVisitacao":"2023-03-01","comentario":"You are not going to go to Rio and not come here, the views are amazing and I thoroughly enjoyed the whole experience.  You will require patience though as it is very busy at the top.  People have a tendency to hang around in the bests spots but unless you are in a rush you will eventually get your perfect snaps.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-31","dataVisitacao":"2023-07-01","comentario":"Fizemos a subida pelo trenzinho, compramos os bilhetes pelo app e foi tudo muito bem organizado tanto a subida quando a descida.\nTem bastante gente lá em cima mas a vista compensa. O dia estava aberto, sol e uma vista incrível.\nOs banheiros poderiam melhorar , colocar mais e reformar.\nFotos digitais com os fotógrafos com preços justos.\nFomos de Uber, tranquilo para chegar e chamar de volta na porta do trenzinho.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-30","dataVisitacao":"2023-07-01","comentario":"Lugar indispensável para visitar no Rio de Janeiro, fomos bem cedo por indicação do nosso guia Anderson do Rio in Tour que foi perfeito, pois pegamos o Cristo super tranquilo o que nos rendeu fotos e vídeos incríveis.\nSó não fomos na capela que há atrás do Cristo, pois estava  interditado para gravação com o Pedro Scooby e achei um absurdo isso, pois vamos para uma experiência total e por causa de um \"famoso\" somos barrados, fiquei chateada.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-29","dataVisitacao":"2023-07-01","comentario":"El parque es muy bonito, fácil de llegar, la subida puede ser pesada, el recorrido es breve. A mi parecer, la estatua es más pequeña de lo que esperaba y hay demasiada gente. Lo único verdaderamente valioso es la vista que tienes de la ciudad.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-07-28","dataVisitacao":"2023-07-01","comentario":"Um lugar único e com uma vista deslumbrante!!!\nPontos negativos:\nNecessário repelente e usar calça, pois há muitos mosquitos borrachudo. Minha filha tem alergia e ficou toda picada e teve que usar pomada antialérgico.\nBebidas e comidas com preço de aeroportos. \nNão aconselho ir em períodos de férias e feriados, pois não há controle de lotação.  Então tem filas intermináveis e pessoas mal educadas, principalmente os gringos.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-28","dataVisitacao":"2023-07-01","comentario":"Of course you are going to go....\n\nIt's a busy place - we took the first train up - and it still felt busy up there. Make sure to check out the small church at the base of the statue.  It's great to see from around the city - but the actual visit at the top takes less than 30 minutes.  Easy to uber to the train.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-26","dataVisitacao":"2023-07-01","comentario":"Local lindo demais! Experiência incrível, porém muito lotado e falta de organização. Havia 3 filas , cada hora um funcionário falava uma coisa diferente, ficamos em 2 filas até perceber que era a fila errada.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-24","dataVisitacao":"2023-07-01","comentario":"Vale a pena, lugar muito bonito . Vidal privilegiada, só passamos muito frio . Mas a natureza perfeita.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-23","dataVisitacao":"2023-07-01","comentario":"Difícil acesso, caro, cheio de cambistas e motoristas das vans super imprudentes. Se preferir ir de bondinho se prepare para uma fila de quilômetros!","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-07-22","dataVisitacao":"2023-07-01","comentario":"Prendre les billets par internet était l’excellent choix. Malgré cela, y’a foule pour la montée en train, le tour et tellement de monde à la descente… que nous sommes partis à pied jusqu’à la gare intermédiaire. Nous y avons repris le train en descente sans attendre. Sinon, ce sont de belles vu sur la grande ville de Rio…","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-07-22","dataVisitacao":"2023-07-01","comentario":"Un lugar icónico, maravilloso, soñado, para tener una vista mágica de una hermosa ciudad.\nHay que visitarlo si estás en Río, sin dudas...\nPero la experiencia del tren es un verdadero DESASTRE!\nLo tenés que contratar antes para no hacer una hora de fila por el ticket... pero cuando llegas media hora antes de tu hora señalada, tal como te piden, te esperan 90 minutos de una fila mal organizada para subir al tren.\nLuego 20 minutos de subida y luego un mar de gente arriba.\nFinalizas con otra hora de fila para bajar en el mismo tren.\nEncima es un servicio carísimo (aprox usd25 x persona).\nUna pena que hagan tan mala experiencia de un lugar taaaaan maravilloso e indispensable.","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2023-07-22","dataVisitacao":"2023-07-01","comentario":"O lugar é lindo o Cristo redentor e gigante é muito belo dá pra ver o rio lá de cima já fui duas vezes na primeira não tinha a escada rolante e tinha ido de van já na segunda optei pelo trem e tinha a escada rolante adorei a ideia o lugar é maravilhoso vale a pena visitar","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-22","dataVisitacao":"2023-07-01","comentario":"Muy mala experiencia! No recomiendo en lo absoluto. Teniamos turno a las 15.30 y terminamos subiendo recién a las 17.30. 2 horas de fila. Y no sólo había fila para subir, si no también para bajar del Cristo. Mucha gente y muy poca organización. No vale la pena ir. Muy decepcionada!","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2023-07-20","dataVisitacao":"2023-07-01","comentario":"My wife and I took a tram to get there to view this iconic statue. It's a must-see. You don't come to Rio and not see it. Reviewed by Miles Archer of Boca Raton, Florida.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-18","dataVisitacao":"2023-06-01","comentario":"It’s definitely worth seeing but the day we went it was so packed. A lot of people take pictures and then hang out and don’t move on. It was frustrating at times. The view is fabulous and it’s well worth the trip so go if you’re in Rio. The train ride up is nice too.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-18","dataVisitacao":"2023-07-01","comentario":"El corcovado es maravilloso. Solo verlo trasmite mucha paz. El problema es la cantidad de gente en la pequeña plataforma qué hay. Realmente uno está encima del otro. Las vistas de la ciudad son espectaculares. Sabiendo que estará lleno siempre, es una visita obligada de Río.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-14","dataVisitacao":"2023-06-01","comentario":"Não sei se foi por conta do horario, mas a fila estava quilometrica, passamos mais de 2 hs na fila...\npra subir, mta muvuca, pra descer uma bagunça","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-13","dataVisitacao":"2023-07-01","comentario":"Vista espetacular, subimos de Uber e pra descer paramos no mirante Sta Marta. Loja completa acessibilidade boa para crianças, vista espetacular da  cidade do RJ","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-12","dataVisitacao":"2023-07-01","comentario":"acredito que vale mais a pena ir ate o pao de açucar. lá é tao cheio que voce nao consegue tirar foto com o cristo.","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-07-11","dataVisitacao":"2023-07-01","comentario":"We visited twice in a week. Both times we booked our tickets the night before. We're glad we didn't pay for any jump the queue tickets because both times we were on the first train up (7.20am) and didn't queue. Incredible views of Copacabana and Sugarloaf. Be warned though, there is scaffolding up at the moment on one side (July 2023) so not great for photos. Also, the second time we went people started forming queues and holding others up so they could take photos without other people in them. This may work if there are half a dozen people up there but the next train arrives twenty minutes later and by then there are quite a few people and there simply isn't enough room to take photos without others in. There was also a guy with a long selfie stick which he used to film around the balcony for about 15 minutes meaning everyone who took a photo of sugarloaf in the time has his selfie stick in it. He seemed oblivious.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-07-11","dataVisitacao":"2023-07-01","comentario":"Vans do Corcovado muito fácil e prático conhecer o Cristo Redentor. \n\nLocal imperdível.  Maravilhoso ver a cidade lá de cima. \n\nA energia do lugar no tem explicação.  \n\nSuper recomendo","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-10","dataVisitacao":"2022-08-01","comentario":"Sem palavras, para descrever o tão maravilhoso é.\nMuito lindo.\nRecomendo a todos visitarem o Cristo.:)","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-09","dataVisitacao":"2023-05-01","comentario":"Le second incontournable de Rio ! Avec ou sans nuage, la montée aux pieds du Christ Rédempteur doit être faite pour la vue sur toute la ville.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-08","dataVisitacao":"2023-07-01","comentario":"Increíble vista, subimos en el tren, genial. Recomiendo eso si comprar antes entradas al tren para no tener que esperar una hora.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-03","dataVisitacao":"2023-05-01","comentario":"Que vista incrível!!!\nFoi tudo de bom, muito melhor que nossas espectativas...\nNão tivemos nenhum problema...","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-07-03","dataVisitacao":"2023-07-01","comentario":"Local muito gostoso e organizado. \nFui até o centro paineiras Corcovado de Uber e depois peguei uma van até o Cristo ( já opções para que pegue a van desde Copacabana e vá até lá). \nEstava na barra e paguei no Uber uma média de R$100.00 ida e volta e a van + entrada no Cristo R$240.00 para 3. \n\nFotos profissionais la dos fotógrafos do Cristo: R$100.00 7 fotos.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-30","dataVisitacao":"2023-02-01","comentario":"Whether you fly over it in a helicopter or you use the tram to get there, you will see it’s magnificent. \nA lot of work has been done on the area since I last visited in 2007, definitely more commercialised.\n\nThe queue for the train was quite long but it affords beautiful views as you ascend upwards.\n\nWhen we went it was extremely busy which made it difficult to get that amazing photo.\n\nI’ve been twice now and don’t think I would visit again. But I feel it’s well worth going at least once!","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-06-27","dataVisitacao":"2023-06-01","comentario":"É uma grande atração e é muito bacana conhecer uma das maravilhas do Rio. A vista lá de cima é totalmente Sensacional. Pode-se ver toda a cidade. O local é bem cheio, abarrotado de pessoas mesmo que lutam por uma boa foto, mas só pela a vista do mirante já vale a pena.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-06-26","dataVisitacao":"2023-06-01","comentario":"É um lugar bonito, e muito desejado por turistas, por esse motivo eles abusa no valor, ingressos caríssimos, sem opção de valores, para estudantes e meia, valor de crianças é praticamente o mesmo de adultos. Sem opção para dividir. Fui no trem e funcionários educados, da bilheteria então são os mais educados. Galera que organiza entrada e fika pra catraca, são rude e sem paciência. Não podem esquecer que o lugar é um passeio onde as pessoas investe para ter boas lembranças, e se divertir.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-06-25","dataVisitacao":"2023-06-01","comentario":"Lado positivo: Ir un domingo es lindo porque hay misa lo cual lo hace una hermosa experiencia ( si te gusta esto) por otro lado la vista desde ese punto es espectacular. \nLado negativo: al llegar te encuentras personas que tratan de venderte los boletos mas el regreso al centro por 210 reales por persona este con el boleto incluido al Cristo. \nDebes asegurarte de que te dejen eso escrito, que sea la misma persona ya que si no conoces te tratan de estafar. \n\nTrata también de siempre tener cambio. Trata de tener opciones que se ajusten a tu presupuesto","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-06-22","dataVisitacao":"2023-06-01","comentario":"El lugar es maravilloso, y es una visita obligada en una estadia en Rio de Janeiro, la vista es espectaducular","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-18","dataVisitacao":"2022-11-01","comentario":"Feels special to be in front of that huge statue.   Probably there is a very nice view (we were a bit unlucky that there were many clouds, so sight was a bit limited).","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-06-15","dataVisitacao":"2023-06-01","comentario":"Voltei ao Corcovado depois de muitos anos e continua sendo uma grande atração. Tudo é muito lindo a começar pela natureza do local. A vista que temos lá de cima do corcovado é mágica. Vale super a pena conhecer.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-15","dataVisitacao":"2023-06-01","comentario":"Ride up early, enjoy the view, beat the crowds. We enjoyed the trem ride up the mountain and escalator ride the rest of the way to the top. Beautiful views, when the winter clouds part, heavenly experience when clouds surround you. Tight spaces at the top, so make sure to get in and out before the crowds arrive.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-14","dataVisitacao":"2023-05-01","comentario":"Don’t bother with skip the line!!! If you book your ticket with the company directly (ignore more expensive third party sites) then you have to choose a time slot. You only queue if you rock up and hope to buy. That said, they kindly let me swap my day without any hassle (low season in May) as I had not realised the Botanical Gardens are shut Wednesdays. If it’s very foggy you can only see his feet, so watch the weather forecast! If you have to choose between this and Sugarloaf, then Sugarloaf is better. We took the old train up. Didn’t seem that old but was fine.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-06-13","dataVisitacao":"2023-06-01","comentario":"Vista excelente, vale a pena subir de trem, além de ser mais cômodo é um passeio a parte com uma vista do parque da Tijuca.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-13","dataVisitacao":"2023-06-01","comentario":"Passeio tranquilo mesmo sendo feriado , fomos de Uber até o trenzinho lá pelas 16:30 hs , horário que as pessoas já estão indo embora e aproveitamos e ficamos para ver o por do sol . Experiência única , por do sol com visual deslumbrante da cidade e com o Cristo Redendor abençoando à cidade. Pegamos uns dos últimos trens para retornar e valeu muito a pena .","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-13","dataVisitacao":"2023-06-01","comentario":"Pensa em uma vista de cinema americano. Melhore bem e chegaremos ao Corcovado. Mas vá bem cedo, se não a fila será gigante. Nós chegamos as 0730 e ainda estava tranquilo. As 9 quando saímos, lotado!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-12","dataVisitacao":"2023-05-01","comentario":"Un des incontournables avec le pain de sucre. Sa construction et sa création vallent la peine d'être connue; On ne parle pas de la vue extraordinaire.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-12","dataVisitacao":"2023-06-01","comentario":"Vista incrível da cidade, pessoas do mundo inteiro indo conhecer uma das sete maravilhas do mundo moderno. Recomendo também a ida ao Bondinho do Pão de Açúcar!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-11","dataVisitacao":"2023-05-01","comentario":"A truly spiritual experience.\n\nTook the ‘sinners’ steps up and loved being close to such an iconic and special statue.\n\nIt was very busy. Would go super early if went again as it was very crowded and not an especially busy day! \n\nGot to see a bit of a mass too! \n\nBeautiful views and vistas.\n\nShops to buy souvenirs - big push on photos! \n\nTrain ride was fun too!","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-10","dataVisitacao":"2022-11-01","comentario":"Rio de Janeiro à 360° : c'est vraiment magnifique. Par contre,  il faut privilégier la montée avec le train à crémaillère et ensuite l'ascenseur, cela permet une superbe balade dans la forêt de Tijuca.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-10","dataVisitacao":"2023-06-01","comentario":"A vista nota 1000\nO Cristo nota 1000\nO bando de safado que fica extorquindo as pessoas é alto lamentável, porém muito visto em outros locais no rio. \nMe irritou bastante com esse jeito Carioca de abordar e extorquir as pessoas! \nFingem ser da empresa ou ter os ingressos e não passa de uma farsa!\nNão parem nas barricadas formadas por eles, passe e compre tudo antes no site e pegue um van, se for de carro, esta ferrado por causa daquelas safados!","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-06-08","dataVisitacao":"2023-06-01","comentario":"A experiência mais completa na Visita ao Cristo Redentor se dá subindo a floresta da Tijuca pelo Trenzinho do Corcovado. O trem passa no meio da floresta. No Cristo a vista mais deslumbrante do Rio de Janeiro, de onde se vê toda a cidade por cima. Não deixe de entrar na capelinha que tem dentro da estátua. Na descida do trem não deixe de parar no Mirante das Paineiras, onde temos um local para lanches e refeições bem mais vazio e tranquilo que a lanchonete junto da estátua. Neste local, na parada da descida, tem também uma loja gigante de souvenirs bem mais completa e variada que as que ficam junto à estátua. Ou seja, comer e comprar souvenirs deixe para fazer no Mirante das Paineiras!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-07","dataVisitacao":"2023-06-01","comentario":"Io e mia moglie siamo saliti al Corcovado per visitare la statua del Cristo Redentore tramite Corcovado Rack Railway durante il primo giorno di visita alla città di Rio de Janeiro. Una volta in cima tutto è incredibile, la statua, la vista, la bellezza del luogo.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-06","dataVisitacao":"2023-05-01","comentario":"Visto de cima, o Rio de Janeiro é realmente a Cidade Maravilhosa. As vistas ssão deslumbrantes e de tirar o fôlego. uma boa pedida é ir próximo ao fim do dia para aproveitar o pôr do sol e a iluminação noturna do Cristo. Visita obrigatória a todos: turistas e moradores da cidade. Se puder, evite fins de semana e feriados, quando, por motivos óbvios, é mais cheio. E suba pelo trem, que está super moderno e confortável.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-06","dataVisitacao":"2023-05-01","comentario":"Lugar lindo,a vista panorâmica é de tirar o fôlego. \nSugiro evitar fins de semana e feriados,procure conhecer no início da semana.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-06","dataVisitacao":"2023-05-01","comentario":"Segunda visita después de muchos años. Fuimos un domingo y el lugar está superpoblado. Se realizan misas en domingo al pie del Cristo lo cual lo hace muy atractivo.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-06-06","dataVisitacao":"2023-04-01","comentario":"Eu adorei o trem do corcovado e depois a vista maravilhosa lá de cima do Cristo111 tudo muito lindo!!!!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-05","dataVisitacao":"2023-06-01","comentario":"Soñado.... subimos en Uber y bajamos en el tren. ;Muy bien señalizado, muy facil de realizar sin un tour a cargo. \nImperdible en la visita de Ro de Janeiro. La vista es algo impactante.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-04","dataVisitacao":"2023-05-01","comentario":"O restaurante, refeições e atendimento maravilhoso sem muita demora pra atender , tudo limpo e bem higienizado.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-06-02","dataVisitacao":"2023-05-01","comentario":"What can I say ? One of the wonders of the world . Beautiful and breathtaking views,we can see all Rio from there and is just amazing.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-31","dataVisitacao":"2023-03-01","comentario":"A subida até o Cristo Redentor é linda, suas paisagens até chegar lá é de muito verde. Subimos e descemos de bondinho é muito agradável !!\nQuando chegamos nos pés do Cristo é uma emoção tão grande e a energia de lá de cima é tão boa, que só indo mesmo para contar.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-31","dataVisitacao":"2023-05-01","comentario":"Visita e vista deslumbrante, tem uma energia esse lugar muito boa, visitei em dia de semana e estava cheio então, aquela foto que vc espera não vai rolar. De preferência ir de trenzinho para contemplar a paisagem. ótimo passeio para a família, casais e amigos. Super recomendo","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-31","dataVisitacao":"2023-05-01","comentario":"Amazing views. However I think I preferred the view from sugarloaf mountain \nTry and get up there early to avoid the crowds but definitely worth doing. There is also a little prayer room which is built into the statue which was unexpexted","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-31","dataVisitacao":"2022-12-01","comentario":"O Corcovado é um dos morros da cidade do Rio de Janeiro, célebre no Brasil e no mundo pela sua estátua do Cristo Redentor de 38 metros de altura. O Cristo Redentor é um dos principais símbolos do país e oferece uma privilegiada vista panorâmica da cidade do Rio de Janeiro.\nUma das sete maravilhas do Mundo.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-05-31","dataVisitacao":"2023-04-01","comentario":"Great views, great experience. Try to check the YouTube direct webcam called Paineiras Corcovado to see what are the cloud cover condition and at be don’t risk it if you see some coming … we came up for the sunset but just two minutes after we arrived on the top the cloud covered it all and we saw nothing for 30 minutes - haha … but we decided to wait , make sure to put something warm on you , especially if you go at the evening , I think if clouds arrives it can be also fresh during the day. Glad we waited , after 30 minutes the clouds opened up and we had the view , beautiful, everyone who waited were so happy. \n\nCame by the train which brings you up and choose to seat on the right side when goes up , there is a surprise view right at the end :-)","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-28","dataVisitacao":"2023-01-01","comentario":"The view from the top is unique; a must visit when in Rio. We took a guided tour and the train that is very convenient.   Weather is hard  but the view makes it worth it","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-28","dataVisitacao":"2023-05-01","comentario":"Chegue cedo, de preferência no primeiro horário se quiser garantir boas fotos! Quantos mais cedo menos pessoas para aparecer nas suas fotos kkkkkk","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-27","dataVisitacao":"2023-05-01","comentario":"Vista de tirar o fôlego e com certeza uma das sete maravilhas do mundo ! Emocionante pelo lado da fé e da vista !Tive o prazer de visitar o Cristo Redentor é tudo Maravilhoso.... Só quem vai, pode sentir e entender o que estou dizendo !! VALE À PENA","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-27","dataVisitacao":"2023-05-01","comentario":"Hike To Christ! Most amazing experience. Hike entrance is monitored by guards which made me feel more relaxed. Guards took passport number from 1 member off our party. The Hike itself is a steep incline but can’t stress enough how gratifying and phenomenal it feels to reach Christ ! Breathtaking ❤️","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-26","dataVisitacao":"2023-02-01","comentario":"We booked a private tour with Do Brazil Right. Our guide picked us up from the cruise port and we drove to Christ the Redeemer. This was definitely a good way to visit instead of doing it on your own. At Christ the Redeemer, our guide had tickets that enabled us to bypass the queue. We took the tram at the Corcovado Station. There were lots of tourists since this was Carnival, but we still managed to get some great photos. At the top there are shops and restaurants as well as a small chapel. I would recommend coming here.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-25","dataVisitacao":"2023-05-01","comentario":"Christus de Verlosser in Rio de Janeiro is een iconisch monument dat uitkijkt over de stad. Helaas moet ik zeggen dat mijn ervaring met deze bezienswaardigheid gemengde gevoelens oproept. Ik geef het 2 van de 5 sterren.\n\nTen eerste was het erg druk toen ik het monument bezocht, wat afbreuk deed aan de algehele ervaring. De lange wachtrijen en de drukte maakten het moeilijk om echt van de plek te genieten. Bovendien was er een merkbare leegstand in de directe omgeving, wat het gevoel van bedrijvigheid en levendigheid verminderde.\n\nHet uitzicht vanaf de top van het monument is echter wel mooi. Het panoramische zicht op Rio de Janeiro en de omliggende natuur is werkelijk prachtig. Ook raad ik zeker aan om het treintje naar boven te nemen, dit is eigenlijk het hoogtepunt van het bezoek.\n\nAl met al is Christus de Verlosser een aardige attractie in Rio de Janeiro vanwege het spectaculaire uitzicht. Echter, vanwege de drukte en de leegstand in de omgeving, kan het zijn dat je niet veel te beleven hebt buiten het bewonderen van het uitzicht.","companhia":"COUPLES","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2023-05-25","dataVisitacao":"2022-06-01","comentario":"O Cristo pra mim é um dos símbolos do Rio de Janeiro e do Brasil. O monumento, é uma das 7 maravilhas do mundo moderno e realmente é impressionante. Do alto do morro Corcovado, onde fica a estátua, têm-se uma vista privilegiada e belíssima do Rio. Para acesso, nos fomos de carro próprio, mas também há a opção de subir de trem (têm a estação Paineiras, onde têm um centro de informações ao turista, com loja de lembranças e lanchonete). A oportunidade é que o valor do ingresso podia ser um pouco mais acessível. Mesmo assim, é uma atração imperdível e que vale à pena. Recomendo!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-23","dataVisitacao":"2023-05-01","comentario":"Fue una experiencia muy bonita, realizar este tours, fuimos en grupo , muy bien coordinado, nos tomamos muchas fotos, es una,estatua imponente","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-22","dataVisitacao":"2023-05-01","comentario":"Eu adorei o local uma visão panorâmica de grande parte do estado com excelentes ambientes para um almoço  em família,com diversão  completa para toda a família","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-20","dataVisitacao":"2023-04-01","comentario":"Um lugar muito agradável para visitar, minha esposa e filhos ficarao felices  desejan voltar de novo...","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-19","dataVisitacao":"2023-05-01","comentario":"Es espectacular ! Todo… la vista, el Cristo, la brisa…. Muy recomendado. Deben estar preparados para convivir con mucha gente!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-17","dataVisitacao":"2023-05-01","comentario":"This is obviously a must do in Rio. We went twice as a part of tour groups. Once on the train and once by mini bus. It was good to do both ways but I think I preferred the train. The queues moved quickly and it’s a well oiled machine. There are queues to take photos at the top but you don’t need to wait in them to get a good shot. \nIt’s a once in a lifetime and very impressive.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-05-16","dataVisitacao":"2023-04-01","comentario":"This is one of the amazing things you just have to do in life.  Everyone has seen pictures from movies and TV though you simply cannot imagine until you've experienced it! I was in awe. Literally breath taking.\nSkip the line is the way to go. Even the tram ride up was a great experience","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-16","dataVisitacao":"2023-05-01","comentario":"Wow! A must see if you are in Rio. We took the little train all the way to the top, the whole process was super easy and quick. Views at the top are amazing. We went on a Sunday and they had a service with people singing. A truly unique experience.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-16","dataVisitacao":"2023-05-01","comentario":"É muito lindo, apesar de cheio.  \nA visão de cima é maravilhosa!!\nGostei do esclarecimento sobre o tempo e a possibilidade de não subir (devido a neblina).\nVale a pena conhecer!!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-16","dataVisitacao":"2023-05-01","comentario":"Fuimos en auto y lo dejamos en la entrada de la Parroquia del Cristo redentor y caminamos hasta el tren unos 10 minutos la entrada costos algo de 90 reales. A las 9. \n de la mañana no habia mucha gente, pero el tren salio casi lleno. Pasa una cada media hora. Cuando llegamos arriba justo habia una nube y no se veia para abajo, pero afortunadamente paso rapida y la vista era esplendida. El paseo por la selva en el tren que dura unos 20 minutos fue muy interesante","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-05-12","dataVisitacao":"2023-05-01","comentario":"Quedamos felices con nuestra primera experiencia, la guía fue muy amable y nos dejó con mucho conocimiento de acuerdo a los lugares turísticos, totalmente recomendable para un futuro próximo y es totalmente una parada obligatoria si vienes a este país.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-08","dataVisitacao":"2022-08-01","comentario":"Uma excelente viagem tudo muito lindo gostei de mais a fista lá de cima simplesmente maravilhosa chega da um frio na barriga!!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-07","dataVisitacao":"2023-05-01","comentario":"Tren ile çıkmam zevkliydi. Dakat yukarıda malesef heryer sisle kaplıydı. Manzara gözükmüyordu. İsa Heykeli de zar zor görülüyordu. İnsanlar sisin biraz açılmasını bekleyerek fotoğraf çekmeye çalışıyordu. Bizde öyle yapmak zorunda kaldık. Kişi başı 117  BR ödedik. Fakat malesef sis dolayısı ile tam olarak tadını çıkaramadık. Bilet almadan önce dönenleri görürseniz sis olup olmadığınj sormanızı tavsiye ederim.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-06","dataVisitacao":"2023-02-01","comentario":"Until you are it up close you do not realize the size of it . We woke up early to see the status as we sailed in on our cruise ship.  You could see it from a long way out and it was visible on most of our tour around the city. We had a short wait for the ride up but we had priory passes which was a great idea. We took the lift up and yes it was crowed but it is always busy. We got photos managed a peek in to the chapel at the base but could not go in as a baptism was in progress. It really is a must see and should be noted as a modern wonder of the world.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-06","dataVisitacao":"2023-05-01","comentario":"Fue un paseo muy agradable y bonito, se recomienda visitar en familia.\nEl guia Warley nos dirigió muy bien y nos enseño cosas muy interesantes de la historia de la constuccion del Cristo, nosotros somos chilenos y nos explico todo en perfecto español.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-05","dataVisitacao":"2023-01-01","comentario":"Uma dos lugares mais lindos que já visitei. Vale muito a pena! Passeio surpreendente com uma vista incrível. Recomendo.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-03","dataVisitacao":"2023-04-01","comentario":"Voir le Christ de la ville est déjà incroyable mais se retrouver à ses pieds et complètement dingue. \nLa vue de la ville est incroyable et les phots à faire sur place sont splendides.\nUne merveille du monde , tout simplement.\nTous les moyens sont bon pour monter: à pieds, en train, en transports en commun, hélicoptère ....  Mais dans tous les cas privilégiez la visite le matin.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-03","dataVisitacao":"2023-05-01","comentario":"Vale la pena subir a conocer. Es lindo hacer el recorrido en el tren. Asegúrense de visitarlo un día soleado. Es un monumento aseado y en buen estado. Nosotros vinimos entre semana y no estuvo tan lleno.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-05-03","dataVisitacao":"2023-04-01","comentario":"Uma vista inesquecível!!\nPodemos ver todo o Rio de Janeiro.\nEstava nublado mas dava para ver bem!!!\nEm um minuto que descemos para um cafe, voltamos e não tinha mais vista!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-02","dataVisitacao":"2023-02-01","comentario":"Lugar fantástico natureza exuberante pessoas simpáticas, a grandiosidade do cristo diante da criação de Deus é incomensurável um show, experiência unica, já estive em vários lugares do mundo, mas o sagrado presente naquele lugar é incomparável.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-02","dataVisitacao":"2023-03-01","comentario":"La emoción al subir y ya encontrarse con el Cristo es incomparable nuestro guía nos dio los consejos de donde sentarnos en el tren y hasta nos to mo Fitos , un verdadero guía turístico","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-05-01","dataVisitacao":"2023-05-01","comentario":"Lieu magnifique avec des points de vus superbe mais à faire très tôt dès l’ouverture pour éviter la foule.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-30","dataVisitacao":"2023-04-01","comentario":"Visita fundamental en Rio. Nos encanto. La excursionde Civitatis con \" Miniguia\" es genial. Volveremos.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-27","dataVisitacao":"2023-04-01","comentario":"Emocionante, um lugar incrível, uma vista maravilhosa do Rio, vale cada segundo, fomos de van q saiu do lado do hotel e tudo muito tranquilo e rápido, tudo por menos de 100,00","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-26","dataVisitacao":"2023-04-01","comentario":"La vista es hermosa y tomarse una foto con el cristo es casi obligatorio, pero mucha gente, casi no se puede caminar. Totalmente recomendable subir por el tren panoramico y no por ban, pero a armarse de paciencia porque uno se demora mas por las esperas","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-04-26","dataVisitacao":"2023-04-01","comentario":"Super organizado, limpo, lindo! Atendentes orientados e bondinhos lindos! O espaço esta super restaurado e tudo bem dividido! La em cima tbm tem placas e orientações para tudo ! Pessoal atencioso, banheiros limpos !","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-24","dataVisitacao":"2023-04-01","comentario":"Falar o que de um dos pontos turísticos mais lindos do mundo!? Local de paz e contemplação. Não estava cheio e foi tudo perfeito.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-22","dataVisitacao":"2023-04-01","comentario":"Nunca vi uma fila tão grande para subir e descer no Cristo Redentor. Não tem opção. Subiu de trem, tem que descer de trem. São horas na fila. Esteja preparado","companhia":"COUPLES","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2023-04-19","dataVisitacao":"2023-04-01","comentario":"Una visita obligada en Río de Janeiro. Fuimos con el trencito cuesta 120 reales por persona y la visita dura aproximadamente 4/5 horas. No ir un día nublado porque no salen las fotos.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-18","dataVisitacao":"2023-03-01","comentario":"With our lovely tour guide we arrived to see Christ the Redeemer site before the crowds and with clear skies, allowing for great views of the statue and surrounding area.   The entire trip, including the train ride to and from the mountain, was amazing, beautiful and spiritual.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-18","dataVisitacao":"2023-04-01","comentario":"Es un punto emblemático y estar ahí es realmente impresionante, la vista es imponente y se ve Rio en toda su extensión. El paseo no es perfecto, está muy muy lleno y es muy difícil sacar alguna foto sin tener gente encima, pero al ser un lugar tan icónico, aún así vale la visita.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-17","dataVisitacao":"2023-04-01","comentario":"I came here as a solo traveller and hiked to see the Christ with with my boyfriend I met in Rio and it was his first time too. I must say that it was an amazing experience. I had unknown appendicitis during this hike and managed to hike it absolutely fine and it was safe from any muggings (in our experience). We had to paid 25 Reias each at the top, but honestly it is well worth the hike to see the christ. It took us 1.5 hours each way. The Christ was beautiful and huge!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-16","dataVisitacao":"2023-04-01","comentario":"La vista es hermosa, el tren, el Cristo. Todo es verdaderamente fantástico.\nRecomendación de ver el estado del tiempo antes de subir porque si está nublado no quedan bonitas las fotos.\nLos tickets se pueden comprar por internet, pero si llueve no cambian fechas.\nEs importante ir temprano para no hacer tanta fila.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-14","dataVisitacao":"2023-04-01","comentario":"Sin lugar a dudas la estatua del Cristo Redentor es una de las visitas mandatorias si estas en Rio de Janeiro, los que nadie nos dijo (ni siquiera el tour operador) es que con lluvia hay neblina y la visibilidad es cero.\nCompramos un paquete para 4 con tiempo pero no tenia cancelación y no se podia mover la fecha, asi que las opciones eran perder el dinero pagado o subir y a probar suerte con la visibilidad.\nEl ascenso en tren es interesante no lo voy a negar, pero al llegar a la estatua solo podiamos ver un poco de la base y cero visibilidad a la ciudad y los alrededores. Eso fue decepcionante y obviamente de saber este riesgo con anterioridad lo hubieramos pensado mejor. La lluvia no es el problema de hecho fuimos a otros lugares y eso no nos detuvo, el problema es la neblina que se genera y la poca o nula visibilidad que habia.\nMe parece que los tour operadores deberian ser mas claros en esto y a la vez tener flexibilidad en devolución o cambio de fechas cuando hay neblina. La única información previa que nos dieron es que en fechas feriadas es una atracción que se agota y hay que comprar con anticipación.","companhia":"NONE","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2023-04-12","dataVisitacao":"2023-03-01","comentario":"Hermosa una vista fabulosa volvería muchas veces lo pasamos muy bien nos llovió al estar en el cristo pero igual fue fantástica la subida al cristo","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-12","dataVisitacao":"2023-03-01","comentario":"Do not miss this tour. Go early in the day before the Criuse Ship crowds get there. Also it seems to get foggy in the afternoon. The tram ride up the Mountain is fun too! Excellent views of Rio.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-10","dataVisitacao":"2023-03-01","comentario":"We took the local bus to Cosme Velho from Copa Cobana which took approximately 30 minutes and cost us about 75p each.  The train at Corcovado station cost us about £15 each return and we didn’t book in advance. Large queues for the train at 11am but the ride up and down was very enjoyable with some great views along the way and took approximately 40 minutes.  We had a clear day and subsequently had great views from the top and many iconic photos were taken. An incredible and moving experience that must be done when visiting Rio. Very commercialised and busy, but worth the trip.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-04-09","dataVisitacao":"2022-08-01","comentario":"Nunca pensé cumpliría el sueño de visitar esta increíble belleza, desde nuestro ascenso y hasta el regreso son fascinantes, tantas culturas, tantos paises y todo bien definido y claro con respecto al tour hacen de tu visita una experiencia única.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-09","dataVisitacao":"2023-04-01","comentario":"Wow!!! What a monument. We took an Uber to the train station and then took the train. Try to go early in the morning before tour buses start arriving. \nThe day we went , it was cloudy but still beautiful","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-08","dataVisitacao":"2023-03-01","comentario":"Fuimos 3 amigas desde Copacabana en Uber (funciona muy bien en Brasil), una vez en la base, compramos las entradas, no había mucha gente (un viernes de marzo 2023 a las 14 hs), el precio de las entradas era de 90 reales aproximadamente, allí subis a un tren que te lleva hasta el cristo, cuando bajas del terncito tenes varias escaleras, pero hay escaleras mecánicas si vas con gente mayor.\nLa vista es increíble para donde mires, vale la pena el paseo, en total tardamos unas 2 hs y estuvo perfecto. \nTener en cuenta: cuando llegas te van a ofrecer subir en combis, no lo recomiendo.\nA veces hay viento arriba, ojo que se vuelan las gorras!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-08","dataVisitacao":"2023-03-01","comentario":"Maravilhoso, emocionante e organizado. \nSugiro ir de trem (trem do corcovado), viagem linda, rápida e na estação tem vários taxis pra ir embora.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-07","dataVisitacao":"2023-03-01","comentario":"To get to the top of Corcovado, you take an enjoyable ride on a rack railway.  The statue of Christ the Redeemer atop Corcovado is impressive.  It was struck by lightning last month and I saw a workman repairing the damage.  There were clouds moving in and out around the mountain, which played hide and seek with the views.  When the clouds cleared, there were some magnificent views.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-07","dataVisitacao":"2023-03-01","comentario":"Spectacular! Best to wait for a clear day. My earlier review included contact information for the daily van transfers to/from Corcovado, but it got flagged as promotional. Since it is run by Tijuca National Park, I thought it was OK. The point is that there are convenient ways to schedule your visit to Cristo Redentor the same day. We waited for a beautiful day, bought our tickets online and took the next available van (they run every 30 minutes) up the mountain. We spent as much time as we wanted up there, then caught the next van back down. Very convenient and great value.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-07","dataVisitacao":"2022-12-01","comentario":"Lieu incontournable de Rio mais malheureusement très visité. J'y suis allée 2 fois : une fois avec du brouillard et une autre en plein soleil, les 2 fois Magnifiques, à faire absolument même s'il y a beaucoup de monde. Si possible se renseigner pour savoir quand est-ce que l'affluence est moindre..... Très bon souvenir.\nPrévoir 1 bonne heure pour bien se promener là-haut....","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-05","dataVisitacao":"2023-04-01","comentario":"....a visita fala por si... fantástico! Vale a pena visitar! Cenário com incrível atmosfera... encantador!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-04","dataVisitacao":"2023-04-01","comentario":"Yes the pure thrill of visiting the statue after looking up at it from our hotel. We went late afternoon and the crowds were thin. No queues , Some light clouds that blew around but we were still able to see the city below. A quiet time in the small chapel was peaceful.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-03","dataVisitacao":"2023-04-01","comentario":"1) Visit on a clear day before 2pm. Afternoons more cloud cover.\n2) Don't use the touts who are outside the train station.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-04-01","dataVisitacao":"2023-03-01","comentario":"la vista panorámica es única quede impactado y la sensación de estar ahí es increíble 100% recomendado vale la pena cada dólar gastado :)","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-31","dataVisitacao":"2023-03-01","comentario":"Segunda vez que lo visitamos. Siempre mágico saludando/cuidando a la ciudad de Rio. Vistas imprecionantes, se ve practicamente todo. Sol a pleno, llevar mucha agua y sombreros. Llegamos en cole desde Copacabana, nos deja en la entrada.....pagamos el trencito (gracias a los niños pasamos preferenciales, sino muchisima gente), pagamos 117R por adulto y 60R el niño (no recuerdo bien ese monto), el dolar lo tomaron a 4.5R. Volvimos en el mismo cole nomás que bajamos en el parque del Lago y en el Botánico, línea 583 ida y vuelta,  costando 4.3R cada pasaje","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-03-31","dataVisitacao":"2023-02-01","comentario":"Tiene una vista incomparable desde arriba y es impactante el Cristo en si.Realmente emociona.Desde arriba se ve el estadio Maracana y el Pan de azucar.Se ve la bahia en toda su dimension .El tren,para el ascenso es muy moderno","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-29","dataVisitacao":"2023-03-01","comentario":"O Cristo como si só é um espetáculo a parte, mas tivemos sorte de pegar um dia sem nenhuma nuvem no céu, um espetáculo. Senti falta de mais lugares para sentar e tomar uma água.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-03-28","dataVisitacao":"2023-03-01","comentario":"sin lugar a dudas es una de las tracciones que no se puede dejar de hacer estando en rio, vistas inmejorables, muchisimo calor, muchisima gente, y no es tan grande o por lo menos con la gente q hay se hace dificil las fotos si es que uno quiere disfrutarlo mas tranquilo, otro lugar imposible e no visitar.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-27","dataVisitacao":"2023-03-01","comentario":"Esta todo muy mal organizado. La espera es tremenda. Hay gente que está horas al rato del sol. En mi caso puntual, tengo una discapacidad y el trato fue excelente y me dieron prioridad en todos lados. Quiero destacar a Joao y Rafael, que hicieron todo muy ameno. Pero si no era el caso, la cola era kilométrica. Es un mundo de gente, lo que hace que sea imposible de disfrutar. Las 2 veces que fui el calor era agobiante y en el tren no había aire. Si bien la estatua es interesante, la vista no me pareció la gran cosa. Es muy alto y no se llega a apreciar Río como en el pan de azúcar que a mi entender es mucho mejor.","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2023-03-26","dataVisitacao":"2023-03-01","comentario":"An indescribable experience. No wonder is one of the seven wonders of the world. Pictures will never be able to describe it.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-22","dataVisitacao":"2023-03-01","comentario":"Organisation plus que douteuse ! Un lieu en tension… fort désagréable… et sans grand intérêt. Sur la plateforme sur-encombrée, il peut être dangereux de se mouvoir !… les scènes les plus ridicules sont communes … un haut lieu du tourisme de masse …","companhia":"FRIENDS","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2023-03-21","dataVisitacao":"2023-01-01","comentario":"Es una estatua que impresiona, me encantó el paseo en tren para poder subir. Desde arriba la vista es impresionante. Lo único malo es la cantidad de gente, todos sacando fotos, a todas horas repleto de gente.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-20","dataVisitacao":"2023-01-01","comentario":"La verdad, toda la experiencia es muy complicada, en tantos tramos y con tantos traslados, parace diseñada solo para cobrar todo por separado y que la expriencia sea costosa sin que lo valga. Una lástima que esté administrado de esta manera. Lleva muchísimo tiempo.","companhia":"NONE","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2023-03-19","dataVisitacao":"2023-03-01","comentario":"A true land mark and after travelling so far it was definitely on our to do list . Slightly cloudy the time we went so no long queue  & not so crowded around the statue , some photos taken  as cloud cover moved as we were there . Glad we did it but felt we got a more enjoyable experience doing Sugar Loaf .","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-03-19","dataVisitacao":"2023-03-01","comentario":"Visiting the Corcovado attraction was the highlight of our Rio visit. Seeing the statue up close was breathtaking. The views of Rio from the top of the mountain were exceptional. I recommend taking the red train as the ride is also memorable. Best to go in the morning when it is cooler and lines are less","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-18","dataVisitacao":"2023-03-01","comentario":"Quando for ao Rio não pode deixar de ir ao Cristo. Vale a visita. Tem local para lanche e compra de lembranças.\nVoltaria outras vezes.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-17","dataVisitacao":"2023-03-01","comentario":"Hola , estoy en Rio de Janeiro parando en la zona de Barra de Tijuca. Quiero ir a visitar el cristo redentor. En que me recomiendan ir desde barra de tijuca?","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-13","dataVisitacao":"2023-02-01","comentario":"Excellent views from the top.  Enjoyed the train ride through the jungle.  Tip:  After departing the train, take the stairs, if able, as there is a long wait for the elevator.  Visit later in the day for less crowds.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-13","dataVisitacao":"2023-03-01","comentario":"I’m not the religious type but when in Rio this is a must. The views were not great as there was fog but that’s the chance you take. It felt very crowded at the top and almost annoying as everyone tried to get a cool picture. Instead go to the back or the path less travelled. There are some quiet spots but you need to find them. You may also want to avoid the elevator and walk up if you can handle the stairs after the tram up.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-03-13","dataVisitacao":"2023-02-01","comentario":"As one on the wonders of the world I would say it is just outstanding, it's a long way up and very hilly you need to go by car or minibus to far to walk very busy when there and the views are spectacular well worth a visit","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-13","dataVisitacao":"2023-03-01","comentario":"Even though we got there early and our guide allowed us to skip the lines - it was still fairly crowded but well worth the visit.  The views from the top were amazing!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-13","dataVisitacao":"2023-03-01","comentario":"Un buen recorrido que se puede sumar a más recorridos del mismo día sin prisas est a 860 metros de laura u vale mucho la pena no puedes dejar de ir  a este emblemático lugar.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-11","dataVisitacao":"2023-02-01","comentario":"Es parte de cualquier visita a Río, el ascenso en un tren por entre la reserva natural del Parque de Tijuca es también interesante. Luego en la cima puedes elegir subir una escalera de 213 escalones o esperar uno de los tres ascensores para 8 personas haciendo la cola, de todas formas 10 minutos alcanzan para ver la majestuosa vista, tomarte una foto y fotografiar al Cristo. Un imperdible, alcanza una vez.","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-03-11","dataVisitacao":"2023-03-01","comentario":"recomiendo desayunar liviano, ya que hay muchas curvas de ida y de vuelta al cristo. Podrias descomponerte como yo","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-11","dataVisitacao":"2023-03-01","comentario":"Espectacular! Imponente! Recomendable llevar protector y gorrito por le sol. \nLas vistas son inigualables","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-11","dataVisitacao":"2022-11-01","comentario":"The weather was overcast so from time to time the statue was surrounded by clouds. This made the clear moments even better!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-10","dataVisitacao":"2023-03-01","comentario":"Fomos visitar o Cristo no dia 06/03 e a nossa experiência foi linda! Contratamos um guia (Marco da CityTour Rio) para nos acompanhar. O Cristo abre as 7:20h da manhã. Recomendo chegarem as 7h la pra entrar na fila. O guia que comprou nossos ingressos. Tudo bem organizado. Tinha bastante gente mas estava bem tranquilo. Conseguimos bater umas fotos sem ninguém aparecer hahaha. É um monumento deslumbrante. Recomendo que se organizem para não pegar grandes filas e muitas pessoas ao mesmo tempo. Ahhh… e atrás do Cristo tem uma capela linda!!!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-09","dataVisitacao":"2023-03-01","comentario":"You won’t need too long here, but great to see it. We did it quite early in the morning and it was quiet and temperature good.  On a scorching day it would be very hot up there. Well organised.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-08","dataVisitacao":"2023-03-01","comentario":"O lugar é o mais famoso do Rio e entendo que quem vai ao Rio deve visita-lo. Vale a visita, o Cristo Redentor é uma construção magnífica e a vista lá de cima é um espetáculo à parte.\nPorém o acesso não é fácil como parece.\nDe carro, só vale ir se for em dias tranquilos como no meio de semana, e ainda assim é estresse. NÃO TEM ONDE ESTACIONAR, e o turista é obrigado a deixar o carro literalmente pelo caminho. Esqueça Uber, porque celular raramente pega e os Uber não querem subir.\nSe conseguir o concorrido bondinho, ok. Mas vai gastar pra chegar até o ponto de partida do bonde. Van é uma opção, mas se esta for a escolha do turista, melhor comprar um passeio no hotel, com saída e retorno pro hotel.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-03-08","dataVisitacao":"2022-10-01","comentario":"2,400 feet above the city stands the 125 foot tall statue of Christ the Redeemer. The Christ statue, that embraces the entire city, is designated as one of the seven “New Wonders of the World”. See the thrilling 360 degree sweeping view of the city and understand why Rio is known as one of the most beautiful cities in the world. I wish people spend less time lining up for a selfie with the Christ and enjoy the view from top of the mountain.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-07","dataVisitacao":"2023-03-01","comentario":"Indescritível a sensação de conhecer uma das maravilhas do mundo, gostei tanto que fui duas vezes e iria mais vezes ❤️","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-06","dataVisitacao":"2023-01-01","comentario":"Jedno z tych miejsc , które warto raz w życiu odwiedzić .główną atrakcją jest oczywiście pomnik z kaplica w środku , ale największe wrażenie robi widok na Rio de Janeiro.\nMożna tu dostać się na kilka sposobów , zabytkowa kolejką torową dość droga i czas oczekiwania to ponad godzinę , lub busem także nie tania opcja , lub na pieszo .","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-06","dataVisitacao":"2022-05-01","comentario":"Not enough words can do this eight wonder of the world justice.\n\nIt is as good if not better than I hoped.\n\nWeather can be unpredictable","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-06","dataVisitacao":"2023-02-01","comentario":"War sehr schön den weltbekannten Christus über Rio selbst zu sehen, jedoch sind die Menschenmassen auch gewaltig die da hinpilgern.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-03-06","dataVisitacao":"2023-02-01","comentario":"El título lo dice todo, un sitio turístico, sin inclusión, pesimo servicio, no deja de ser increíble, pero familiar no es.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-03-06","dataVisitacao":"2023-01-01","comentario":"no se puede ir a Rio sin visitar el Cristo, es emocionante, tratar de ir dias despejados, sin nubosidad, se recomienda sacar los tickets por la web para evitar demoras, dejar el vehiculo a unas cuadras o llegar en uber","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-06","dataVisitacao":"2023-01-01","comentario":"Es muy lindo lugar, todo organizado y con escaleras mecánicas. De abajo te decian que no se veia muy bien, pero subimos igual y se vio perfecto!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-06","dataVisitacao":"2023-03-01","comentario":"A visualização é incrível, espetacular e mostra como a cidade realmente é maravilhosa.  Falta um pouco de estrutura melhor e organização devido a quantidade de pessoas   como banheiro,  lanchonetes, áreas de descanso.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-03-05","dataVisitacao":"2023-03-01","comentario":"irrelevant of your religion this is an absolute must to visit. The views ar stunning, and one cannot fail to be impressed with the statue.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-05","dataVisitacao":"2023-02-01","comentario":"Feb 2023 was my second time. Totally amazing experience. The first time I went I went in a small bus with about 25 people. The second time I went up using the train. I would say that either of the two forms of transportation is fine.  There are elevators if you can't go up many steps. The people, like everywhere in brazil are friendly and helpful. The views are amazing!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-04","dataVisitacao":"2023-03-01","comentario":"Excelente!! Há alguns anos não visitava, fomos em janeiro e o deslumbramento se refez!! Simplesmente impecável! Vontade de voltar logo!!!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-02","dataVisitacao":"2023-03-01","comentario":"Es lindo el Cristo pero la cantidad de gente, y subir con niños no es tan buena opción. La verdad es que la vista es muy linda y el camino hacia el cristo es bello. Lamentablemente en Brasil manejan muy rápido y el camino es un lugar lleno de curvas. La verdad es que no creo que sea un paseo para ir con niños.","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-03-02","dataVisitacao":"2023-02-01","comentario":"The Christ was awesome to see, very impressive! The views were great of the surrounding areas so best to go on a clear day. It is kind of crowded, just be ready for that. Must see!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-02","dataVisitacao":"2023-01-01","comentario":"A very busy place with fabulous views and an iconic landmark.  Get the Skip the Queue tickets otherwise a long wait for the train ride.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-03-01","dataVisitacao":"2022-03-01","comentario":"Não adquirimos o ingresso antes e isso foi um problema, porque embora o local seja organizado, a espera foi grande. Por isso, adquira antes seu ingresso se quiser otimizar o tempo. Ainda assim, havia banheiro no local e conseguimos administrar a espera com as crianças. A subida de trenzinho/bonde foi bem tranquila e muito gostosa, no meio da natureza (vista incrível). A subida pro Cristo também é organizada e a vista fenomenal, mas muito cheio quando visitamos. Mal conseguimos tirar fotos em família! Ainda assim, valeu a pena!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-03-01","dataVisitacao":"2023-02-01","comentario":"Não há estrutura. Somente 1 lanchonete com pouquíssimas opções, preço alto e qualidade razoável. Poucos banheiros disponíveis. Tive a impressão de descaso . Um lugar dito como a 7° maravilha do mundo , decepção.","companhia":"FAMILY","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2023-02-28","dataVisitacao":"2023-02-01","comentario":"Não era plano subir o morro para ver o Cristo de perto, mas minha filha nos pediu para ir. \n\nUma pena que a plataforma estava fechada (não houve qualquer alerta sobre isso e não ficamos sabendo o porquê).","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-02-26","dataVisitacao":"2022-12-01","comentario":"Paisagem deslumbrante! Passeio único. Cidade maravilhosa! Pena é... Mas a vista sob a baía e tudo o resto que só se vê in loco, merecem a visita.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-25","dataVisitacao":"2022-11-01","comentario":"You can get to the top of Corcovado in 3 different ways: by car (I saw Tijuca Park buses), by train or on foot (asphalt road or forest trail from Lage Park).  \n\nIn my opinion, the place is overrated, overcrowded and overpriced. Even if you choose to go up on foot, you will still pay for the opportunity to get to the top, although of course less. There were 2 different prices for people coming on foot, depend on season - 53,50R$ or 29,50R$. Of course using Tijuca Oark buses or train or private tour cost much more. \n\nIf you really care about visiting the monument or as a believer you want to look into the chapel, you do not regret money and at the same time you are ready to wait a long time (like ages...) to take a good photo - this is the place for you.  However, if you expect something more, you will be disappointed. The view is good, but just good - on many different places in Tijuca Park you will see similar views. Also, Corcovado very often is hidden in the clouds (this is a tip if you buy your ticket in advance).  \n\nI went to Corcovado on the hiking trail from Lage Park (comfortable sturdy shoes and a supply of water are a must), reached the top, took a few photos and walked back along the hiking trail towards the Prymasa Waterfall.  The trip itself gave me more impressions than staying at the top. The amount of people was overwhelming","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-02-25","dataVisitacao":"2023-02-01","comentario":"sem dúvida é maravilhoso estar no topo do Corcovado. Indescritível. Paisagem maravilhosa e a sensação única! Com crianças, esteja preparado para segura-las e ficar sempre atento a seus movimentos. Leve bebida e comida na mochila para as crianças. O trem leva uns 25 minutos para ir e outro tanto igual na volta. Vale muito à pena.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-25","dataVisitacao":"2023-02-01","comentario":"On the first day we tried to see the Christ twice, but the foggy weather wasn’t allowing us to even see his toes. Finally we were told to check before their live camera no YouTube.\n\nWe decided to try to go there again on the following day, as the weather was clear. As soon as we arrived we noticed a HUGE queue for the train, and some guys approached us offering tickets for the van (to skip the queue and go see the Christ straight away). They charged us 70 reais per person, and we waited until the van was full for it to leave.\n\nHowever it didn’t stop at the top, it stopped halfway and another seller told us that if we wanted to reach to the top we would need to pay another 130 reais per person! We felt scammed!!! \n\nThe place was also so packed that it was impossible to take a nice pic of the Christ or the view.\n\nI am Brazilian and I have been there a few times before - it used to be very cheap, and at some point you could even drive to the top yourself.\n\nBe careful with the scammers and look at the live camera before planning your visit!","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-02-24","dataVisitacao":"2023-02-01","comentario":"This is really something you should do in Rio but it is so commercial, so crowded, and frankly a little obscene, if you are expecting some kind of religious destination (what colour flocked Jesus statue do you want?).  The views of the city are spectacular, though.","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-02-22","dataVisitacao":"2023-02-01","comentario":"It’s nice place , very well surroundings great landscapes, but hard to believe it’s one of the wonder of the world , as long you haven’t seen others but when you have idea of others .","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-02-22","dataVisitacao":"2023-01-01","comentario":"hermoso mirador, si el clima lo permite, pero es solo eso lamento. muy bonita vista, pero seria bueno agregar algo arriba para que la gente se quede mas tiempo.","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-02-22","dataVisitacao":"2023-02-01","comentario":"Train trip up through local vegetation then viewing this amazing statue!  It does get very crowded so go early and consider a helicopter ride for a birds eye view!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-21","dataVisitacao":"2023-01-01","comentario":"Vista linda, porém haviam muitas pessoas, no dia em que fomos estava um pouco tumultuado, de qualquer forma é um passeio que vale a pena","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-02-21","dataVisitacao":"2023-02-01","comentario":"Si vas para Río, debes visitar esta atracción, sin embargo debes tener en cuenta que donde está el Cristo hay mucha mucha gente y será difícil tomar alguna foto sin gente paseando junto a ti.\n\nEn la mañana es cuando más gente va, entiendo porque las agencias de tour planifican sus tiempos de esa forma. Nosotros salimos desde Copacabana hacia el Cristo en la tarde (15:00 hrs) y encuentro que fue lo mejor, todo esto a comienzo de Febrero. No tuvimos que hacer filas pero si había bastante gente en la base del Cristo, pero menos que otras veces que he ido en horario de alta concurrencia.\n\nPara la paseo, fuimos a contratar la visita en una plaza de Copacabana que se llama “Plaza do Lodo” donde hay una boletería entiendo oficial para este tour. Sin embargo afuera de la plaza un Taxi que se especializaba en este tour nos ofreció llevarnos a nosotros solos como familia (éramos 6) y así evitaríamos tener que estar pendiente de otras personas cuando vas en grupo. Creo que también fue buena opción, porque nosotros manejamos los tiempos y además nos llevó a otros miradores que quedan camino al Cristo. \n\nEn total pagamos aprox 110 reales por persona (traslado y entrada incluida) y estuvimos aprox 3-4 horas con todo el recorrido.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-20","dataVisitacao":"2023-02-01","comentario":"Emocionante. A subida de trem é muito superior à das vans. Muito mais bucólica e com contato com a Natureza. Torça para o trem parar para uma família de bichinhos atravessar os trilhos. É bem legal.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-20","dataVisitacao":"2023-02-01","comentario":"Corcovado is a hightlight of Rio. I advise you to go by taxi, without a tour. Many people. The excursion can make the visit much more expensive.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-02-18","dataVisitacao":"2023-02-01","comentario":"Très célèbre dans le monde entier, il attire les foules, qui se pressent pour prendre des photos souvenirs…\nFacilement accessible par un petit train, il suffit de faire la queue. \nVues magnifiques à 360°.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-17","dataVisitacao":"2023-02-01","comentario":"Es un experiencia probablemente única en la vida, no se puede dejar pasar, es imponente, uno se queda horas mirando esa maravilla y sobre todo donde esta ubicada","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-02-16","dataVisitacao":"2022-03-01","comentario":"Cannot be missing on your tourist list once you visit Rio de Janeiro. Not cheap if you visit with the whole family.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-16","dataVisitacao":"2023-02-01","comentario":"Una de tantas maravillas del mundo para conocer. Muy linda vista. Un imperdible en RIO DE JANEIRO !!!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-15","dataVisitacao":"2023-02-01","comentario":"Une super visite, la statue du Christ est impressionnante. Je conseil fortement d'y aller tot le matin l'après-midi il y a énormément de monde ! Le train pour y accéder est charmant","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-14","dataVisitacao":"2023-02-01","comentario":"Fuimos un día Lunes alrededor de las 11 am. el valor de la entrada+tren es de $R93 p.p, los niños pagan la mitad.\nEl clima estuvo muy bueno, pero el calor era insoportable y la cantidad de gente era mucha para poder disfrutar tranquilamente.\nlas fotografías eran difíciles de sacar, por la cantidad de personas, pero eso no quita lo genial del tour. El viaje en tren muy bueno.\nrecomiendo llevar mucha agua, y si va con niños pequeños se dificulta un poco por la excesiva cantidad de personas.\nel recinto cuenta con ascensores y escaleras mecanicas.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-02-14","dataVisitacao":"2023-02-01","comentario":"Es imponente, sus dimensiones y su ubicación, si bien tuvimos un día nublado, por momentos nos permitió ver  y sus vistas son incomparables.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-13","dataVisitacao":"2022-12-01","comentario":"Sacamos la entrada por su pagina oficial. Luego hay que imprimir los voucher y se canjean en la boleteria por las entradas. \nRecomiendo sacar la entrada mirando el pronostico ya que si llueve se arruina mucho la excursion. Nosotros la sacamos para hacerla el ultimo dia ya que fue el que no llovio de los 4 dias que estuvimos en Rio. La sacamos para subir con el tren panoramico. Cuando llegamos nos dijeron que no salia el tren porque se habia caido un arbol en las vias por las lluvias. Que podiamos subir en combis pero decidimos esperar. Esperamos una hora y media aprox y comenzo a salir el tren. Es un tren panoramico hermoso. Cuando llegamos luego de 20 minutos aprox subimos unas escaleras y vimos el Cristo. A mi me gusto mucho. Era del tamaño que esperaba. Desde ahi hay unas vistas hermosas de Rio. Nos quedamos todo el tiempo que quisimos porque fuimos por nuestra cuenta. Fuimos a la mañana. No habia nubes bajas que taparan al Cristo. Estaba nublado por suerte porque con mucho sol y calor no se si se aguanta mucho tiempo ahi arriba. Luego tomamos el tren de regreso y compramos las fotos que nos sacaron antes de subir al tren que son muy lindas.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-12","dataVisitacao":"2023-02-01","comentario":"Sentí que El Cristo Redentor nos acoge a todos en su grandioso corazón. Es una obra emblemática digna de ver pot todos los que visiten Rio Janeiro. Me encantó que en una pequeña capilla allí se celebre la misa","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-12","dataVisitacao":"2022-12-01","comentario":"Αξίζει να πάτε με το τραμ και όχι με τα βαν ,με το τραμ περιλαμβάνεται το εισητηριο για το άγαλμα ενώ με τα βαν όχι ,αλλά δεν στο λένε ,μακρυά από τα βαν ,σας το λέω εγώ που την έπαθα !!(youtuber)","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-12","dataVisitacao":"2022-10-01","comentario":"Eine traumhafte Sicht über Rio de Janeiro. Leider ist der öffentliche Zugang sehr eingeschränkt. Eine Seilbahn würde auch hier die Probleme lösen.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-02-12","dataVisitacao":"2022-09-01","comentario":"Bellissimo una grande emozione\nDa qui si vede tutta la baia, un spettacolare unico,si prende un trenino che attraversa ka foresta per arrivare al primo stop,poi con l'ascensore si sale per l'ultimo pezzo\nLa statua è imponente e domina tutta Rio","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-11","dataVisitacao":"2023-01-01","comentario":"I recommend booking tickets on tremdocorcovado.rio.  I booked Sunday tickets for 15:00 on the day.  We arrived 30 minutes early and there was no queue.  Spectacular and comfortable train ride to the top.\nWatch out for high asking price of official photos (available before the return journey). You can haggle!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-10","dataVisitacao":"2023-02-01","comentario":"Parada obligatoria. Recomiendo ir temprano de un día soleado (Tipo 09:00 am) o despues del mediodía porque lo visita mucha gente y es dificil poder sacarse buenas fotos con tanta gente. Del resto el lugar es mágico, desde el monumento hasta la vista panorámica de la ciudad.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-09","dataVisitacao":"2023-02-01","comentario":"Increible mirar hacia arriba y ver tal inmensidad del Cristo. Nada que en las fotos se pueda apreciar. La entrada costo 54 reales. (En temporada alta 74 reales) Vale cada centavo. Recomiendo ir bien temprano. Yo llegue 8.30hs y estaba relativamente tranquilo, la fila fluia. Mas tarde ya se complica bastante. El puesto de souvenirs carisimo. Una copita que pague 30 reales, en la ciudad costaba 8!!!\nTodo muy organizado. Nos llevo un auto particular hasta un punto. Y desde ahi te llevan las combis del lugar hasta arriba. Todo funciona a la perfeccion","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-08","dataVisitacao":"2023-02-01","comentario":"This is one of the 7 great wonders of the world and it is wonderful for sure! Don't miss
