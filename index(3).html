 this if you are in Rio.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-07","dataVisitacao":"2023-02-01","comentario":"Absolutely amazing much better than I had anticipated.\nWe got there at 9.30 and it wasn’t too busy we did try to arrive for 8am but there was a huge accident on the way.\nI would say arrive as early as possible and go on a weekday.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-07","dataVisitacao":"2023-02-01","comentario":"Lugar lindo, a mi gusto personal un ícono de río, mucho turista y con un poco de paciencia se logra la buena foto que todos quieren, hay que ir temprano y elegir un día soleado a veces se nubla.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-07","dataVisitacao":"2023-02-01","comentario":"O mais expressivo símbolo do Rio de Janeiro … Da “ castigada” mais sempre linda cidade . Ergue-se a mais de 700 metros e em dias claros ( frequentes no Rio) descortinam-se paisagens maravilhosas . Verdadeiro ícone do Rio . Vale muito a pena a visita … Pôde-se ir de trem pelo plano inclinado a partir do bairro Cosme Velho por entre a mata ( prefiro) ou de Van contratada no local .","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-07","dataVisitacao":"2023-02-01","comentario":"Podes llegar en taxi o Uber al Centro de Visitantes Paneiras,  ahí compras los tickets , ahi está lleno de souvenirs o los podes comprar on line  previamente. Fuimos un lunes en febrero y hay poca demora los días de semana Costo 54 reales  x adulto.  De ahí unas combis propias del parque te llevan al Cristo por un breve camino lleno de vegetación y curvas del cerro.  Bajas y subís unas pocas escaleras y listo.   Se ve toda la ciudad.  La vista es maravillosa.  Sacarse una foto  con el Cristo sin que se cruce otra persona es lo único complicado….  \nEn el centro Paneiras no hay señal por eso debes reprogramar  tu vuelta antes.   Disfruamos en familia la visita:  \nSi no te gusta ir en excursión esta es una manera.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-02-07","dataVisitacao":"2023-02-01","comentario":"A visitação é uma experiência única,a vista é esplêndida. A organização do ambiente é ótima. A visitação fica ainda mais bonita quando o clima está ensolarado.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-06","dataVisitacao":"2022-03-01","comentario":"L'accès se fait en téléphérique, puis il faut monter. Arrivée en haut on est pris d'émotion par la statue, la vue, on ne peut qu'être admiratif de la prouesse des constructeurs.\nVérifier le temps avant la visite car on ne peut profiter de la vue par temps couvert.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-06","dataVisitacao":"2023-02-01","comentario":"If you are over 60 you have a preferential  queue, As the queues are very long if you have not buy the ticket on line. Extraordinary place to visit.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-06","dataVisitacao":"2023-01-01","comentario":"La estatua del Cristo me gustó mucho, pero más que nada la excelente vista de la ciudad que tiene. Hasta puedes ver el Maracaná desde allí.\nNosotros fuimos un domingo y había mucho amontonamiento de personas, así que te recomiendo que hagas la excursión los días de semana cuando hay menos gente.\nAdemás te sugiero que lleves gorra, gafas de sol, protector solar y mucho agua, ya que hace demasiado calor durante el recorrido y a veces hay que esperar para bajar en pleno ☀️","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-06","dataVisitacao":"2023-02-01","comentario":"Best to buy your tickets online in advance as you can skip the long lines. Stopped here as part of a private city tour. The best way to tour the city","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-05","dataVisitacao":"2023-02-01","comentario":"A beautiful place to visit although busy with stunning views of Rio de Janeiro from the top.\nBetter to go with a group as you don’t have to queue as long for the funicular. There are a few gift shops en route","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-05","dataVisitacao":"2023-02-01","comentario":"Es precioso e impresionante. Imperdible paseo. El paisaje y panorama de Río de Janeiro es espectacular. Tiendas con souvenirs también que valen la pena.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-04","dataVisitacao":"2022-12-01","comentario":"Es una parada obligatoria si visitas Rio. Realmente conocer el Cristo desde tan cerca es impactante. El lugar puede ser a veces un poco estrecho debido a la cantidad de turistas que frecuentan la zona, pero no deja de ser un lugar maravilloso que vale la pena conocer y disfrutar. \nTe recomiendo que elijas un día con buen pronóstico del tiempo ya que en un día nublado podés llegar a perderte del mayor atractivo que son las vistas desde ahí. Es el cerro o monte más alto de todo Rio con lo cual se llega a ver la mayor parte de la ciudad, y la vista aérea que tiene es de otro mundo. No hay mucho para hacer en el lugar más que pasear un poco y ver un par de tiendas de regalos ya que el espacio en el cerro es estrecho también. Por lo general es un paseo corto que no requiere de un día entero para hacerlo, incluso con unas horas en la mañana o la tarde es suficiente.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-03","dataVisitacao":"2023-01-01","comentario":"Hermoso el lugar, desde esa altura se ve casi todo rio de janeiro, lo malo es que se junta mucha gente y cuesta sacarse fotos","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-02","dataVisitacao":"2023-02-01","comentario":"Vackert! Vi åkte dit själva, bokade tåget på internet och hämtade ut biljetten vid stationen! Mycket enkelt! Det tar ca 20 min med tåg och sen får man gå upp för en del trappor! Det finns hiss för handikappade! Trotts att vi åkte med första tåget så var det mycket folk där så åk tidigt annars är det kaos där!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-02-01","dataVisitacao":"2023-02-01","comentario":"Voir le christ en vrai est impressionnant, nous avons pris le train pour y aller et nous avons pu profiter de la forêt. Le seul hic est qu’une fois en haut c’est très difficile d’y circuler car énormément énormément de monde visite ce lieu, mais bon c’est normal c’est un incontournable en plus d’être l’une des 7eme merveilles du monde.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-31","dataVisitacao":"2023-01-01","comentario":"Conocer finalmente esta maravilla es algo fenomenal, aunque no seas religioso es un lugar que te llamará la atención sin lugar a dudas, recomendación ir lo más temprano posible, después de las 10am es casi imposible una buena foto, disfruta la vista!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-31","dataVisitacao":"2023-01-01","comentario":"Como o clima no Rio de Janeiro estava bem instável quando fui (19/01 a 25/01) deixei para comprar meu passeio para o Cristo um dia antes, comprei os ingressos pela internet (R$ 121,00, ingresso + trajeto ido e volta para Copacabana). E como estava hospedada em Copacabana, decidi ir pelas Vans Paineiras, pois o ponto de embarque era duas quadras do meu hotel, dando para eu ir a pé tranquilamente.\nBom, comprei o embarque para as 08h30 e cheguei no ponto de embarque às 7h50 e já havia uma fila para validar os bilhetes, e eles só abriram a bilheteria exatamente as 08h, achei isso estranho pq no site dizia que o embarque seria as 08h, logo os serviços de validação dos bilhetes deveriam iniciar antes para ser mais organizado e as pessoas sairem pontualmente. \nMas ok, embarcamos na van e fomos, o trajeto durou uns 20 minutos, e para chegar no Cristo a van dá muitaaaas voltas, então minha dica é: se você tem o estômago fraco como eu, tome um remédio para enjoo antes.\nA primeira van nos deixou no centro de visitação e de lá embarcamos em outra van para subir ao Cristo, e nesse ponto estava tudo bem organizado, com pessoas nos orientado o que fazer.\nFui em um dos primeiros horários e já estava bem cheio e calor, mas o sentimento de estar lá em cima é de muita gratidão. A vista é linda e tem pessoas do mundo inteiro, definitivamente é uma experiência única. Mesmo com tantas pessoas tem como apreciar e tirar boas fotos. \nAchei o embarque de volta com as vans super rápido e organizado.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-30","dataVisitacao":"2023-01-01","comentario":"Fomos no dia 27/01/2023 e foi uma experiência muito legal e bem turística!\nVimos vários vídeos para escolher a melhor forma de chegar até lá e escolhemos ir de trem pela facilidade.\n\nCompramos o ingresso pelo site oficial na noite anterior, no dia pegamos um uber até Cosme Velho, onde é o embarque. Levamos o voucher da compra no celular e lá trocamos pelos tickets. Como chegamos antes do nosso horário (8h20) foi possível adiantar e pegar o das 8h. A subida é bem tranquila e dura cerca de 20 minutos, vai por dentro da mata, mas em alguns momentos é possível ver a paisagem da praia do alto (muito linda!).\n\nLá em cima optamos por ir de elevador e escada rolante até o Cristo. Entre às 8h e 9h tinha bem menos pessoas, mas o céu estava com bastante nuvens, mas a partir das 10h o céu limpou e ficou super azul (e lotou de gente!), rendendo várias fotos lindas.\n\nLá em cima tem um café com vários salgados e bebidas bem gostosas e nem tão caros (6 mini pães de queijo R$12 - por exemplo).\n\nRecomendamos!!","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-30","dataVisitacao":"2023-01-01","comentario":"This is such a famous Rio landmark that it simply can't be missed.  It's worth the ride up to to the top to see the fabulous  views of Rio as well.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-29","dataVisitacao":"2022-06-01","comentario":"Não tem como ir no Rio e não ir no Cristo. Apenas preparem a disposição pois é cheio em época de temporada. A vista é maravilhosa!","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-29","dataVisitacao":"2023-01-01","comentario":"Passeio com ótima vista do Rio. Ir de trenzinho é a melhor opção. Atenção para a lanchonete lá em cima: só abre às 9h da manhã, apesar do passeio turístico iniciar antes. Cheguei lá em cima às 8h e não tinha nenhum lugar que vendesse água aberto. Várias famílias com crianças e com sede. Lembre-se de levar lanche e água. Ninguém se responsabiliza pela reclamação que quis fazer porque são vários serviços setorizados e terceirizados (trenzinho, funcionários lá de cima, lojas). Até entendo, mas onde está a administração geral para alinhar tudo isso e garantir a qualidade do passeio? Não achei bacana ter trenzinho disponível e não ter lanchonete aberta no horário.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-26","dataVisitacao":"2023-01-01","comentario":"Christ the Redeemer is obviously one of the most iconic landmarks in Rio, and it is NOT to be missed. When you learn the history of the statue and how it was constructed, you will be in awe when looking straight up from its feet. Great spot to take photos (not just of the statue, but of the rest of the city as well). Be sure to get there early though, especially in the busy summer months. The crowds can be intense, but I did find that you could still get some great photos, despite the flood of people.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-26","dataVisitacao":"2023-01-01","comentario":"You and a few hundred of your closest friends are vying for picture-taking moments at the top of this mountain.  The Redeemer statue is impressive.  If you have the flexibility, try for a clear day to enjoy the panoramic views.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-25","dataVisitacao":"2023-01-01","comentario":"el tren demora para subir y abordar mucha gente mala organizacion si van con personas adultas o con niños ojo demoras mucho es lindo pero  desde que sacas el pase es una hora o mas aprox para embarcar","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-24","dataVisitacao":"2022-10-01","comentario":"Recomiendo ir al Cristo por su cuenta, ya que así cada uno maneja sus tiempos y no anda corriendo con los tours. Tomen el primer tren que sube porque después hay cientos de personas y es un poco más difícil tomar buenas fotos y andar con tranquilidad.\nNosotros compramos la entrada unos días antes por la página web, la llevamos en el celular, allá pasas por la boletería y te dan el ticket impreso para subir y bajar en el tren. En esta oportunidad no me gustó que te obligarán a tomar fotografía antes de subir (a pesar que dijimos que no en varias oportunidades) y después te la intentan vender a toda costa.\nPara llegar a la entrada del recinto usamos Uber (que es muy recomendable).","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-22","dataVisitacao":"2023-01-01","comentario":"One of those sights you see from afar and wonder what it’s like up close. It’s amazing!  Truly a wonder of the world.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-22","dataVisitacao":"2023-01-01","comentario":"Passeio obrigatório no Rio! Vista linda e olha que nem fomos em dia com céu 100% aberto.  Fomos de trenzinho - interessante mas a vista do trem (que na verdade é igual a um vagão de metrô) é limitada - em pouquíssimos trechos vc consegue ter uma vista mais aberta da cidade, na grande maioria irá ver as árvores no entorno do  trilho.  Se tiver com $ curto compensa ir de van pelas Paineiras, a paisagem que vê no trem não vale o valor pago a mais pela visita.  A parte que poderia ser melhor aproveitada: poucas informações sobre a construção / história da estátua, pouca informação sobre a floresta que o trem atravessa (as poucas informações que vc vai encontrar serão banners e fotos no ponto de embarque na parte de baixo - uma TV com estas informações em diversos idiomas nas áreas de embarque ou no próprio trem ajudaria muito e aliviaria o tempo de espera ). Lá em cima falta opções de cafés e restaurantes, há lugares vazios e lojas com pouco movimento (muito também por preços abusivos).  Enfim: apesar de ser lindo falta profissionalismo para melhor aproveitar o espaço.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-22","dataVisitacao":"2022-12-01","comentario":"This was one of the must sees in Rio, but after seeing it I could have given it a miss.  Its just too crowded and commercialized.  We took one of the first vans up from Copacabana, about a 40 minute ride , and by the time we got there it was already packed, granted it was during the Christmas holidays.  People were getting into all sorts of contortions to get their cell phone shots and you had to watch out you didn't get wacked by people spreading their arms into the pose.  I personally enjoyed the views more from Sugar loaf.  \n\nThe van trip involved 2 stages.  The van from Copacabana brings you to the visitor center, which is like a souvenir/photo emporium.  Enter the building and go all the way to the left where there is a check in counter.  Here they have a video camera showing the view.  If its foggy you can choose not to have your voucher scanned and come another day.  Once you get a ticket you are committed, get your picture taken in front of mural and go down a ramp to catch a van for the 5 minute ride up to the statue.  The van back to the visitor center is well marked.  Back at the visitor center it is amazing how the photo vendors can quickly have your printed photo, even tracking you down if you sprint away.  1 or 2 photos cost R40, which turned out to be a better photos than you could take yourself.  To catch a van back to Copacabana go to the snack bar to the right and there will be a podium outside to check in for the next van down.","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2023-01-21","dataVisitacao":"2023-01-01","comentario":"Muy buenas playas, monumentos, restaurantes, bares...aunque un poco sucia la ciudad.\nSi mejora la info de los buses, más turistas lo usarían, lo que se abarata el costo de la estadía \nMuy recomendable ciudad.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-18","dataVisitacao":"2022-12-01","comentario":"Rio es genial, no hace falta adquirir un plan de turismo hacia el Cristo, se llega muy fácil, la vista es magnífica .\nRecomiendo revisar el clima el día que se vaya a ir, para que tomen un día bien despejado y puedan visitar al 100% la visita","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-18","dataVisitacao":"2022-09-01","comentario":"É um passeio agradável embora um pouco tumultuado, fomos de trem, muito gostoso o passeio. Aos pés do Cristo impossível tirar uma foto legal fica o tempo todo lotado, mas vale muito q pena conhecer, a vista é deslumbrante.. recomendo","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-17","dataVisitacao":"2022-11-01","comentario":"A very busy (to be expected) place to go during a visit to Rio, but off course a must see. Took the train up and enjoyed the views. At the statue there are panoramic views of the city and the many beaches.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-16","dataVisitacao":"2022-12-01","comentario":"Imperdível! Simplesmente as vistas mais bonitas do mundo. Vá no Trem do Corcovado. Vai ter muito motorista de van na porta gritando que nao tem mais trem, que o seguinte só daqui a muitas horas, mas quase sempre nao é verdade. Pegue o primeiro horario possível e, se demorar uma horinha, hora e meia até o seguinte trem, recomendo ir a algum lugar próximo tomar um café até o horario (fomos a um café chamado Capitu ali perto que fica na casa em que morou Machado de Assis - excelente). Já no trem todo mundo vai querer ficar tirando fotos quando as primeiras vistas desde as alturas aparecerem. Nao caiam nessa, esqueçam as cameras e admirem a paisagem. Já lá em cima, tirem fotos à vontade.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-15","dataVisitacao":"2023-01-01","comentario":"Realmente uma emoção indescritível. A vista para a cidade é maravilhosa e a energia do monumento é sensacional. Fui no final de tarde as 16h e já parecia mais vazio, quando tentei ir mais cedo a quantidade de gente era sem dúvidas muito maior. Opção de lojinha, lanchonete e uma área para sentar.  Comprei meus ingressos pela Internet, fui de uber até a estação de embarque do trem (opção que escolhi para subir e de longe me parece de fato a melhor - sem me preocupar com estacionamento ou lotação de vans) e quando cheguei já fui para fila de embarque . Só uma ressalva para esse local de espera dos embarques - embora tivesse alguns ventiladores, muito abafado e sem muita organização. Assim como não tinha organização de fila nenhuma para embarcar no trem - nesse quesito penso que poderiam existir separadores e manter filas mais organizadas.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-15","dataVisitacao":"2023-01-01","comentario":"El parque es muy lindo, lo que sí, está lleno de gente, ir con paciencia. \nContratar por internet antes, sino, hay que hacer 1 hora de cola, mínimo. \nEl ascenso en las vans da la pueta, no incluyen el ticket de ingreso al parque, el ticket del tren, si lo incluye.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-14","dataVisitacao":"2023-01-01","comentario":"Pude subir a este maravilloso lugar con muletas y bota. Cuando el tren llegó, pedí silla de ruedas y personal de seguridad me subió las 2 escaleras mecánicas.. Me dejaron subir una hora antes de lo planeado. Fue un momento unico colmado de una mezcla de emociones. VOLVERÉ CON MIS 2 PIERNAS en óptimo estado!!","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-13","dataVisitacao":"2023-01-01","comentario":"Infelizmente a vista estava ruim devido ao tempo. Mas não tínhamos outro dia pra ir. A subida com o trenzinho foi ótima!!","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-12","dataVisitacao":"2022-12-01","comentario":"Se você pensa em visitar o Cristo pense bem onde estacionar seu carro. Não tem estacionamento perto e os flanelinhas cobram até R$ 100,00 para 'olhar' seu carro com apoio do serviço de trrânsito do Rio! pois é, acreditem! De resto, mesmo o transporte até o Cristo tendo sido de van e não de bonde pois não estavam disponíveis, valeu a vista. Penso que o valor dos ingressos poderiam ser mais acessíveis, não se tem retorno compativel com o valor pago","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-12","dataVisitacao":"2022-04-01","comentario":"Uma das melhores atrações do qual eu já fui, a vista da bela cidade de Rio de Janeiro, um ligar espetácular, pena que é muito lotado","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-12","dataVisitacao":"2022-11-01","comentario":"Attraction immanquable pour tout visiteur de Rio. Attention de ne pas y aller quand le ciel est couvert, vous seriez déçus...","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-12","dataVisitacao":"2023-01-01","comentario":"Após dias de chuva aqui no Rio de Janeiro, o tempo melhorou e finalmente pudemos ir ao Cristo.\n\nChegamos por volta das 10h e estava lotado!\n\nUma fila enorme para subir pelo Trem do Corcovado.\n\nFomos então abordados por um pessoal que vende a subida através de vans, que acabamos comprando, e infelizmente subindo em uma van péssima, sem ar condicionado em um dia muito quente e abafado.\n\nBom, chegando lá em cima, enfrentamos mais uma fila para comprar os ingressos e outra para pegar a van oficial que te leva até o Cristo.\n\nNão fosse estarmos com pessoas idosas em nosso grupo (que possuem prioridade) demoraríamos muito mais.\n\nFinalmente no Cristo, estava muito quente e lotado, mas a imagem do mesmo é linda, e a vista do Rio de Janeiro lá de cima é simplesmente espetacular.\n\nRendeu boas fotos e pronto, iniciamos a “saga” para descer, enfrentando algumas filas novamente.\n\nNo final gastamos em torno de 2h a 3h entre chegar no ponto de embarque do Trem do Corcovado e voltar novamente ao mesmo ponto para pegar nosso UBER para ir almoçar, enquanto que ficamos em torno de apenas 20 min de fato no “pé” do Cristo.\n\nMas valeu a pena, apesar de já ter ido ao Cristo uma vez, especialmente por ter levado meu filho de 10 anos pela primeira vez.\n\nRecomendo o passeio mas sugiro que, ou chegue bem cedo, ou compre seu ingresso pela internet.\n\nImportante lembrar que idosos (acho que acima de 65 anos) possuem grande desconto e prioridade nas filas de embarque, o que percebi que nem todos os idosos ali presentes sabiam disso, pois vi uma senhora bem velhinha na fila comum, e sem nenhuma orientação de quem trabalha lá.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-11","dataVisitacao":"2022-12-01","comentario":"É a cidade mais bonito que já visitei.\nOs miradouros do Corcovado e Pão de Açúcar são magníficos, assim como toda a envolvência da cidade.\nA ligação das praias com a cidade, que por sua vez está cercada pela Floresta Atlântica dá um enquadramento espetacular a toda a cidade. \nRecomendo ainda a visita ao museu do amanhã e um passeio pelo centro da cidade.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-06","dataVisitacao":"2023-01-01","comentario":"O Cristo Redentor é o principal cartão postal do Brasil por isso, impossível conhecer o Rio e não visita-lo. Aconselho somente que compre os ingressos antes pois sempre é muito lotado. Para tirar fotos melhores, o ideal é marcar nos primeiros horários, antes da chegada da multidão de turistas. A vista e o passeio vale mega a pena.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2023-01-05","dataVisitacao":"2022-12-01","comentario":"Maravilhoso mas muito lotado, impossível  se tirar uma foto sem ter dezenas de pessoas nela kkk recomendo ir bem cedo.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-04","dataVisitacao":"2023-01-01","comentario":"La statue du Christ rédempteur est superbe. Nous avons eu la chance d'assister à une demande en mariage qui s'est déroulée aux pieds du Christ ce qui était très émouvant!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2023-01-02","dataVisitacao":"2022-12-01","comentario":"Icono turístico internacional, como tal, hace uno y abuso de dicho título. Hay varias opciones para ir por lo que cada uno debe optar y explorar por su conveniencia y bolsillo las opciones. Familia con hijos chicos fuimos en tour con transporte hasta la cima. Es bueno que consideren que la atracción no es sólo el cristo y lo cierto es que esta bien vestida. Inmerso en el Parque Nacional da Tijuca, es posible ver monos, iguanas y aves si uno lo toma con calma; y acá es donde uno debe elegir en parte el como llegar; porque el camino es dentro de un parque nacional. Otras circunstancias es si está dentro de las posibilidades, elegir un día despejado porque para muchos la vista es más que el cristo y definir cuanto tiempo uno le va a dedicar. La visita en tour suele ser suficiente pero corta para quienes tengan expectativas grandes. En esos casos conviene ir un día liberado de otras actividades y tomarse tiempo para todas las etapas, incluida tiendas de compras y de interpretación. En fin, cado uno deberá estudiar todas las opciones pero sobre todo: saber que pretende de la visita. Si suben un domingo hasta pueden presenciar una misa.  A ponerse a analizar opciones si quieren aprovecharlo.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-12-30","dataVisitacao":"2022-12-01","comentario":"Très belle organisation des entrées, tant pour le Christ Rédempteur que pour le pain de sucre. C'était majestueux. Bravo","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-28","dataVisitacao":"2022-12-01","comentario":"The rain had definitely set in as our little red train made the 20 minute climb through the city's lush, green forest to reach the 'nearly the top' point, then it was an elevator ride, We were now officially at the 'almost at the top' point and it was now just a short escalator ride to the top. We were there! Standing at the feet of this incredible Art Deco masterpiece erected in the 1920s. Smaller than we expected when seen from a distance, even from Sugarloaf. Massive when viewed from the feet of the statue. Apparently during its construction the society ladies of Rio would inscribe the names of the townspeople on the back of the final layer of stone - soapstone from memory. So 100 years down the line those little bits of written history still stand watch over the city. The statue is the official gate to Rio and looks out over the water to Sugarloaf Mountain. Phenomenal visit altogether and we had spare time so walked down the stairs to the train stop which was relaxing (and good for breathing purposes). Back on the train, down through the forest,  All in all a wonderful experience not to be missed.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-27","dataVisitacao":"2022-12-01","comentario":"Took this trip as part of a day long tour through Viator. Not much of a review needed, this is a must see and do not miss out attraction when in Rio. We were there about 10.30am, our mini van drove up through the the rain forest and then at the ticket office you change to a smaller van to ascend to the very top. Once inside the Corcovado there are escalators, stairs or lift to the top and it is extremely busy up there, wild monkeys can appear on the trees next to you. The views are spectacular all around Rio and we were lucky to have such a sunny day. My advice do it as part of a trip as the queues were big and we could skip part of them with our tickets avoiding the queues","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-24","dataVisitacao":"2022-11-01","comentario":"un peu couvert pour pouvoir apprecier Rio à 360° mais il etait bien là....il faut y'aller de bonne heure comme nous , pour éviter la foule et faire de superbe clichés","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-22","dataVisitacao":"2022-03-01","comentario":"On ne passe pas à Rio sans aller voir le Crist rédempteur ! Pas besoin de passer par une agence ou autre, un taxis peut vous enlever en bas du funiculaire qui vous y amènera","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-22","dataVisitacao":"2022-11-01","comentario":"No dia que eu fui estava lotadoooo, mas valeu super a pena\nNa próxima vez que eu for, vou tentar ir na parte da manhã que deve ser mais vazio","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-21","dataVisitacao":"2022-10-01","comentario":"Se puder escolha aquele dia de sol com céu lipinho, mas se tiver umas nuvens esparsas, o clima também é perfeito, pois você pode tomar aquele banho de vapor dágua de brinde.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-12-21","dataVisitacao":"2022-11-01","comentario":"Πήραμε το τραινάκι -τύπου οδοντωτός- που μας ανέβασε στον λόφο, Με την αργή ταχύτητά του κάνει αρκετή ώρα να φτάσει και σου δίνει και την ευκαιρία να απολαύσεις τη διαδρομή μέσα στην πυκνή βλάστιση. Φτάνοντας λίγα μέτρα πιο κάτω, αρχίζεις να απολαμβάνεις τη θέα του Ρίο από ψηλά. Ανεβαίνεις λίγα σκαλιά και βρίσκεσαι μπροστά στο επιβλητικό αυτό άγαλμα περίπου 40 μέτρων -μαζί με τη βάση-, ανάμεσα σε εκατοντάδες κόσμο και στην καλύτερη πανοραμική θέα του Ρίο. Το ίδιο το άγαλμα είναι αρκετά όμορφο αλλά δεν μπορεί να συγκριθεί με τα αγάλματα της ελληνορωμαϊκής περιόδου. Η επίσκεψη στο σημείο νομίζω πως επιβάλεται καθώς είναι το πιο εμβληματικό μνημείο του Ρίο και από τα εμβληματικότερα του κόσμου. Απαραίτητος εξοπλισμός ο καλός καιρός και η φωτογραφική μηχανή.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-20","dataVisitacao":"2022-01-01","comentario":"Voy a Brasil en enero y quisiera saber si es peligroso subir caminando, si al hacerlo es mejor subir por el camino donde van los autos o hacerlo por la trilha parque lage? Cuántas horas son y se paga entrada para el monumento? Está entrada se paga arriba? De cuánto es? He encontrado muy poca información, se agradecen los datos","companhia":"FRIENDS","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-12-17","dataVisitacao":"2022-12-01","comentario":"We bought a “beat the queue ticket” for about £26 each which, it turns out was not really needed, for although we got on the train first, everyone who was waiting got on too, though our seat choice was better.  Only a 20 minute ride to the top and not much of a view on the way up.  Once up the views are amazing providing the clouds let you see anything.  We got a mixed bag, clear views of the statue and mixed of the city, well worth it though","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-16","dataVisitacao":"2022-12-01","comentario":"Une visite exceptionnelle dans le temps, la montée en tramway est spéciale. Depuis longtemps que ce tramway monte et descend cette montagne historique dans le décor de Rio.\nRendu au top, salutations au Christ Rédempteur et remerciement de nous protéger et de nous garder en bonne santé dans un moment de recueillement \nLa statue est gigantesque et pointe dans un ciel extrêmement bleu parsemé de brume matinale. C’est féérique et la vue panoramique sur la baie de Rio est à couper le souffle.\nBonne visite, un incontournable…","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-16","dataVisitacao":"2022-04-01","comentario":"a vista é maravilhosa quando se pega dia limpo. já fui em dia que o céu tava todinho azul e deu pra enxergar o cristo todo, mas já fui em dias que tava nublado e tivemos que esperar abrir um espacinho entre as nuvens pra poder tirar foto do cristo, em dias assim, acaba lotando de gente esperando o tempo abrir.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-15","dataVisitacao":"2022-12-01","comentario":"All absolutely organized when you go there alone! You feel save, you have the best train (a swiss one :-)) and alls Staff takes care of you.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-15","dataVisitacao":"2022-12-01","comentario":"Experiência maravilhosa, o Cristo é um monumento belíssimo, emocionante estar lá pela primeira, primeiro ponto turístico que fui na cidade, lá a ficha realmente caiu de que estava no Rio de Janeiro, amei conhecer uma das 7 maravilhas do mundo. Vale super a pena a visita, mesmo em dia nublado, como o meu.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-13","dataVisitacao":"2022-12-01","comentario":"Lugar lindo,uma visão inesquecível da cidade e da Orla do Rio de janeiro,dentro da estátua há uma capela com missas, há também quiosques de alimentação e lojas com lembranças do local,a subida no trem é maravilhosa com uma paisagem muito bonita.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-12","dataVisitacao":"2022-12-01","comentario":"Did not go as the payment system with trip advisor does not cater for the English\nWhat is a conflict No","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2022-12-08","dataVisitacao":"2022-12-01","comentario":"muita muvuca, pra onde vc olha milhares de pessoas, sem uma ordenação, bagunça do doido, poucos horários do trem  e o valor é um absurdo das galaxias, tudo é para turista americano ou europeu mas eles se esquecem que tem brasileiro tb. é um assalto os valore para usar o trem di empurra pra clandestinidade para subir e descer. Depois reclamam que tem van pirata, tudo tem que ser pirata, por que é impagavel os valores ofertados","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-12-07","dataVisitacao":"2022-11-01","comentario":"getting to the to by the train is an adventure, and the view from the top is breathtaking and unforgettable","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-06","dataVisitacao":"2022-11-01","comentario":"Muito bom. Bela vista. Muitas pessoas. Acesso por elevador, escadaria. E opções de fotos profissionais","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-05","dataVisitacao":"2022-11-01","comentario":"Visiting Corcovado is a must to everyone, but only visit it on a day without clouds, otherwise there is a chance that the statue is not visible...","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-12-03","dataVisitacao":"2022-12-01","comentario":"So this must be seen if you come to Rio. The views are magnificent and the statue is an art deco masterpiece. There are monkeys living up there and will accept food from people but are still wild animals. The platform is crowded with people trying to take the same photograph. It started to rain on us but the cloud cover is still high enough to not obscure the view.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-28","dataVisitacao":"2022-11-01","comentario":"Det finns tre sätt att ta sig dit. Taxi, tåg eller gå...Tåget var förr en upplevelse med öppna vagnar ,idag ett vanligt tåg,,,Taxin tar dig till en samlingsplats med souvenirbutiker  och biljettkassa för busstransport upp till statyn. Det brukar vara långa köer och väntetid.Avsläppt, väntar rulltrappor och vanliga trappor upp till statyn.Vid klart väder är det en fantastisk utsikt över Rio väl värd strapatserna upp.Ned går bussarna  från samma ställe. Ibland går det att åka tåg ned men då brukar det vara lång väntetid.\nFinns en servering, som öppnar 1200.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-27","dataVisitacao":"2022-07-01","comentario":"Una experiencia soñada! Que toda persona debe vivir! ❤️. Fui de manera particular y ahí mismo saqué el ticket para el tren. Fuimos a ultima hora en un momento se oscureció todo y fue magia pura.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-27","dataVisitacao":"2022-11-01","comentario":"Per arrivarci è molto comodo c'è una metro che ti porta direttamente in alto, bisogna solo fare qualche scalino e inizi già a vederlo di spalle. Il biglietto si può fare sia alla cassa in contanti sia nelle macchinette automatiche se si ha la carta, il personale molto gentile e parlano sia spagnolo che inglese(che non è scontato). Quando sono andata a novembre c'era tantissima gente e quindi fare le foto è stata davvero un'impresa. Tralasciando le foto, il panorama era stupendo e stando vicinissimo al Cristo Redentore è stato davvero uno spettacolo.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-24","dataVisitacao":"2022-11-01","comentario":"Maravillosa las vistas logradas de la ciudad de Río, desde el Cristo, éste impresionante su altura, hermoso su entorno con tanta vegetación,  fue una gran experiencia que seguro volvería a repetir. Lo otro importante es la gente de Río, son todos muy amables y te hacen sentir muy cómodo.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-24","dataVisitacao":"2022-11-01","comentario":"Muita gente, difícil até para caminhar e tirar fotos é impossível. Creio que deveria ser limitado um numero de visitantes por dia, ou um tempo para ficar lá em cima, para que a experiência seja boa para todos.","companhia":"NONE","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2022-11-22","dataVisitacao":"2022-11-01","comentario":"Consiglio di salire in cima con il trenino che passa attraverso la foresta. Noi abbiamo acquistato i biglietti un giorno prima, ma tranquillamente lo si può fare anche lì. La vista da lassù è notevole e l’imponenza della statua ti mette un po’ di suggestione! Ho apprezzato molto questo luogo.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-19","dataVisitacao":"2022-11-01","comentario":"Simplesmente mágico, impossível visitar o Rio e não vir no Cristo.\n\nAmamos e com certeza voltaremos em breve.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-19","dataVisitacao":"2022-11-01","comentario":"Lugar maravilhoso, não  é  a toa que é  uma das maravilhas da natureza no planeta.  A vista do Rio é sensacional. Pena que é  um tumulto,  mal conseguimos tirar fotos no Cristo, poderiam controlar o número de pessoas nos pontos de fotos. Pra subir as filas são  bem organizadas. Pra descer achei tumultuado, as filas aglomeram as pessoas, não  gostei, pois estamos num período de pandemia, uma nova variante. Deveriam  organizar  o retorno das pessoas.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-18","dataVisitacao":"2022-11-01","comentario":"Statue clouded in mist on day of our visit, occasionally cloud broke, so that we could see silhouette, cog railway to top was great, all easy to use. If you visit Rio it's a must but expect to be hindered by the weather","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-11-18","dataVisitacao":"2022-11-01","comentario":"O passeio ao Cristo é incrível, mas evite os dias de grande movimento. O acesso ao trem na ida e volta é bem bagunçado ( nos sentimos no acesso ao metro Sé em horario de pico). Muito facil de resolver, basta vontade.   Mas o passeio é muito bacana, vale a experiência, mesmo com o valor bem salgado.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-11-17","dataVisitacao":"2022-11-01","comentario":"Recomiendo ir lo mas temprano posible ya que se llena mucho, llevar agua, tiene escaleras mecanicas y ascensor asi que tranquilamente pueden ir personas mayores y discapacitadas","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-11-17","dataVisitacao":"2022-11-01","comentario":"Uma dica é pegar o bonde que já deixa vocês no direto no cristo ao inves de ir direto de carro não compeça além de ter que pegar filar kilometricas.","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-11-17","dataVisitacao":"2021-12-01","comentario":"Fui 3 en mis tres visitas a la ciudad, la ultima vez fue en enero de 2019, y con cada visita vivo una experiencia nueva y distinta. Suelen celebrarse misas en la capilla que esta debajo del Cristo  y son muy emocionantes sobre todo cuando el Sacerdote sale a bendecir. Una vez presencie un bautismo y fue muy conmovedor. Que decir de las vistas de la ciudad!!!! Parece que estas en el mismo cielo. Conviene hacer el recorrido y llegar hasta allí por tu cuenta y no con tours. Los tickets se compran en Praça do Lido - Copacabana. Son económicos y las combis salen del mismo lugar y te llevan directo al Parque. Una experiencia que no podes dejar de vivir.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-16","dataVisitacao":"2022-11-01","comentario":"La colocacion de un televisor mostrando la estatua en el momento de abordar el tren es un gran aporte !\nGrandioso lugar impactante experiencia , es sin dudas algo que no se puede NO HACER \nLos domingos a las 15 horas hay una Misa Catòlica muy emotiva por el ambiente  y el lugar, a la que pudimos acceder por simple coincidencia ....aunque las coincidencias no existen !\nSuerte a todos","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-15","dataVisitacao":"2022-11-01","comentario":"Muito bonito o passeio. Muito linda a vista. Sem palavras o quanto é bonito la em cima.  Muito chata a galera tirando foto, precisam fazer um book? Quantas fotos realmente são necessárias? Não é possível andar livremente pelo cristo pq se nao atrapalha essa galera chata ai. e os mosquitos nas filas tambem","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-11-15","dataVisitacao":"2022-11-01","comentario":"Quanto a beleza do lugar e a exuberância não tem oque falar!\nQuanto ao serviço caro e mal prestado um absurdo! O serviço é terceiro e feito para abusar do turista! \nInfelizmente não tem concorrência e o poder público ruim e vendido não fiscaliza e os turistas são explorado se mal tratados! Um verdadeiro absurdo com os 2 milhões de visitantes/ano!","companhia":"FAMILY","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2022-11-14","dataVisitacao":"2022-10-01","comentario":"Imposible no ir al Cristo Redentor si estas en Río, un monumento único, una vista de la ciudad insuperable.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-10","dataVisitacao":"2022-03-01","comentario":"Lugar n° 1 para se visitar no Rio. Dica: vá de trem, assim, você aproveita melhor todo o visual do lugar sem ficar se preocupando com algum veículo próprio. Apesar de sempre está lotado com pessoas de todo lugar do mundo, com alguma criatividade você consegue tirar uma foto solo com a estátua kkkkjj. E é impossível descrever toda a beleza vista ao pé dessa maravilha do mundo, só indo mesmo... então... prepare seu roterio e aproveite o Rio!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-08","dataVisitacao":"2022-11-01","comentario":"Las vistas de rio y el imponente Cristo son invaluables, el tren un paseo agradable, intenten ir solo días despejados...","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-08","dataVisitacao":"2022-11-01","comentario":"On ne peut pas passer à Rio sans y monter. Je recommande le petit train qu'il est préférable de réserver sur internet \"trem do corcovado\" La vue sur Rio est juste époustouflante.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-07","dataVisitacao":"2022-03-01","comentario":"Une statue emblématique, un funiculaire hors du temps mais malheureusement beaucoup de trop de monde à toute heure.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-11-07","dataVisitacao":"2021-12-01","comentario":"Uma experiencia unica!! A energia desse lugar e surreal! Todo mundo que vai ao Rio de Janeiro, precisa passar por essa experiencia, não vão se arrepender!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-04","dataVisitacao":"2022-01-01","comentario":"Venha ao Rio, vá ao Cristo. Imperdível! De preferência para subir de bondinho/trem do Corcovado. \n\nVista maravilhosa e uma boa experiência!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-03","dataVisitacao":"2022-10-01","comentario":"Visitamos la estatua del Cristo Redentor, llegamos en tren, un día muy bueno, despejado, con vistas increíbles a casi todo Río. Como siempre, mucha gente, pero se disfruta igual. Hay que visitarlo alguna vez.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-02","dataVisitacao":"2022-02-01","comentario":"Questa grande statua di Cristo a braccia aperte è una delle icone di Rio de Janeiro assieme al Pan di Zucchero. Costruita in cemento in stile Art Deco circa un secolo fa, si nota da vari punti della città. Vita tante volte quanti sono stati i miei viaggi a Rio ma è sempre un bel colpo d’occhio.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-11-01","dataVisitacao":"2022-10-01","comentario":"incontournable carioca, cette montagne surmontée d'un christ rédempteur est accessible depuis un train à crémalière qui démarre environ toutes les quinze ou vingt minutes. Sur place, un ascenseur vous mène aux pieds de la chose entourée d'un trop grand nombre de touristes mongolo-fétichistes du selfie. En gros disney chez les cariocas. A éviter","companhia":"NONE","pontuacao":2},{"atracao":"Cristo","dataPublicacao":"2022-10-28","dataVisitacao":"2022-10-01","comentario":"A ne pas rater. Statue très impressionnante lorsqu'on est à ses pieds. Il y a toujours du monde et pour les photos ........ Vue magnifique sur le Maracana, le Pain de Sucre, la plage de Copacabvana et la baie de Rio","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-27","dataVisitacao":"2022-10-01","comentario":"Totally awesome experience, if you go to Rio you have to go to see Christ the Redeemer Statue- you can climb the stairs or take an elevator - no excuses.","companhia":"SOLO","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-26","dataVisitacao":"2022-10-01","comentario":"Totally worth seeing. Take an Uber or a taxi to the bottom of the entryway. Then take the train I’ve been back it’s a great experience.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-25","dataVisitacao":"2022-07-01","comentario":"A vista é indescritível. Sentir-se nos pés do Cristo é digno de agradecimentos, mas tem muita gente mesmo! É impossível caminhar ou aproveitar o momento como deveria ser. Impossível tirar foto sem muitas pessoas atrás. Vale a experiência mas vá cedo e com paciência.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-10-25","dataVisitacao":"2022-10-01","comentario":"Must see, met prachtig uitzicht over Rio de Janeiro. Indrukwekkend groot standbeeld van 30 meter plus 8 meter sokkel, dwz totaal 38 meter hoog. Op de Corcovado berg die uitkijkt op vrijwel geheel Rio. Wel heel erg toeristisch met zoveel toeristen, die vrijwel allemaal selfies maken, of zichzelf op de foto willen zetten, met het beeld op de achtergrond.","companhia":"COUPLES","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-10-24","dataVisitacao":"2021-11-01","comentario":"Pior ponto turístico desse país, literalmente um mar de gente, caro pra caramba, tudo lá é caro, tu sobe um morro gigante e depois cai numa zona perigosa. Não vale o investimento.","companhia":"NONE","pontuacao":1},{"atracao":"Cristo","dataPublicacao":"2022-10-23","dataVisitacao":"2022-10-01","comentario":"Essa lugar da a perspectiva de Deus, ao criar o mundo e sua satisfação ao terminar sua casa, chamada de cidade maravilhosa de São Sebastião do Rio de Janeiro.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-22","dataVisitacao":"2022-08-01","comentario":"Se você for ao Rio de Janeiro e não for ao Corcovado, você não foi ao Rio. Apesar de eu ter ido no inverno, e pegar tempo fechado, a experiência toda vale muito a pena. Cuidado com os preços exorbitantes no centro de visitantes, você pode encontrar os mesmos itens por 1/10 do valor nas feirinha de Copacabana e Ipanema.","companhia":"FRIENDS","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-10-20","dataVisitacao":"2022-10-01","comentario":"Would recommend to go on a clear day, view is amazing from the top. We got an Uber to the visitors centre and walked up from there which was perfect. The trail was about 3km and took 45min. You can then buy a ticket at the entrance of the statue. On the way down you can walk it but we decided for a train ticket R$30 pp.","companhia":"SOLO","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-10-19","dataVisitacao":"2022-09-01","comentario":"As touristy as it sounds, it's something that one has to try. The experience is absolutely unique and thrilling. The statue of Jesus the Redeemer is impressive and the trip up to the top of the mountain is a nice experience by itself. Typically, the van makes a few stops at some great vista points. Once on top, the view is breathtaking and the few small souvenir and coffee shops can help make your day even more enjoyable. I do recommend it!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-18","dataVisitacao":"2021-11-01","comentario":"Nossa visita ao Cristo foi ótima, fomos com o serviço de transporte Paineiras, foram muito pontuais e o trajeto tranquilo. A estrutura no Cristo Redentor é boa, e a vista um espetáculo","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-15","dataVisitacao":"2022-07-01","comentario":"A vista do Corcovado já seria linda, mas fica ainda mais emocionante por estar no acolhimento dos braços do Cristo Redentor.\nO trenzinho que conduz ao alto da montanha é pitoresco, organizado. E passa por um caminho no meio de uma\nFloresta. Pudemos o  comprar o ingresso antes pela internet facilmente. Acho imperdível!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-14","dataVisitacao":"2022-06-01","comentario":"Eu sou suspeita, Cristo Redentor tem todo meu coração. Além da paisagem, o significado que carrega consigo faz com que a experiência seja ainda mais incrível. Uma paragem obrigatória todos os anos!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-13","dataVisitacao":"2022-04-01","comentario":"Paisagem de tirar o fôlego. Experiência incrível. Translado até lá foi tranquilo, subimos de van, estávamos com carrinho de bebê, foi tranquilo demais.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-11","dataVisitacao":"2022-10-01","comentario":"Hermoso lugar! Bella vista. Hay que ir bien temprano para sacar lindas fotos. Abre 8am y esperar día despejado. Fui en taxi, nos espero 1h y media y nos regreso al hotel por 120 Rs","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-11","dataVisitacao":"2022-10-01","comentario":"Nosotros fuimos en septiembre y llegamos a la base al mediodía,a la estación del tren del corcovado que es el que sube,si bien te ofrecen vans para subir nosotros elegimos el tren para experimentar ese transporte y es más barato lo único qué hay que hacer fila pero la verdad que vale mucho la pena,y al llegar había muchísima gente y eso que fuimos en temporada baja,hay que buscar lugar para sacarse la Foto  adecuada,vallan con  paciencia y tiempo,IMPRESIONANTE EL CRISTO es algo único","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-08","dataVisitacao":"2022-09-01","comentario":"Tanto para los creyentes como para los que no lo son es un lugar realmente hermoso… la estatua es hermosa arquitectónicamente y el lugar en el que esta emplazada es fenomenal, contando con unas vistas paradisiacas… un imperdible de Rio y sin duda un lugar que merece ser visitado.\n100% recomendable!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-07","dataVisitacao":"2022-09-01","comentario":"Uma das 7 maravilhas do mundo, o Cristo Redentor, é único você não pode vir ao rio, é não vim conhecer, o cristo, é uma parada obrigatória. super indo chegarem cedo, porque é muito lotado, mais vale muito a pena cada segundo o rio de janeiro, continua lindo I love  you rio...","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-07","dataVisitacao":"2022-09-01","comentario":"Visiting this iconic statue was the main reason i chose to visit Rio. The process was a bit tedious and that train takes forever to reach the top. There are throngs of other tourists there so getting a decent photo wasnt easy....and be prepared for those steps!","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-10-06","dataVisitacao":"2022-08-01","comentario":"Eu já fui ao Cristo de de táxi, de trem e de van (Paineiras-Corcovado). Achei que esta última foi a opção mais econômica.\n\nO embarque pode ser feito na Praça do Lido em Copacabana, na Praça do Largo do Machado ou mesmo no próprio Centro de Visitantes Paineiras.\n\nCusta R$ 95 (ida/volta e ingresso para o Cristo Redentor), com parada no Centro de Visitantes Paineiras, onde tem lanchonete, banheiros limpos e uma loja de lembrancinhas bem grande.\n\nFunciona todos os dias, a partir das 8h, com saídas a cada 30 min, até às 15h.\n\nNo dia em que fui cheguei cedo ao ponto de embarque (Largo do Machado), mas a van já estava lotada e tive que aguardar 30 minutos até a próxima saída.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-05","dataVisitacao":"2022-04-01","comentario":"O que todos admiram. Pão de açúcar, o Cristo. Andar pelo calçadão de Copacabana à noite e depois comer um galeto assado e tomar chopp.\nVisitar uma quadra de escola de samba. Fui na do Salgueiro e vila Isabel.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-05","dataVisitacao":"2022-09-01","comentario":"This is a must see if you are in Rio.   The train ride up the side of the mountain was incredible.  Once at the top you can see forever.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-03","dataVisitacao":"2022-09-01","comentario":"Incredible experience! The train ride through the Tijuca Forest was beautiful in and of itself, then you get to the top of the mountain and see a Wonder of the World. Highly recommend.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-10-02","dataVisitacao":"2022-09-01","comentario":"The train ride up is just incredible, if not really busy! Not a place to reflect as there is a lot going on, and a lot of people posing for the Gram, but a must see, one of the modern wonders of the world.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-09-29","dataVisitacao":"2022-09-01","comentario":"Que sensação incrível conhecer essa maravilha!\n\nCompramos o ingresso do trem antecipado pela internet. Vale a pena para conseguir se programar bem.\n\nComo o dia estava com tempo chuvoso não tinha fila e conseguimos estacionar na rua ao lado.\nA visita foi totalmente tranquila e sem stress.\n\nO ponto ruim é que a visibilidade estava péssima e não foi possível visualizar toda a beleza do Rio de Janeiro. Achei que legal que os funcionários informaram antes de acessamos e inclusive ofereceram a remarcação da visita.\nComo era nosso último dia fomos mesmos assim.\n\nA baixa visibilidade só aumentou o desejo de retornar!\n\nVale muito a pena o passeio!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-29","dataVisitacao":"2022-09-01","comentario":"It is really #1 attraction in this city and World Wonder. Traveling to Corcovado on train was just an amazing experience.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-28","dataVisitacao":"2022-09-01","comentario":"Deveriam agendar as visitas, limitar o acesso.\nImpossível andar lá encima.\nNão tem acesso total a cadeirantes.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-09-28","dataVisitacao":"2021-10-01","comentario":"local incrivel, com uma vista espetacular, tivemos a sorte de ir em um dia de sol, sem nuvem, a vista do Cristo estava maravilhosa. o unico ponto negativo e que as lanchonetes estavam fechada.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-28","dataVisitacao":"2022-09-01","comentario":"Cuidado si van en auto...el Google Map te lleva literalmente hacia arriba...\nPero cuando estas por subir existe gente que te dice que tenes que ir con ellos ..\nLo aconsejable es dejar al auto a pocas cuadras que hay lugar en la calle ...busquen!!!  y se toman el tren del corcovado  .","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-27","dataVisitacao":"2022-09-01","comentario":"I will probably get hammered for not giving five stars but Corcovado is just too crowded.  Then you have the idiots who are trying for the perfect photo so they will get in your way or cut you off or be impatient and rude with you.  If you do not mind the crowds though then you will love it here.  One funny experience this time was a troop of monkeys arrived and begged for food.  The dummies from Europe were so amazed so they complied by giving food (which is a big no-no) and then they almost caused a few accidents with other tourists because they were trying to get some great photos or videos for themselves.  Karma really should have had one of those monkeys but their fingers or steal their phone!  As for the good, Christ has a magic about him, the views are awesome, it is cool to say you have been, and the train ride is a fun experience.  I said in my review of Sugarloaf it is better to get there early or late but for Corcovado then it is a must.  I went around 3 and it was still pretty crowded so if you can wait for like 4 or after then that is probably the sweet spot but the sun will be setting so that is the downside of waiting.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-09-26","dataVisitacao":"2022-09-01","comentario":"Iconic Rio landmark. Is it jam packed with tourists? Yes. Is it worth it? YES! I took the Swiss made mountain train through the rain forest, and it worth worth it. Nice ride. At the site of the Christ the Redeemer statue, there are the very best views of Rio... which must be the big city with the best natural settings I have ever seen... and I have seen quite a few. Don't forget to look for the cute but naughty monkeys. And don't feed them!!! If you you offer them your finger, they will take your arm!!!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-26","dataVisitacao":"2022-09-01","comentario":"Todas as pessoas que vão para o Rio de janeiro precisam ir no cristo redentor, porém escolham dias que estejam extremamente ensolarado, para que vejam de fato a vista maravilhosa,  de preferência durante a semana, pois subi no sábado depois de alguns dias que estava fazendo duas nublados então estava lotado. Queria ter subido pelo trem do corcovado, pois considero a melhor opção, já que você paga 119,00 e ele te deixa nos pés do Cristo redentor. Desse modo oriento que comprem antecipadamente através do site ou aplicativo do corcovado. Eu subi com os carros credenciados pagamos 60,00 por pessoa, mais o valor do ingresso de 80,00. Nesse trajeto para no heliponto e mirante dona marta, o qual é bem bonito e vale muito a pena para fazer fotos, mas SÓ, pois depois precisa enfrentar fila para comprar o ingresso, enfrentar fila para subir na Van até o cristo e fila para esperar a Van para descer. Além do fato que na hora de descer o motorista do carro que pagamos 60,00 disse que teria uma Van esperando a gente, mas a fila estava enorme e não tínhamos informações se de fato era aquele local. Esperamos uns 20 min e nada. \nTivemos que chamar uber e gastamos mais 40,00.\n\nO cristo é lindo, vista linda porém lotado.\n\nAh quando chegarem no cristo não subam as escadarias, tem elevador e escada rolante.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-09-26","dataVisitacao":"2022-09-01","comentario":"Little words needed......Amazing! But I would say if you buy the skip the que tickets, ask for help at the bottom station so you go to the right bit. A must, we done this during the morning and saw the sun set on Sugar Loaf. Right way around we thought!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-26","dataVisitacao":"2022-04-01","comentario":"o Rio de Janeiro continua lindo, e este é o lugar mais lindo do Rio, nos preferimos subir de trenzinho que chega mais rápido","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-25","dataVisitacao":"2022-09-01","comentario":"Uma das maravilhas do Mundo. Prefira ir mais cedo possível.  Estava muito cheio con uma demora de subida de Van 1 hora. Em cima uma vista bela mas não dá para aproveitar devido estar cheio. Muita gente no mesmo espaço tentando fotos. O Cristo é fantástico, muito belo e passa uma imagem de poderoso.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-20","dataVisitacao":"2022-09-01","comentario":"O passeio no Corcovado é lindo demais!!! Sugiro ver o tempo antes de ir, pois é legal que não tenha nuvem por perto!!!","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-19","dataVisitacao":"2022-09-01","comentario":"Nota máxima para a estrutura e beleza do monumento! De fato, é um monumento imponente e com uma vista exuberante da cidade, mas os impostores travestidos de guia turístico acabam com a experiência.\n\nAo chegar no \"pé\" do corcovado, no local de subida do trem, o turista é abordado com falácias acerca da demora do mesmo, sendo induzido a utilizar os serviços das vans que ali estão estacionadas, por um preço relativamente abaixo do valor cobrado pelo trem. Todavia, a Van, por módicos 75 reais, tão somente leva o turista à bilheteria de acesso ao Cristo, uma vez que, DIFERENTEMENTE do que é explicado na abordagem, ela não garante o ingresso, sendo necessário compra-lo para entrar na atração. Ao desembaarcar da Van, com muita cara de pau, mais alguns sujeitos ainda tentam passar a perna no turista ofertando espécies de fura filas, na expectativa de enganar mais alguns desavisados. Detalhe que todos estão uniformizados e se dizem ser guias turísticos, mas não passam de picaretas.","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-09-17","dataVisitacao":"2022-08-01","comentario":"Minha parte favorita foi a vista do local !\nHá uma disputa muito grande,por parte dos locais, para transporte dos turistas até\no Cristo Redentor. Pode-se ir de Bondinho,de carro ou Vans!\nAntes de subir à pé,eles pedem para passar numa sala para que seja tirada uma foto \"Oficial\",(a foto \"Oficial\"será oferecida á você por 50 reais na volta),em frente á\num Banner com a foto do Cristo!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-17","dataVisitacao":"2022-08-01","comentario":"It was very crowded the day we went (mainly because it was sunny and perfectly clear) but still was a great experience.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-16","dataVisitacao":"2022-09-01","comentario":"Local com uma vista fantástica da cidade do Rio de Janeiro. Excelente passeio para quem viaja em família. Recomendo!","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-15","dataVisitacao":"2021-10-01","comentario":"O Cristo é incrível e a vista é tão maravilhosa que vc já sai com vontade de retornar! \nPasseio obrigatório ao visitar o RJ \nEscolhi subir com as vans para o Corcovado mas quero voltar para ter a experiência com a subida de trem que vem por outro caminho. \nRecomendo!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-15","dataVisitacao":"2022-09-01","comentario":"impressionante como o Cristo Redentor te energiza e faz você ter noção da sua grandeza. Só quem já viu essa beleza incrível do Rio de Janeiro sabe do que estou falando. A sua presença é extremamente marcante!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-14","dataVisitacao":"2022-05-01","comentario":"Hay que ir en taxi, que te espere para bajar con seguridad. La subida por la Floresta de Tijuca precisa que alguien te guie.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-09-14","dataVisitacao":"2022-09-01","comentario":"É um ponto turístico maravilhoso, tem uma vista muito linda. A acessibilidade do local é boa, um cadeirante consegue chegar próximo a estátua do Cristo Redentor sem problemas, os funcionários do local são muito atenciosos e prestativos, auxiliando as pessoas com deficiência em todo o deslocamento. Fomos no primeiro horário, 08:00 horas e já havia bastante gente, mesmo assim, conseguimos fazer fotos lindas. Passeio inesquecível.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-13","dataVisitacao":"2022-07-01","comentario":"O monumento e a vista sao incriveis, mas a organizacao do local deixa um pouco a desejar, nao tem local para estacionar e isso voce so descobre la na hora. Tive que estacionar no morro e subir de moto, servico oferecido assim que vc chega no local, nao eh um servico do parque, eh tudo pago a parte... tive que pagar 70,00!!!\nPara entrar no local, nao tem fila de quem ja tem ingresso e quem nao tem, fica tudo misturado, la dentro tem essa separacao, mas no dia que fui, o guiche que era para validar os ingressos de quem havia comprado pela internet nao estava funcionado e ficamos atras das pessoas que nao tinham ingresso ainda, ou seja, quem se programou entrou depois de quem comprou na hora. Achei isso bem desorganizado.\nParece tambme que nao precisa descer van para subir outras pessoas, vao subindo ate quando cabe, ate o local ficar bem cheio mesmo.","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-09-13","dataVisitacao":"2022-08-01","comentario":"waouw , une vue spendide sur Rio. Activité à faire par temps clair ce qui nous permet d'avoir une magnifique vue sur la ville.\nY aller tôt le matin pour éviter la foule","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-12","dataVisitacao":"2021-11-01","comentario":"Não ir ao Cristo é como ir à praia e não entrar no mar, vale a pena subir cada degrau, lembre-se de levar água.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-11","dataVisitacao":"2021-10-01","comentario":"This is one of the highlights of going to Rio De Janeiro.  Unfortunately, the fog was too thick on that day that Christ the Redeemer was only partially visible as you get closer.  Pictures were not adequate to describe the feeling of ‘heavenly.’","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-11","dataVisitacao":"2022-08-01","comentario":"Despite the fact this site is a major tourist Mecca, I highly recommend spending time here. The site is very well organized and includes a large pavilion with clean restrooms, a gift shop and snack bar. You can walk 200 steps to the top or take an elevator. It’s an easy walk. Once at the foot of the statue you will be amazed at the breathtaking views. 360 degrees! You see the ocean, bay, lagoon and the city of Rio in all its glory, including the top of Sugarloaf Mt! Truly spectacular and a don’t miss! If you are not with a guide, take time to read up on the statue to better understand what you are looking at. And if time allows, be sure and stop at Parque da Tijuca on the way down.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-09","dataVisitacao":"2022-09-01","comentario":"Maravilhoso , vale a pena a visita , local organizado e com uma vista exuberante ,  passeio rápido mas que vale a pena","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-07","dataVisitacao":"2022-09-01","comentario":"A vista mais linda do Rio de Janeiro!!! Descobri que embaixo do Cristo tem uma capela de Nossa Senhora da Aparecida!!! Incrível!!!","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-07","dataVisitacao":"2022-09-01","comentario":"Acesso ruim e demorado. Longas filas e longa espera tanto na ida quanto na volta. Serviço ruim em geral. Por outro lado vista maravilhosa e experiência ímpar.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-09-06","dataVisitacao":"2022-08-01","comentario":"muito tumulto durante o passeio, tirando que não pude ver quase nada, por conta da visibilidade, fiquei horas esperando pra ver o Cristo e fiquei frustrada. E não sou cristã também","companhia":"FAMILY","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-09-06","dataVisitacao":"2022-09-01","comentario":"Compramos online p ir um sábado pela manhã. Te colocam em uma fila imensa com pessoas que não compraram ingresso. E mesmo comprando online precisa ficar na fila pra trocar o voucher. Para só depois entrar no trem. Vá com tempo e disposição para esperar na fila aos finais de semana. O Cristo é lindo, a vista é demais!","companhia":"COUPLES","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-09-05","dataVisitacao":"2022-08-01","comentario":"One of the 7 Wonders of the World- so of course it is an AWESOME place to visit..  \n\nThe statue sits atop Mount Corcovado so it can be seen from all over Rio.  It rises up over 125 feet.  Very Art Deco.  Simple, yet majestic.\n\nThe views are spectacular.  \n\nThe downside- rude crowds that hog the platform bringing photographers to take hundreds of photos of them posing in many different directions.  They even lay down on the ground not allowing others to walk through.  I recommend early morning - 1st in line on a weekday.  I also recommend allowing those in front three or four photos then walk on in front of them.  This sight is for everyone to cherish and enjoy, not a few silly young girls who don’t look beyond the camera to see what’s in front of them.\n\nThis is a must do if you’re anywhere close to Rio.","companhia":"FRIENDS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-05","dataVisitacao":"2022-01-01","comentario":"Fomos lá no meu aniversário de casamento e gostei muito, o melhor horário é de manhã bem cedo pois dá pra tirar as melhores fotos(sem muita gente em volta) pegamos a van no largo do machado, próximo a saída do metrô, quem é cidadão carioca tem  desconto no ingresso e é uma opção conhecer o ponto turistico mais famoso do RJ.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-09-04","dataVisitacao":"2021-11-01","comentario":"O primeiro passeio que todos os turistas devem fazer no Rio. Uma visão geral da cidade aos pés da sétima  maravilha do Mundo.","companhia":"BUSINESS","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-03","dataVisitacao":"2022-08-01","comentario":"Un lugar de no perderse en visitar, super buena experiencia en un lugar icónico de Rio y de todo Brazil.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-09-03","dataVisitacao":"2021-10-01","comentario":"o cristo é um passeio obrigatório no Rio de  Janeiro, e bem mais gostoso subir de bondinho, dica vá nas primeiras horas do dia , para poder fazer fotos legais","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-09-01","dataVisitacao":"2022-08-01","comentario":"Tudo muito lindo, vista maravilhosa, peguei o trem pra termos a experiência completa e valeu muito a pena, super seguro e emocionante.","companhia":"FAMILY","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-31","dataVisitacao":"2022-08-01","comentario":"Once again Rio did not fail to amaze me on this experience. What breathtaking views of all of Rio from the top! Also Christ the Redeemer is so big and pictures do it absolutely no justice. I am glad we went at 0900 am because it was not very crowded and we got up to the top extremely quick. Also the weather was in the 60’s so it was perfect. Enjoy the views, take as many photos as you can.","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-30","dataVisitacao":"2022-01-01","comentario":"A vista é de tirar o fôlego! Mas o Cristo mesmo deixa a desejar. É menor do que eu pensava e tinha muita gente. Muito lotado. O trem que nos leva morro acima demora a chegar. Vá sem pressa e preparado para enfrentar grandes tumultos.","companhia":"FAMILY","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-08-30","dataVisitacao":"2022-08-01","comentario":"It is nice to be up there, but you have to be up by 8:30, or it is way too crowded. Get a tour to purchase tickets in advance","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-29","dataVisitacao":"2022-08-01","comentario":"recomiendo tomar el tren que sube al cristo, muy lindos paisajes\ny si estás con auto llegar hasta la estación misma, estacionas en la calle","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-29","dataVisitacao":"2022-08-01","comentario":"We visited Christ the Redeemer on a morning before the mad rush so it wasn't too busy. The statue itself is very impressive but add in the view and this is an incredible place. Go early and take in one of the wonders of the world!","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-29","dataVisitacao":"2022-08-01","comentario":"Es un MUST de Rio! Sin embargo la cantidad de gente es un poco molesta.  Se debe subir en un día despejado para poder admirar la belleza del lugar.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-08-29","dataVisitacao":"2022-08-01","comentario":"Fomos pela \"Paineiras\" e saímos do Largo do Machado. A estrutura é excelente e vale muito a pena a visita. Mas, vá com calma e com tempo, porque é demorado e há muitos pessoas visitando.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-29","dataVisitacao":"2022-08-01","comentario":"É uma experiência praticamente obrigatória pra quem visita o RJ pela primeira vez. O preço é bem salgado,  mas se conseguir ir de segunda a sexta fica um pouco mais em conta. O trem desde a subida já proporciona vistas lindas ( fique no lado direito). Do alto se tem noção da grandeza. Vista indescritível","companhia":"COUPLES","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-25","dataVisitacao":"2022-08-01","comentario":"Fantastic experience, from start to finish. Pick a sunny day and board the train. No online booking needed, save your money.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-25","dataVisitacao":"2022-08-01","comentario":"Fuí con excursión y en mi opinión el tiempo que estuvimos fué el adecuado podes sacarte miles de fotos. No se lo pierdan","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-22","dataVisitacao":"2022-08-01","comentario":"Fomos de trenzinho, em uma viagem curta de 12\". Linda a paisagem. O local é fantástico, que oferece uma vista única, conhecida em todo o mundo.\nO que lamento é a absoluta falta de estrutura: não há local para ficar em dias de chuvas, pessoal é pouco atento, poderiam ser mais hospitaleiros. Acessibilidade ainda precisa melhorar bastante. Estava com uma senhora de 94 anos e a escada rolante desligada - um absurdo total. Perguntados se ligariam a escada rolante, a resposta do funcionário foi áspera e negativa. Decepção.\nO que vale é a vista. Infelizmente, o Brasileiro precisa ainda aprender a receber turistas - este é o principal ponto turístico do Brasil - não deveria ser assim. Sai de lá despontado pela falta de educação. A vista, não há palavras - e graças a Deus não depende dos cariocas!","companhia":"NONE","pontuacao":3},{"atracao":"Cristo","dataPublicacao":"2022-08-21","dataVisitacao":"2022-07-01","comentario":"Très très bien organisé il y as beaucoup beaucoup de monde,on fait la queue après des mini van  nous monte jusqu’à la statue.une fois là-haut les nuages ☁️ sont omni présent tellement que c’est haut.la vue est magnifique et immense.très très propre il y as de quoi se restaurer.et acheté des souvenirs.vraiment très belle endroit ❤️❤️❤️","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-16","dataVisitacao":"2022-08-01","comentario":"Visita necessária. Vista espetacular, mas nada demais em relação a infra estrutura. Optei pelo acesso de trem em um domingo e faltou bastante organização nas filas na ida e volta e informações confusas pelo pessoal do apoio.","companhia":"NONE","pontuacao":4},{"atracao":"Cristo","dataPublicacao":"2022-08-16","dataVisitacao":"2022-08-01","comentario":"Prices high for Brazilians but OK for visitors from abroad. The travl by bondinho (tram) through the majestic tropical forest and then, prepare to see a view that is just amazing. One for the bucket list !","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-14","dataVisitacao":"2022-07-01","comentario":"Esse é um lugar que não pode faltar na lista de quem vai ao Rio pela primeira vez. E o ideal é realmente ir pelo oficial mesmo, não importa se é de trem ou de van. Por falar em van, ela tá em 3 endereços, e saímos pelo ponto do Largo do Machado. O processo todo pra chegar ao cristo pode soar meio burocrático, mas achei tbm muito seguro. Surpreendentemente tá preparado pra receber pessoas com mobilidade reduzida e tem lojinha e café lá encima. O ponto base de exploração é uma loja enorme, mas que tem produtos meio caro pra quem paga em real. A vista de lá de cima é simplesmente impressionante, muito bonita. E pros mais religiosos tem a capela na base. Tava lotado como achei que estaria (e olha que tem gente que disse não tava tão lotado assim :o), mas mesmo assim vale muito a pena ir.","companhia":"NONE","pontuacao":5},{"atracao":"Cristo","dataPublicacao":"2022-08-12","dataVisitacao":"2022-06-01","comentario":"Um local EXTREMAMENTE turístico, onde as pessoas se estapeiam para poder tirar uma foto com a estátua, se não quiser ninguém invadindo sua foto.\n\nOs guias de turismo se acham donos do local e de forma grotesca e boçal, invadem as fotos das outras pess
